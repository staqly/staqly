packages:
  - apps/*
  - sdks/*
  - e2e
  - packages/*
# Packages whose install scripts may run (pnpm blocks the rest).
allowBuilds:
  # posthog-js's polyfills: the install step only prints a banner.
  core-js: false
  esbuild: true

# pnpm refuses releases younger than a day (supply-chain safety). Exact
# versions installed before they were a day old are listed here; prune the
# list when bumping.
minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.17.2'
  - '@oxfmt/binding-android-arm-eabi@0.73.0'
  - '@oxfmt/binding-android-arm64@0.73.0'
  - '@oxfmt/binding-darwin-arm64@0.73.0'
  - '@oxfmt/binding-darwin-x64@0.73.0'
  - '@oxfmt/binding-freebsd-x64@0.73.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.73.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.73.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.73.0'
  - '@oxfmt/binding-linux-arm64-musl@0.73.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.73.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.73.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.73.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.73.0'
  - '@oxfmt/binding-linux-x64-gnu@0.73.0'
  - '@oxfmt/binding-linux-x64-musl@0.73.0'
  - '@oxfmt/binding-openharmony-arm64@0.73.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.73.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.73.0'
  - '@oxfmt/binding-win32-x64-msvc@0.73.0'
  - '@oxlint/binding-android-arm-eabi@1.88.0'
  - '@oxlint/binding-android-arm64@1.88.0'
  - '@oxlint/binding-darwin-arm64@1.88.0'
  - '@oxlint/binding-darwin-x64@1.88.0'
  - '@oxlint/binding-freebsd-x64@1.88.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.88.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.88.0'
  - '@oxlint/binding-linux-arm64-gnu@1.88.0'
  - '@oxlint/binding-linux-arm64-musl@1.88.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.88.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.88.0'
  - '@oxlint/binding-linux-riscv64-musl@1.88.0'
  - '@oxlint/binding-linux-s390x-gnu@1.88.0'
  - '@oxlint/binding-linux-x64-gnu@1.88.0'
  - '@oxlint/binding-linux-x64-musl@1.88.0'
  - '@oxlint/binding-openharmony-arm64@1.88.0'
  - '@oxlint/binding-win32-arm64-msvc@1.88.0'
  - '@oxlint/binding-win32-ia32-msvc@1.88.0'
  - '@oxlint/binding-win32-x64-msvc@1.88.0'
  - '@testing-library/user-event@14.6.8'
  - '@turbo/darwin-64@2.11.8'
  - '@turbo/darwin-arm64@2.11.8'
  - '@turbo/linux-64@2.11.8'
  - '@turbo/linux-arm64@2.11.8'
  - '@turbo/windows-64@2.11.8'
  - '@turbo/windows-arm64@2.11.8'
  - fumadocs-core@16.17.2
  - fumadocs-openapi@12.4.2
  - lucide-react@1.56.0
  - mermaid@12.2.0
  - oxfmt@0.73.0
  - oxlint@1.88.0
  - turbo@2.11.8
  - '@redocly/cli@2.63.0'

# fumadocs-openapi renders a Unicode ellipsis (U+2026) in its schema breadcrumb and the playground's object
# preview, with no option to change it; the docs never show that character, so the patch makes it "...".
# Re-check (and drop or redo with `pnpm patch`) when bumping fumadocs-openapi.
patchedDependencies:
  fumadocs-openapi@12.5.3: apps/docs/patches/fumadocs-openapi@12.5.3.patch

overrides:
  # @scalar/json-magic (docs build only) pins undici 7.29.1 exactly; 7.30.1 fixes its advisories. Drop when it moves on.
  'undici@7.29.1': 7.30.1
  # express 5.3 (via @modelcontextprotocol/sdk, shadcn's CLI: dashboard dev only) takes body-parser ^2.3; 2.4.0 fixes
  # a DoS on trailing bytes after a compressed body. Drop when express requires it.
  'body-parser@<2.4.0': ^2.4.0
