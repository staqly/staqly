# The dashboard in a real browser (e2e/ui: Playwright + axe, every page, dialog and menu in light and dark mode)
# and every route at phone, tablet and desktop widths (e2e/ui-responsive), against `staqly serve` built from
# this checkout: a local-mode server and a cloud-mode one on PostgreSQL. Nightly, not on every pull request
# (about 15 minutes, the suite split over parallel jobs). No secrets. Locally the same commands (e2e/README.md).
name: Dashboard in the browser

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nightly: nothing to do when last night's run already passed on this commit (weekends, quiet days).
  tested:
    name: Already tested
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # .github/actions/tested reads earlier runs
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: tested
        uses: ./.github/actions/tested

  # One `staqly` binary with the dashboard and admin exports embedded (make dashboard + go build: about two
  # minutes) for every job below, instead of each job building its own.
  build:
    name: staqly with the dashboard embedded
    needs: tested
    # A manual run has no "tested" job (skipped) and always runs.
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
      - uses: ./.github/actions/setup
      - name: Dashboard export the server embeds (make dashboard)
        run: make dashboard
      - name: staqly binary
        working-directory: apps/cli
        run: go build -o "$RUNNER_TEMP/bin/staqly" ./cmd/staqly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staqly-ui-bin
          path: ${{ runner.temp }}/bin/staqly
          retention-days: 1

  ui:
    needs: build
    # test:ui in four shards (each its own servers and seed: specs never rely on another file's data), and the
    # layouts beside them. One 2-CPU runner took the whole suite past its timeout, hiding every failure.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A shard takes about 3 minutes locally and under 10 on a runner; the suite's own globalTimeout (15 min in CI)
    # ends a stuck run first, with a report.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "UI flows and accessibility (1/4)", run: "pnpm --filter @staqly/e2e test:ui --shard=1/4", artifact: ui-report-1 }
          - { name: "UI flows and accessibility (2/4)", run: "pnpm --filter @staqly/e2e test:ui --shard=2/4", artifact: ui-report-2 }
          - { name: "UI flows and accessibility (3/4)", run: "pnpm --filter @staqly/e2e test:ui --shard=3/4", artifact: ui-report-3 }
          - { name: "UI flows and accessibility (4/4)", run: "pnpm --filter @staqly/e2e test:ui --shard=4/4", artifact: ui-report-4 }
          - { name: "Layouts at phone, tablet and desktop widths", run: "pnpm --filter @staqly/e2e test:ui-responsive", artifact: ui-responsive-report }
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_USER: staqly, POSTGRES_PASSWORD: staqly, POSTGRES_DB: staqly }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U staqly" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      STAQLY_E2E_DATABASE_URL: postgres://staqly:staqly@127.0.0.1:5432/staqly?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/e2e..." }
      # Measured: apt packages about 11 s, the browser download about 9 s; a cache of either would save seconds.
      - name: Chromium for Playwright
        run: pnpm --filter @staqly/e2e exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: staqly-ui-bin, path: "${{ runner.temp }}/bin" }
      - name: The suites start this binary instead of building one (UI_BIN; artifacts drop file modes)
        run: |
          chmod +x "$RUNNER_TEMP/bin/staqly"
          echo "UI_BIN=$RUNNER_TEMP/bin/staqly" >>"$GITHUB_ENV"
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      # Always, so a slow or cancelled run still shows which tests ran and how long each took.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            e2e/ui/.report/
            e2e/ui/.results/
          if-no-files-found: ignore
          retention-days: 7

  # A failed nightly opens an issue (or comments on the open one), so it doesn't go unnoticed.
  alert:
    name: Nightly failure alert
    needs: [build, ui]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: .github/actions }
      - uses: ./.github/actions/nightly-alert
