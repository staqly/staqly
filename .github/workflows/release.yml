# v<semver> tags (`make release VERSION=v0.2.0`) publish one
# version everywhere:
#   - the staqly binary (CLI + `staqly serve`) for macOS, Linux and Windows as
#     a GitHub release (goreleaser), installed by scripts/install.sh;
#   - the image (API + MCP + dashboard in one), linux/amd64 + linux/arm64, as
#     ghcr.io/staqly/staqly:v<semver>, plus :latest unless it is a pre-release
#     (v0.2.0-rc.1).
# After the image is out, a stable release is handed to the hosted service's deployment: a
# repository_dispatch (type `staqly-release`, payload {tag}) to the repository named by the variable
# DEPLOY_DISPATCH_REPO, with the token in the secret DEPLOY_DISPATCH_TOKEN. Only in this repository;
# forks never deploy. Here a missing variable or secret fails the job, it is never skipped.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Publishes only what main tested: the tag is on main and CI passed on that commit (waits while it runs).
  verify:
    name: Tag is on main, CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: CI passed on this commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$run" ] || { echo "::error::no CI run on main for $GITHUB_SHA"; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null

  # Each architecture builds on its own native runner (arm64 on GitHub's arm runner) and is pushed by digest; the
  # next job joins them under the version tags. One runner compiling both used to take twice as long. The builds
  # start at once, next to `verify` (a tag can go up while main's CI still runs): an untagged digest publishes
  # nothing, only `manifest`, after `verify`, tags it.
  image:
    name: Image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/staqly,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-staqly-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-staqly-${{ matrix.arch }}

      - name: Keep the digest for the manifest
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Image
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as the version (and latest unless a pre-release)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/staqly
          TAG: ${{ github.ref_name }}
        run: |
          tags=(-t "$IMAGE:$TAG")
          [[ "$TAG" == *-* ]] || tags+=(-t "$IMAGE:latest")
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 architectures, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  binaries:
    name: Binaries (goreleaser)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false } # changelog since the previous v* tag
      - uses: ./.github/actions/setup   # goreleaser's hook builds the dashboard (make dashboard)
        with: { filter: "@staqly/platform..." }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/cli/go.mod, cache-dependency-path: apps/cli/go.sum }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          workdir: apps/cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  dispatch:
    name: Hand off to deployment
    needs: [manifest]
    if: github.repository == 'staqly/staqly' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # calls another repository with DEPLOY_DISPATCH_TOKEN; GITHUB_TOKEN is not used
    steps:
      - name: Send the release to the deployment repository
        env:
          REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$REPO" ] || { echo "::error::repository variable DEPLOY_DISPATCH_REPO is not set"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::secret DEPLOY_DISPATCH_TOKEN is not set"; exit 1; }
          gh api "repos/$REPO/dispatches" -f event_type=staqly-release -F "client_payload[tag]=$TAG"
