# v<semver> tags (`make release VERSION=v0.2.0`) publish one
# version everywhere:
#   - the staqly binary (CLI + `staqly serve`) for macOS, Linux and Windows as
#     a GitHub release (goreleaser), installed by scripts/install.sh;
#   - the image (API + MCP + dashboard in one), linux/amd64 + linux/arm64, as
#     ghcr.io/staqly/staqly:v<semver>, plus :latest unless it is a pre-release
#     (v0.2.0-rc.1).
# After the image is out, a stable release is handed to the hosted service's deployment: a
# repository_dispatch (type `staqly-release`, payload {tag}) to the repository named by the variable
# DEPLOY_DISPATCH_REPO, with the token in the secret DEPLOY_DISPATCH_TOKEN. Only in this repository;
# forks never deploy. Here a missing variable or secret fails the job, it is never skipped.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Cross-compiles on the runner (BUILDPLATFORM), no QEMU.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/staqly:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/staqly:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-staqly
          cache-to: type=gha,mode=max,scope=release-staqly

  binaries:
    name: Binaries (goreleaser)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # changelog since the previous v* tag
      - uses: ./.github/actions/setup   # goreleaser's hook builds the dashboard (make dashboard)
        with: { filter: "@staqly/platform..." }
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/cli/go.mod, cache-dependency-path: apps/cli/go.sum }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          workdir: apps/cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  dispatch:
    name: Hand off to deployment
    needs: [image]
    if: github.repository == 'staqly/staqly' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Send the release to the deployment repository
        env:
          REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$REPO" ] || { echo "::error::repository variable DEPLOY_DISPATCH_REPO is not set"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::secret DEPLOY_DISPATCH_TOKEN is not set"; exit 1; }
          gh api "repos/$REPO/dispatches" -f event_type=staqly-release -F "client_payload[tag]=$TAG"
