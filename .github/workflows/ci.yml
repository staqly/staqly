# CI for the staqly monorepo: formatting, lint, types, tests and builds for
# every part, plus Docker images and a full end-to-end run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PRs. Each main push keeps its own run: otherwise cancelling a
# filtered run could leave its changed packages untested by the next push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Full runs execute tasks even when their Turbo cache is warm.
  TURBO_FORCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}

jobs:
  # Pushes and PRs check affected packages; nightly/manual runs check everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      cli: ${{ steps.f.outputs.cli }}
      dashboard: ${{ steps.f.outputs.dashboard }}
      docs: ${{ steps.f.outputs.docs }}
      web: ${{ steps.f.outputs.web }}
      packages: ${{ steps.f.outputs.packages }}
      sdk_ts: ${{ steps.f.outputs.sdk_ts }}
      sdk_py: ${{ steps.f.outputs.sdk_py }}
      e2e: ${{ steps.f.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: f
        run: python3 .github/scripts/changes.py

  # The workflows themselves: expressions, permissions, shell in run: steps (actionlint + shellcheck).
  # A few seconds, so it runs on every change.
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: make lint-workflows
      - run: python3 -m unittest discover -s .github/scripts

  # Every job runs the same turbo tasks a developer runs locally
  # (`pnpm check`), for its own package: format:check, lint, typecheck, test,
  # build. Generated code is checked to be up to date.

  # ── Go API ────────────────────────────────────────────────────────────────
  api:
    name: API (Go) on SQLite
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/api" }
      - name: Read the pinned sqlc module
        id: sqlc
        run: |
          module=$(node -p 'require("./apps/api/package.json").scripts.gen.match(/^go run (\S+) generate$/)[1]')
          [[ "$module" == github.com/sqlc-dev/sqlc/cmd/sqlc@v* ]]
          echo "module=$module" >> "$GITHUB_OUTPUT"
      - name: Cache sqlc binary
        id: sqlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlc
          key: sqlc-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ steps.sqlc.outputs.module }}
      - name: Install sqlc on a cache miss
        if: steps.sqlc-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/sqlc
          SQLC_MODULE: ${{ steps.sqlc.outputs.module }}
        run: go install "$SQLC_MODULE"
      - name: Generated queries are up to date (sqlc)
        working-directory: apps/api
        env:
          SQLC: ${{ runner.temp }}/sqlc/sqlc
        run: '"$SQLC" generate && git diff --exit-code internal/db'
      - name: gofmt, vet + OpenAPI lint, tests (race, incl. OpenAPI contract test), build
        run: pnpm turbo run format:check lint test build --filter=@staqly/api
      - name: Known vulnerabilities in code that is called (govulncheck)
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The same Go suite on PostgreSQL (cloud mode's database): every test opens a fresh schema
  # (internal/store/storetest), plus the schema drift check and the SQLite import.
  api-postgres:
    name: API (Go) on PostgreSQL
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_USER: staqly, POSTGRES_PASSWORD: staqly, POSTGRES_DB: staqly }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U staqly" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - name: go test -race on PostgreSQL
        working-directory: apps/api
        env:
          STAQLY_TEST_DATABASE_URL: postgres://staqly:staqly@127.0.0.1:5432/staqly?sslmode=disable
        run: go test -race -timeout 25m ./...

  # ── staqly CLI ────────────────────────────────────────────────────────────
  cli:
    name: CLI (Go)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/cli/go.mod, cache-dependency-path: apps/cli/go.sum }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/cli" }
      - run: pnpm turbo run format:check lint test build --filter=@staqly/cli
      - name: Known vulnerabilities in code that is called (govulncheck)
        working-directory: apps/cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Release config is valid (goreleaser)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { version: "~> v2", workdir: apps/cli, args: check }

  # ── Dashboard, docs site, landing page ────────────────────────────────────
  dashboard:
    name: Dashboard (Next.js)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/platform...", cache-builds: "true" }
      - name: API types are up to date with openapi.yaml
        working-directory: apps/platform
        run: pnpm gen && git diff --exit-code lib/api-types.ts
      - run: pnpm turbo run format:check lint typecheck test build size --filter=@staqly/platform

  docs:
    name: Docs (Fumadocs)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/docs...", cache-builds: "true" }
      - name: Formatting, lint, types, build (static export + link check)
        run: pnpm turbo run format:check lint typecheck build --filter=@staqly/docs

  web:
    name: Landing page (staqly.ai)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://staqly.ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/web...", cache-builds: "true" }
      - name: Formatting, lint, types, tools' logic (scripts/check-tools.mjs), build (static export + link check)
        run: pnpm turbo run format:check lint typecheck test build --filter=@staqly/web
      - name: SEO files are generated
        working-directory: apps/web
        run: test -s out/robots.txt && test -s out/sitemap.xml && test -s out/llms.txt

  packages:
    name: Shared packages (packages/*)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { filter: "./packages/*", cache-builds: "true" }
      - run: pnpm turbo run format:check lint typecheck --filter="./packages/*"

  # ── SDKs ──────────────────────────────────────────────────────────────────
  sdk-typescript:
    name: SDK (TypeScript)
    needs: changes
    if: needs.changes.outputs.sdk_ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/sdk...", cache-builds: "true" }
      - name: Schema types are up to date with openapi.yaml
        working-directory: sdks/typescript
        run: pnpm gen && git diff --exit-code src/schema.ts
      - run: pnpm turbo run format:check lint typecheck test build --filter=@staqly/sdk

  sdk-python:
    name: SDK (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.sdk_py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: sdks/python } }
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) and newest stable.
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with: { python-version: "${{ matrix.python }}", enable-cache: true, cache-dependency-glob: sdks/python/uv.lock }
      - run: uv sync --locked
      - name: Lint + formatting (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy --strict
      - name: Tests (incl. sync-client codegen check)
        run: uv run pytest -q
      - run: uv build

  # ── Docker images + end-to-end ────────────────────────────────────────────
  # Builds the staqly image once (GHA layer cache) with the e2e tag from
  # compose.e2e.yml, then runs the e2e package against exactly that image: the
  # same `pnpm test:e2e` as locally, with E2E_BUILD=0.
  e2e:
    name: Docker images + end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Runs when its code changed, next to the api job rather than after it: api (about 10 min, mostly
    # `go test -race`) and this job (about 10 min) no longer add up on the critical path. A failing api
    # job doesn't stop this one; the run fails either way.
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: staqly image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: staqly-e2e:test
          cache-from: type=gha,scope=staqly
          # main writes the layer cache, pull requests only read it (the 10 GB repository limit)
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=staqly' || '' }}
      - uses: ./.github/actions/setup
        with: { filter: "@staqly/e2e..." }
      - name: Formatting, lint, types of the e2e suite
        run: pnpm turbo run format:check lint typecheck --filter=@staqly/e2e
      - name: End-to-end
        run: pnpm turbo run test:e2e --filter=@staqly/e2e
        env: { E2E_BUILD: "0" }

  # One check for branch protection: jobs skipped by `changes` count as passed, a failed or
  # cancelled one fails this. Make "CI passed" the required status check, not the jobs themselves.
  passed:
    name: CI passed
    if: always()
    needs: [changes, workflows, api, api-postgres, cli, dashboard, docs, web, packages, sdk-typescript, sdk-python, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
