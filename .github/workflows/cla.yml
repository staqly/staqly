# Contributor License Agreement: every outside contributor accepts ICLA.md (individuals) or
# CCLA.md (companies) once, by commenting on their first pull request. Signatures are stored in
# signatures/cla.json on the cla-signatures branch (not main, which is protected).
# pull_request_target is safe here: the action never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/staqly/staqly/blob/main/ICLA.md
          branch: cla-signatures
          allowlist: mits87,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please accept the
            [Individual Contributor License Agreement](https://github.com/staqly/staqly/blob/main/ICLA.md)
            (or, for a company, the [Entity agreement](https://github.com/staqly/staqly/blob/main/CCLA.md))
            by posting the comment below. You only do this once.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Every contributor has accepted the CLA. Thank you!
