# Static security analysis (CodeQL). Free for public repositories; skipped
# while the repository is private (it would need GitHub Advanced Security).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the analysis still in progress.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request analyzes only the languages its diff can change (.github/scripts/codeql_languages.py); main,
  # the weekly scan and a manual run analyze all four, so main's results stay complete for every category.
  languages:
    name: Languages to analyze
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.l.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false } # the merge commit and its base
      - id: l
        run: python3 .github/scripts/codeql_languages.py

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: apps/api/go.mod
          # no go.sum at the root: without this the cache step only warns and caches nothing
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}

  # A failed nightly opens an issue (or comments on the open one), so it doesn't go unnoticed.
  alert:
    name: Nightly failure alert
    needs: [languages, analyze]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: .github/actions }
      - uses: ./.github/actions/nightly-alert
