# pnpm + Node (from .nvmrc) with the pnpm store cached, then install the
# workspace slice a job needs (pnpm --filter "<pkg>..." = the package and its
# workspace dependencies).
name: Setup pnpm workspace
description: Install pnpm, Node and the dependencies of the given packages
inputs:
  filter:
    description: pnpm filter, e.g. "@staqly/platform..."; empty = whole workspace
    default: ""
  cache-builds:
    description: Persist JS Turbo tasks and Next compiler cache (Go jobs use setup-go).
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version-file: .nvmrc, cache: pnpm }
    - shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.filter && format('--filter "{0}" --filter staqly', inputs.filter) || '' }}
    - name: Cache Turbo tasks and Next compiler
      if: inputs.cache-builds == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .turbo
          apps/*/.next/cache
        key: js-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          js-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-
