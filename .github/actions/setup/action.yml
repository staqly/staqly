# pnpm + Node (from .nvmrc) with the pnpm store cached, then install the
# workspace slice a job needs (pnpm --filter "<pkg>..." = the package and its
# workspace dependencies).
name: Setup pnpm workspace
description: Install pnpm, Node and the dependencies of the given packages
inputs:
  filter:
    description: pnpm filter, e.g. "@staqly/platform..."; empty = whole workspace
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version-file: .nvmrc, cache: pnpm }
    - shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.filter && format('--filter "{0}" --filter staqly', inputs.filter) || '' }}
