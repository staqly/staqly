[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "staqly"
version = "0.1.0"
description = "Official Python SDK for staqly — the local-first workspace where AI agents store generated content and humans review it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "staqly contributors" }]
keywords = ["staqly", "staqly", "ai-agents", "human-in-the-loop", "approval", "review", "webhooks", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://github.com/staqly/staqly"
Documentation = "https://github.com/staqly/staqly/tree/main/packages/sdk-python#readme"
Repository = "https://github.com/staqly/staqly"
Issues = "https://github.com/staqly/staqly/issues"
Changelog = "https://github.com/staqly/staqly/blob/main/packages/sdk-python/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyyaml>=6",
  "types-PyYAML",
  "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/staqly"]

[tool.hatch.build.targets.sdist]
include = ["src/staqly", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running server (STAQLY_LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018", "B017"]
"src/staqly/_client_sync.py" = ["UP028"]  # generated: async generators cannot `yield from`

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
