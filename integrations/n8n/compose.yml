# Example: run n8n next to staqly. This is only a starting point — any n8n
# (desktop app, npx, your own container or server) works the same way.
#
#   Staqly first: `make dev` / `docker compose up -d` (repo root) create the
#   staqly_default network. With the image via `docker run`, create it once:
#     docker network create staqly_default
#     docker network connect --alias api staqly_default staqly
#   docker compose -f integrations/n8n/compose.yml up -d   # then this
#
# Joining the staqly network lets both sides use service names:
#   n8n → staqly API:   http://api:3333
#   staqly → n8n:       http://n8n:5678/webhook/...
name: staqly-n8n

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.43.7}   # tested version; any n8n 1.x/2.x works
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "false"            # plain http on localhost
      WEBHOOK_URL: http://localhost:5678/
      NODE_FUNCTION_ALLOW_BUILTIN: crypto   # webhook signature check in the demo workflow
    ports:
      # This machine only. To reach n8n from your network use "5678:5678" and
      # put n8n's own authentication (and HTTPS) in front of it.
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./:/workflows:ro                    # instagram-avatar-demo.json importable via CLI
    networks: [default, staqly]

networks:
  staqly:
    name: staqly_default                    # created by the staqly compose project
    external: true

volumes:
  n8n-data:
