# Merge into ~/.codex/config.toml.

# Local mode (keyless):
[mcp_servers.staqly]
url = "http://localhost:3333/mcp"

# STDIO alternative, as generated by `codex mcp add staqly -- docker exec -i staqly-api mcp-stdio`:
# [mcp_servers.staqly]
# command = "docker"
# args = ["exec", "-i", "staqly-api", "mcp-stdio"]

# Cloud instance (export STAQLY_API_KEY={API_KEY} first):
# [mcp_servers.staqly]
# url = "https://staq.example.com/mcp"
# bearer_token_env_var = "STAQLY_API_KEY"
