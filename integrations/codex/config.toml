# Merge into ~/.codex/config.toml.

# Local mode (export STAQLY_API_KEY=$(staqly serve token) first; Docker: docker exec staqly server token):
[mcp_servers.staqly]
url = "http://localhost:3333/mcp"
bearer_token_env_var = "STAQLY_API_KEY"

# STDIO alternative, no token needed, as generated by `codex mcp add staqly -- docker exec -i staqly mcp-stdio`:
# [mcp_servers.staqly]
# command = "docker"
# args = ["exec", "-i", "staqly", "mcp-stdio"]

# Cloud instance (export STAQLY_API_KEY={API_KEY} first):
# [mcp_servers.staqly]
# url = "https://staqly.example.com/mcp"
# bearer_token_env_var = "STAQLY_API_KEY"
