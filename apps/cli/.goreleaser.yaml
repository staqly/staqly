# goreleaser v2 config for the staqly binary (CLI + `staqly serve`), run from
# apps/cli. Published by .github/workflows/release.yml on v* tags.
# Dry run: make dashboard, then (here) goreleaser release --snapshot --clean
version: 2

project_name: staqly

git:

# The dashboard and admin panel must already be built into apps/api/web and apps/api/admin
# (`make dashboard`, embedded by `staqly serve`). release.yml builds them and runs the tests in steps of
# their own, before this one: hooks here would run dependency installs, builds and tests with the
# release token (GITHUB_TOKEN, contents: write) in their environment.
before:
  hooks:
    - sh -c 'test -s ../api/web/index.html && test -s ../api/admin/index.html || { echo "apps/api/web or apps/api/admin is empty, build the dashboard first" >&2; exit 1; }'

release:
  # v0.2.0-rc.1 is published as a pre-release: never GitHub's "latest" release, which
  # scripts/install.sh downloads from (releases/latest/download/...).
  prerelease: auto

builds:
  - id: staqly
    main: ./cmd/staqly
    binary: staqly
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: staqly
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name: releases/latest/download/staqly_<os>_<arch>.tar.gz
    # is a stable URL for scripts/install.sh.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Docs live at https://docs.staqly.ai/cli; archives carry only the binary.
    files: [none*]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
