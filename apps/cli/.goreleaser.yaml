# goreleaser v2 config for the staqly CLI (run from apps/cli).
# Dry run: goreleaser release --snapshot --clean
version: 2

project_name: staqly

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: staqly
    main: ./cmd/staqly
    binary: staqly
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: staqly
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Docs live in the monorepo (docs/cli.md); archives carry only the binary.
    files: [none*]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
