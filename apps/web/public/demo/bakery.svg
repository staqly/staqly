<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Fresh buns and a coffee on a bakery counter">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3c8"/>
      <stop offset="1" stop-color="#e9c99f"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fff8ec" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff8ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5b34"/>
      <stop offset="1" stop-color="#6e3d22"/>
    </linearGradient>
    <radialGradient id="bun" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f2b766"/>
      <stop offset="0.6" stop-color="#d48a3c"/>
      <stop offset="1" stop-color="#a8622a"/>
    </radialGradient>
  </defs>

  <rect width="160" height="160" fill="url(#wall)"/>
  <rect width="160" height="160" fill="url(#light)"/>

  <!-- window with morning light -->
  <rect x="94" y="14" width="50" height="56" rx="4" fill="#fffaf2" opacity="0.7"/>
  <path d="M119 14v56M94 42h50" stroke="#e2c49b" stroke-width="2.5"/>

  <!-- shelf with jars -->
  <rect x="12" y="52" width="66" height="3" rx="1.5" fill="#b07a4c"/>
  <rect x="18" y="36" width="12" height="16" rx="3" fill="#cfe3e0" opacity="0.85"/>
  <rect x="34" y="40" width="10" height="12" rx="3" fill="#f3d9a8"/>
  <rect x="48" y="34" width="12" height="18" rx="3" fill="#e8b4a0" opacity="0.9"/>

  <!-- counter -->
  <path fill="url(#wood)" d="M0 104h160v56H0z"/>
  <rect y="104" width="160" height="4" fill="#b8764a"/>

  <!-- board with buns -->
  <ellipse cx="62" cy="118" rx="46" ry="9" fill="#5a3019" opacity="0.4"/>
  <rect x="18" y="108" width="88" height="10" rx="5" fill="#c99566"/>
  <g>
    <circle cx="38" cy="102" r="12" fill="url(#bun)"/>
    <circle cx="62" cy="98" r="13" fill="url(#bun)"/>
    <circle cx="86" cy="102" r="12" fill="url(#bun)"/>
  </g>
  <g fill="none" stroke="#8a4c1f" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M31 104l8-9M36 107l9-10M41 108l5-6"/>
    <path d="M54 100l9-10M59 104l10-11M65 105l6-7"/>
    <path d="M79 104l8-9M84 107l9-10M89 108l5-6"/>
  </g>
  <g fill="#fff7e6">
    <circle cx="35" cy="96" r="0.9"/><circle cx="43" cy="100" r="0.9"/><circle cx="38" cy="104" r="0.9"/>
    <circle cx="58" cy="92" r="0.9"/><circle cx="67" cy="96" r="0.9"/><circle cx="62" cy="101" r="0.9"/>
    <circle cx="83" cy="96" r="0.9"/><circle cx="91" cy="100" r="0.9"/><circle cx="86" cy="104" r="0.9"/>
  </g>

  <!-- coffee -->
  <ellipse cx="130" cy="122" rx="16" ry="4" fill="#5a3019" opacity="0.4"/>
  <ellipse cx="130" cy="119" rx="17" ry="4.5" fill="#f8f4ee"/>
  <path d="M118 100h24l-2.5 18a3 3 0 0 1-3 2.5h-13a3 3 0 0 1-3-2.5z" fill="#ffffff"/>
  <path d="M142 104h3.5a5 5 0 0 1 0 10H141" fill="none" stroke="#ffffff" stroke-width="3"/>
  <ellipse cx="130" cy="100.5" rx="12" ry="2.6" fill="#7a4524"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
    <path d="M125 94c-2-3 2-5 0-8"/>
    <path d="M131 93c-2-3 2-5 0-9"/>
    <path d="M137 94c-2-3 2-5 0-8"/>
  </g>
</svg>
