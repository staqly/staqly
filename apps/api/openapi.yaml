  /v1/items/bulk-actions:
    post:
      operationId: bulkItemAction
      tags: [items]
      summary: Run one action on up to 100 items; each item succeeds or fails independently
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
                action: { type: string, description: "approve, reject or a collection action" }
                feedback: { type: string }
                edits: { $ref: "#/components/schemas/ItemFields" }
                payload: { description: Arbitrary JSON forwarded in each event/webhook }
                expected_version: { type: integer, description: "Ignored: bulk actions never check versions" }
                follow_up: { type: string, description: "After reject only: run this action next with the same feedback, e.g. regenerate" }
      responses:
        "200":
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { $ref: "#/components/schemas/ErrorBody" }
                        item: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getItem
      tags: [items]
      summary: Get an item
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item (items:write). Status may not be set to approved/rejected here.
      description: |
        With items:write alone: content (title, content, url, media_id,
        metadata) of an approved or rejected item can't change (metadata_patch
        can), and only these status changes are allowed: draft↔pending,
        any→archived, approved→processing|completed|failed,
        processing→completed|failed, failed→processing|pending,
        rejected→pending, expired→pending. Anything else needs items:review (403).
        Sending only the item's current status answers 409 ("item is already
        archived"); alongside other changes an unchanged status is ignored.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateItemInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete an item (history is kept)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listItemActions
      tags: [items]
      summary: Actions the caller may run on the item in its current status
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ActionDef" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
