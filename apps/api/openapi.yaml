        distinct words / 256 bytes; one-letter words match exactly.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
