      summary: Replace a file with its edit (media:write, posts:write, posts:delete)
      description: >
        The design editor's "Replace the original". A media id never changes content, so the edit is a new file that
        takes the original's name, alt text, folder and tags; drafts that used the original use it instead, and the
        original moves to Deleted (restorable for 30 days). A file that a scheduled, publishing, published or
        failed post uses answers 409: those posts keep what they had, save the edit as a new file instead.
      requestBody:
