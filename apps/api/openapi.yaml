      operationId: listPreviewLinks
      tags: [posts]
      summary: The post's preview links, newest first; tokens are never shown again (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PreviewLink" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
