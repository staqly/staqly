openapi: 3.2.1
info:
  title: staqly API
  version: 1.0.0
  license: { name: Apache-2.0, identifier: Apache-2.0 }
  description: |
    Local-first workspace for AI agent output.

    **Local mode** (default, `STAQLY_MODE=local`): no credentials. Requests
    are accepted only from this machine (loopback/Docker peers, local Host
    names, local or absent Origin).

    **Cloud mode** (`STAQLY_MODE=cloud`, hosted, many workspaces): anyone can
    create a workspace (unless SETUP_TOKEN restricts signup); it starts with a
    7-day Pro trial. When a Pro trial or paid period ends unpaid, the workspace
    is suspended: read-only, other changes return **402** `plan_expired` until
    it is paid or switched to Free (`POST /v1/workspace/plan`).
    Every API key and session belongs to one workspace. Authenticate
    automations with `Authorization: Bearer {API_KEY}`. The dashboard uses an
    HttpOnly session cookie and must send `X-CSRF-Token` on unsafe requests.
    Plan limits are enforced per workspace; exceeding one returns **402**
    `plan_limit_exceeded` with `details`.

    Other devices (phones) join a workspace through one-time "connect a
    device" links (`/v1/device-links`), in both modes.

    Unsafe requests accept an `Idempotency-Key` header; repeating the same key
    with the same method, path, query string and body replays the original
    response for 24 hours. Responses that carry a secret (new API keys,
    recovery keys, device links, webhook signing secrets) and responses over
    1 MiB are never stored: repeating such a request runs it again.

    Any request may answer **503** `busy` with `Retry-After` when the
    database stays locked by another process for too long; retry it.

    A state that is already set cannot be set again: archiving an archived
    collection or item, pausing a paused watcher, enabling an enabled channel,
    webhook or notification channel, revoking a revoked API key or session,
    reporting the result an item already has, approving an approved item or
    choosing the plan the workspace is on answers **409** `conflict` (e.g.
    "collection is already archived") and changes nothing. A PATCH that
    changes other fields too is accepted; the unchanged state is ignored.
servers:
  # First: the docs' API playground sends requests from the browser, which only
  # cloud mode allows (CORS for docs.staqly.ai, Authorization: Bearer <API key>).
  - url: https://{host}
    description: Your staqly cloud instance (API key required)
    variables:
      host: { default: staqly.example.com, description: Host name of your cloud instance }
  - url: http://localhost:3333
    description: Local (staqly serve or Docker), no key
security:
  - {}            # local mode
  - bearer: []    # cloud mode: API key
  - session: []   # cloud mode: dashboard session cookie (+ X-CSRF-Token on unsafe requests)
tags:
  - name: setup
    description: Instance status, signup and plans
  - name: auth
    description: Sessions, devices, API keys, the workspace, its plan and exports
  - name: collections
    description: Collections of items and their custom actions
  - name: items
    description: Items, review actions, history and long-polling
  - name: media
    description: Uploaded files and thumbnails
  - name: events
    description: The workspace activity log
  - name: webhooks
    description: Outgoing webhooks and their deliveries
  - name: watchers
    description: RSS and page-change watchers that create items
  - name: notifications
    description: Notification channels (Telegram, Slack, Discord, ntfy, email) and one-tap decision links
  - name: billing
    description: Pro subscription through Stripe (cloud mode)
  - name: integrations
    description: Callbacks from chat platforms (signature-verified, no API key)
  - name: system
    description: Health, readiness and metrics

paths:
  /health:
    get:
      operationId: health
      tags: [setup]
      security: []
      summary: Liveness and database check
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [status, version], properties: { status: { type: string, const: ok }, version: { type: string } } } } } }
        "503": { description: The database is unreachable, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, const: unavailable } } } } } }

  /openapi.yaml:
    get:
      operationId: getOpenAPI
      tags: [setup]
      security: [{}]
      summary: This OpenAPI document
      responses:
        "200": { description: OpenAPI 3.2 YAML, content: { application/yaml: { schema: { type: string } } } }

  /v1/setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      summary: Whether the workspace has been created
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [initialized, mode, signup_open, setup_token_required, billing_enabled, public_api_url]
                properties:
                  initialized: { type: boolean, description: Local mode only }
                  mode: { type: string, enum: [local, cloud] }
                  signup_open: { type: boolean, description: "Cloud: anyone may create a workspace" }
                  setup_token_required: { type: boolean }
                  billing_enabled: { type: boolean, description: "Cloud with Stripe configured: paid plans can be bought (Settings → Plan & usage)" }
                  public_api_url: { type: string, description: "PUBLIC_API_URL: the API's base URL for agents and tools (shown in dashboard snippets)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces:
    post:
      operationId: createWorkspace
      tags: [setup]
      security: []
      summary: Create a cloud workspace (starts a 7-day Pro trial)
      description: Cloud mode only; each call creates a new isolated workspace. Rate-limited to 5 per hour per client IP (429). Requires `setup_token` when the server sets SETUP_TOKEN. Creates the workspace, an admin API key (scope `admin`, the credential that signs in to the dashboard; see POST /v1/sessions/api-key), a single-use recovery key and a browser session cookie. Secrets are returned only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, description: Workspace name (defaults to "My Workspace") }
                setup_token: { type: string, description: Required when the server sets SETUP_TOKEN }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [workspace, api_key, recovery_key, csrf_token]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  recovery_key: { type: string }
                  csrf_token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/plans:
    get:
      operationId: listPlans
      tags: [setup]
      security: [{}]
      summary: Cloud plans and their limits (-1 = unlimited)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/usage:
    get:
      operationId: getWorkspaceUsage
      tags: [auth]
      summary: Current plan and usage (local installs report the unlocked plan)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [plan, period, usage, plan_expires_at, suspended, items_by_status, webhook_deliveries]
                properties:
                  plan: { $ref: "#/components/schemas/Plan" }
                  period: { type: string, examples: ["2026-10"] }
                  usage:
                    type: object
                    required: [items_per_month, decisions_per_month, webhooks, api_keys, storage_bytes, watchers, notification_channels]
                    properties:
                      items_per_month: { type: integer }
                      decisions_per_month: { type: integer, description: Approvals and rejections this month }
                      webhooks: { type: integer }
                      api_keys: { type: integer }
                      storage_bytes: { type: integer }
                      watchers: { type: integer, description: Active (not paused) watchers }
                      notification_channels: { type: integer }
                  plan_expires_at:
                    type: [string, "null"]
                    format: date-time
                    description: End of the Pro trial (7 days from signup) or paid period; null = no end.
                  suspended:
                    type: boolean
                    description: |
                      The Pro trial or paid period ended unpaid. The workspace is read-only:
                      reads and exports work, other changes answer 402 `plan_expired` until it is
                      paid or switched to Free (`POST /v1/workspace/plan`).
                  items_by_status:
                    type: object
                    description: Items created this period, counted by their current status (statuses with no items are left out).
                    additionalProperties: { type: integer }
                    examples: [{ pending: 2, approved: 2, rejected: 1 }]
                  webhook_deliveries:
                    type: object
                    description: Webhook deliveries right now. `failed` gave up after every retry and can be redelivered.
                    required: [queued, retrying, failed]
                    properties:
                      queued: { type: integer, description: Waiting for their first attempt }
                      retrying: { type: integer, description: "Failed at least once; another attempt is scheduled" }
                      failed: { type: integer, description: Gave up after every retry }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/plan:
    post:
      operationId: changePlan
      tags: [auth]
      summary: Switch the workspace to the Free plan (admin; cloud mode)
      description: |
        Moves the workspace to Free, which also lifts a suspension after the Pro trial.
        Any other plan answers 402 `payment_required`: upgrade with
        `POST /v1/billing/checkout`. While a Pro subscription is live this answers 409;
        cancel it in the billing portal first.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [free] }
      responses:
        "200":
          description: The new plan and usage (same shape as GET /v1/workspace/usage)
          content: { application/json: { schema: { $ref: "#/components/schemas/Usage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/billing:
    get:
      operationId: getBilling
      tags: [billing]
      summary: Subscription status (admin)
      description: |
        Whether billing is enabled on this instance (cloud mode with Stripe configured), the
        plan, Stripe's subscription status and the end of the trial or paid period.
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Start a Stripe Checkout for Pro (admin)
      description: |
        Returns a Stripe Checkout URL; open it in a browser to pay. Stripe redirects back to
        `<PUBLIC_DASHBOARD_URL>/settings/plan?checkout=success`, and the plan changes when Stripe's
        webhook arrives. Allowed while suspended. 409 when billing is off or a subscription
        is already live.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/portal:
    post:
      operationId: createPortalSession
      tags: [billing]
      summary: Open the Stripe customer portal (admin)
      description: Returns a portal URL to change the payment method, see invoices or cancel. 409 before the first checkout.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook endpoint
      description: |
        Called by Stripe, not by clients. Verified with the `Stripe-Signature` header and
        `STRIPE_WEBHOOK_SECRET`; each event is applied once. Handles
        `checkout.session.completed` and `customer.subscription.*`.
      security: []
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/device-links:
    post:
      operationId: createDeviceLink
      tags: [auth]
      summary: Create a one-time "connect a device" link (QR code)
      description: Dashboard only (session or local principal). The token is in the URL fragment, valid for 5 minutes, single use.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, reachable]
                properties:
                  url: { type: string, examples: ["https://staqly.example.com/connect#abc..."] }
                  expires_at: { type: string, format: date-time }
                  reachable: { type: boolean, description: false when the URL points at localhost }
                  hint: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/device-links/redeem:
    post:
      operationId: redeemDeviceLink
      tags: [auth]
      security: [{}]
      summary: Exchange a device-link token for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "201": { description: Session cookie set, content: { application/json: { schema: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/recover:
    post:
      operationId: recoverSession
      tags: [auth]
      security: []
      summary: Recover access with the recovery key (lost API key)
      description: |
        The recovery key is single-use. In one transaction this sets a session
        cookie, creates a new admin API key (not counted against the plan's key
        limit), replaces the recovery key with a new one (the old one stops
        working) and signs out every other session of the workspace. On a plan
        with a key limit (Free) the new admin key replaces the old admin keys,
        which are revoked; otherwise existing API keys keep working. The new API key and recovery key are returned only
        in this response. Rate-limited per client IP (429).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [recovery_key], properties: { recovery_key: { type: string } } }
      responses:
        "201":
          description: Session cookie set; the new admin key and the next recovery key, shown once
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token, api_key, recovery_key]
                properties:
                  csrf_token: { type: string }
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  recovery_key: { type: string, description: Replaces the recovery key that was just used }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/api-key:
    post:
      operationId: signInWithAPIKey
      tags: [auth]
      security: []
      summary: Sign in to the dashboard with an admin API key
      description: |
        Cloud mode only (409 in local mode). Exchanges an API key with the
        `admin` scope (the key sign-up or recovery returns) for a browser session
        cookie. Keys without `admin` (agent keys) get 403; unknown, revoked or
        expired keys get 401. The key goes in the body, not in Authorization.
        Other sessions stay signed in. Recorded as a `session.signed_in` event.
        Rate-limited per client IP (429).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [api_key], properties: { api_key: { type: string, description: "An admin key, stk_..." } } }
      responses:
        "201": { description: Session cookie set, content: { application/json: { schema: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Current principal, workspace and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [mode, workspace, principal, csrf_token]
                properties:
                  mode: { type: string, enum: [local, cloud] }
                  workspace: { $ref: "#/components/schemas/Workspace" }
                  principal:
                    type: object
                    required: [type, id, name, scopes]
                    properties:
                      type: { type: string, enum: [local, session, api_key] }
                      id: { type: string }
                      name: { type: string }
                      scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
                  csrf_token: { type: string, description: Empty for API-key callers }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: logout
      tags: [auth]
      summary: Log out (revoke the current session)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List active browser sessions (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Session" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke a session (admin)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace:
    get:
      operationId: getWorkspace
      tags: [auth]
      summary: Get the workspace
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateWorkspace
      tags: [auth]
      summary: Rename the workspace or set its processing timeout (admin)
      description: |
        Send `name`, `processing_timeout_seconds` or both. The processing timeout is how long an
        item may stay `processing` before it fails (60 to 86400 seconds, 1 minute to 24 hours);
        until it is set, the server's `PROCESSING_TIMEOUT` applies (default 1h).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                processing_timeout_seconds: { type: integer, minimum: 60, maximum: 86400 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteWorkspace
      tags: [auth]
      summary: Permanently delete this workspace and all its data (cloud, dashboard session only)
      description: |
        Deletes collections, items, versions, media files, events, webhooks,
        deliveries, watchers, API keys, sessions and exports. Requires a
        session (API keys get 403) and `confirm` equal to the workspace name.
        Local mode returns 409: delete the data volume instead.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The exact workspace name }
      responses:
        "204": { description: Deleted; the session cookie is cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
