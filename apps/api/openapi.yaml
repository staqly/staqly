    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: action, in: path, required: true, schema: { type: string }, description: "approve, reject (items:review) or a collection action (actions:execute)" }
    post:
      operationId: runItemAction
      tags: [items]
      summary: Approve, reject or run a custom action
      description: Atomic; concurrent decisions on the same item yield exactly one success, others get 409.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback: { type: string }
                edits: { $ref: "#/components/schemas/ItemFields" }
                payload: { description: Arbitrary JSON forwarded in the event/webhook }
                expected_version: { type: integer }
                follow_up: { type: string, description: "After reject only: run this action next with the same feedback, e.g. regenerate" }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}/events:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listItemEvents
      tags: [items]
      summary: Item activity history, newest first
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/eventCursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}/wait:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: waitForItemDecision
      tags: [items]
      summary: Long-poll until the item is decided (leaves pending) or the timeout passes
      parameters:
        - { name: timeout, in: query, description: "Seconds to wait (default 30, max 60)", schema: { type: integer, maximum: 60 } }
      responses:
        "200":
          description: Current item; decided=false means the timeout passed
          content:
            application/json:
              schema:
                type: object
                required: [decided, item]
                properties:
                  decided: { type: boolean }
                  item: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}/unarchive:
    post:
      operationId: unarchiveItem
      tags: [items]
      summary: Bring an archived item back where it was - pending, its run or its decision (event item.unarchived)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The item, no longer archived
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}/summarize:
    post:
      operationId: summarizeItem
      tags: [items]
      summary: Write the item's summary again with the model, with optional extra context (event item.summarized)
      description: >-
        Waits for the model (TAGGER_URL). Tags are added too if the item has none. 409 not_configured without a
        model, 502 model_failed when it does not answer, 429 after 10 calls in a row (then 20 a minute) per caller. Requires items:write.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                context: { type: string, maxLength: 500, description: "Extra context for the model, e.g. what the item is for" }
      responses:
        "200":
          description: The item with its new summary
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: The model did not answer, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/items/{id}/result:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: reportItemResult
      tags: [items]
      summary: Report the outcome after acting on an approved item (completed or failed)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed, failed] }
                result: { description: "Any JSON, stored in metadata.result" }
                error: { type: string, description: Stored in metadata.error }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/items/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listItemVersions
      tags: [items]
      summary: Snapshots of the item before each change
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [version, snapshot, actor, created_at]
                      properties:
                        version: { type: integer }
                        snapshot: { $ref: "#/components/schemas/Item" }
                        actor: { type: string }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a file (items:write). Type is detected from content; SVG/HTML are rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getMedia
      tags: [media]
      summary: Download/preview a file (items:read). Supports Range requests.
      description: >
        With `w`, returns a thumbnail at most `w` pixels wide instead of the
        original (PNG, JPEG, GIF first frame, WebP). Thumbnails are generated
        on first request and cached on disk; JPEG for opaque images, PNG when
        there is transparency; EXIF orientation is applied. Images are never
        upscaled: when the original is not wider than `w`, it is returned
        as is, as it is for AVIF and for images over 50 megapixels (not
        decoded server-side). Thumbnail responses carry an `ETag` and
        `Cache-Control: private, max-age=31536000, immutable` (a media id
        never changes content). Other file types answer 422 when `w` is set.
      parameters:
        - { name: download, in: query, schema: { type: string }, description: Force attachment disposition }
        - { name: w, in: query, schema: { type: integer, enum: [160, 320, 640, 1280] }, description: "Thumbnail width in pixels (images only)" }
      responses:
        "200": { description: "File bytes (or the thumbnail), with the stored MIME type", content: { "*/*": { schema: { type: string, format: binary } } } }
        "206": { description: Partial content (Range request), content: { "*/*": { schema: { type: string, format: binary } } } }
        "304": { description: Not modified (If-None-Match / If-Modified-Since) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: Range not satisfiable }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a file (items referencing it lose their media)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Workspace activity log, newest first (items:read)
      description: >
        Credential and session audit events (api_key.*, session.*,
        recovery_key.*, device.*, device_link.*) are only listed for admin
        principals (dashboard sessions, local mode, keys with the admin scope).
      parameters:
        - { name: item_id, in: query, schema: { type: string } }
        - { name: collection_id, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: actor_type, in: query, schema: { type: string, enum: [local, session, api_key, system] } }
        - { name: actor_id, in: query, description: "One actor, e.g. an API key id (key_...) or a session id", schema: { type: string } }
        - { name: agent, in: query, description: "Agent name as listed by /v1/agents (e.g. claude-code, n8n); repeat for any of several", schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: type_prefix, in: query, description: "Literal type prefix, e.g. `item.` or `webhook.`", schema: { type: string } }
        - { name: from, in: query, description: "created_at >= (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
        - { name: to, in: query, description: "created_at < (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/eventCursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhooks (webhooks:manage)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Webhook" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createWebhook
