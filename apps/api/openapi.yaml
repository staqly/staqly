        The AI tools run on the server's own provider accounts: fal.ai (AI_FAL_KEY) first, Higgsfield
        (AI_HIGGSFIELD_API_KEY) as the fallback for the operations it does the same way. Without a key, configured
        is false, operations is empty and the editor hides its AI tools. Nothing here is secret: no key is ever sent.
      responses:
        "200": { description: AI status, content: { application/json: { schema: { $ref: "#/components/schemas/AIStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
