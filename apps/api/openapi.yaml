  /v1/account/sign-in-methods/{provider}/{subject}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, email, passkey] } }
      - { name: subject, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeSignInMethod
      tags: [accounts]
      summary: Remove a sign-in method (409 for the last one)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignInMethodList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/workspace:
    post:
      operationId: switchWorkspace
      tags: [accounts]
      summary: Move this browser session to another workspace the person belongs to
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [workspace_id], properties: { workspace_id: { type: string } } } } }
      responses:
        "204": { description: Switched }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/notifications:
    get:
      operationId: getNotificationPrefs
      tags: [accounts]
      summary: The signed-in person's notification choices
      description: |
        Per event, whether the person gets an email (to the address they sign in with) and whether it shows
        in the bell. `scope` decides which posts: `mine` (posts they wrote, or their API keys wrote) or `all`
        (every post in the workspaces they edit). Channel, schedule and invitation events go to owners and admins.
        Emails need the server's mail (MAIL_*); `mail_ready` says whether it is set up.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPrefs" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      operationId: setNotificationPrefs
      tags: [accounts]
      summary: Change the signed-in person's notification choices
      description: Events not listed keep their choice; `scope` is optional.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: [mine, all] }
                events: { type: array, items: { $ref: "#/components/schemas/NotificationChoice" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPrefs" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/notifications/unsubscribe:
    post:
      operationId: unsubscribe
      tags: [accounts]
      security: []
      summary: Turn off one kind of email from its unsubscribe link
      description: |
        Public: the signed token from a personal email is the credential (one person, one event). Mail clients
        post here for one-click unsubscribe (RFC 8058) with `?token=`; the dashboard's unsubscribe page sends
        `{"token": ...}`. Limited per client address.
      parameters:
        - { name: token, in: query, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } }
      responses:
        "200": { description: The email is off, content: { application/json: { schema: { type: object, required: [event], properties: { event: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account:
    patch:
      operationId: renameMe
      tags: [accounts]
      summary: Change the signed-in person's name (how members, the activity log and emails show them)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/workspaces:
    post:
      operationId: createMyWorkspace
      tags: [accounts]
      summary: "Create a workspace the signed-in person owns (where people join by invitation only, someone who owns a workspace already); with billing it has no plan until a subscription starts, see GET /v1/billing trial"
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 }, timezone: { type: string, description: "IANA time zone name for the new workspace (default UTC)", examples: [Europe/Warsaw] } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MyWorkspace" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/members:
    get:
      operationId: listMembers
      tags: [accounts]
      summary: People in this workspace and their roles (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Member" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/members/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateMember
      tags: [accounts]
      summary: Change a member's role (admins up to admin; owners any role)
      description: Signed-in people only (not API keys). The last owner keeps the owner role (409).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: removeMember
      tags: [accounts]
      summary: Remove a member, or leave (their sessions in this workspace end)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations:
    get:
      operationId: listInvitations
      tags: [accounts]
      summary: Open invitations (admins and owners)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createInvitation
      tags: [accounts]
      summary: Invite someone by email (single-use link, 7 days)
      description: Returns the accept link once (`link`); it is also emailed when the server has mail configured (`emailed`). Plans are priced per user, so once accepted the new member is billed as a seat (the subscription's quantity follows the members, prorated). No plan caps seats.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string }, role: { $ref: "#/components/schemas/Role" } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations/lookup:
    get:
      operationId: lookupInvitation
      tags: [accounts]
      security: []
      summary: What an invitation link is for (shown before signing in)
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationPreview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [accounts]
      summary: Accept an invitation as the signed-in person (idempotent; moves the session there)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyWorkspace" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { description: "The invitation expired, was revoked or was already used", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations/{id}/resend:
    post:
      operationId: resendInvitation
      tags: [accounts]
      summary: Issue a new link and a new expiry (the old link stops working)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [accounts]
      summary: Revoke an open invitation
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Current principal, workspace and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [mode, workspace, principal, csrf_token]
                properties:
                  mode: { type: string, enum: [local, cloud] }
                  workspace: { $ref: "#/components/schemas/Workspace" }
                  principal:
                    type: object
                    required: [type, id, name, scopes]
                    properties:
                      type: { type: string, enum: [local, session, api_key] }
                      id: { type: string }
                      name: { type: string }
                      scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
                  csrf_token: { type: string, description: Empty for API-key callers }
                  user: { $ref: "#/components/schemas/User" }
                  role: { $ref: "#/components/schemas/Role" }
                  accounts_enabled: { type: boolean, description: "Cloud accounts with Google sign-in are on" }
                  workspaces: { type: array, items: { $ref: "#/components/schemas/MyWorkspace" }, description: "Workspaces this person can switch to" }
                  onboarded: { type: boolean, description: "The welcome wizard is done (per person in an account; in the Community Edition per workspace, and a workspace with channels or posts counts as done). False sends the dashboard to /welcome once." }
                  defaults:
                    type: object
                    description: Server defaults that apply when a collection sets no value.
                    required: [processing_timeout_seconds]
                    properties:
                      processing_timeout_seconds: { type: integer, description: "PROCESSING_TIMEOUT in seconds: how long a target on your own automation waits for a result before it fails (0 = never)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: logout
      tags: [auth]
      summary: Log out (revoke the current session)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/session/onboarded:
    post:
      operationId: finishOnboarding
      tags: [auth]
      summary: Finish (or skip) the welcome wizard
      description: |
        Marks the welcome wizard done for the signed-in person (the Community Edition: for the workspace), so the
        dashboard no longer opens it on its own. `name`, when given, is how the person wants to be called: the
        name of the account they own (the sidebar shows it), and theirs. Dashboard sessions only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, description: "Optional: the person's name" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List active browser sessions (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Session" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke a session (admin)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace:
    get:
      operationId: getWorkspace
      tags: [auth]
      summary: Get the workspace
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateWorkspace
      tags: [auth]
      summary: Rename the workspace or change its time zone (admin)
      description: |
        Send the new `name`, `timezone` (an IANA name; an unknown zone is 422), or both. Fields left out stay as they are.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string, description: IANA time zone name, examples: [Europe/Warsaw] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteWorkspace
      tags: [auth]
      summary: Permanently delete this workspace and all its data (cloud, dashboard session only)
      description: |
        Deletes collections, posts, channels, schedules, jobs, media files, events,
        webhooks, deliveries, alert channels, API keys, sessions and exports. Requires a
        session (API keys get 403) and `confirm` equal to the workspace name.
        The Community Edition returns 409: delete the data volume instead.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The exact workspace name }
      responses:
        "204": { description: Deleted; the session cookie is cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }


  /v1/recovery-key/rotate:
    post:
      operationId: rotateRecoveryKey
      tags: [auth]
      summary: Issue a new recovery key (dashboard sessions only)
      description: Every other session of the workspace is signed out. Cloud only; the Community Edition (local mode) has no recovery key (409).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: "The new key, shown once", content: { application/json: { schema: { type: object, required: [recovery_key], properties: { recovery_key: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/access-token:
    get:
      operationId: getAccessToken
      tags: [auth]
      summary: The Community Edition's access token (dashboard sessions and the token itself)
      description: "What agents, SDKs and the CLI send as `Authorization: Bearer <token>`. 404 in cloud mode (it uses API keys)."
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, description: "stk_local_..." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/access-token/rotate:
    post:
      operationId: rotateAccessToken
      tags: [auth]
      summary: Make a new access token (Community Edition)
      description: |
        The old token stops working at once; every browser session except the
        caller's is signed out. Recorded as an `access_token.rotated` event. 409
        when STAQLY_LOCAL_TOKEN fixes the token; 404 in cloud mode.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: The new token
          content:
            application/json:
              schema:
                type: object
                required: [token, sessions_revoked]
                properties:
                  token: { type: string }
                  sessions_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/api-keys:
    get:
      operationId: listAPIKeys
      tags: [auth]
      summary: List API keys (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, available_scopes]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
                  available_scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createAPIKey
      tags: [auth]
      summary: Create a scoped API key (admin). The raw key is returned once.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Scope" } }
                expires_at: { type: string, description: "RFC3339 or YYYY-MM-DD, in the future (422 otherwise); at most a year ahead (422 otherwise); omitted, the key expires in a year. Expired keys stop counting against the plan key limit" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/APIKey" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/api-keys/{id}:
    delete:
      operationId: revokeAPIKey
      tags: [auth]
      summary: Revoke an API key (admin)
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/api-keys/{id}/rotate:
    post:
      operationId: rotateAPIKey
      tags: [auth]
      summary: Revoke a key and issue a replacement with the same name and scopes (admin)
      description: Cloud only; the Community Edition (local mode) has no API keys (409).
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "201": { description: New key, content: { application/json: { schema: { $ref: "#/components/schemas/APIKey" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List collections (collections:read)
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Collection" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection (collections:write)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/CollectionInput" }, { required: [name] }] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Collection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/collections/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get a collection
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Collection" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateCollection
      tags: [collections]
      summary: Update (rename, describe, colour, processing timeout, archive)
      description: Archiving the Default collection (`is_default`) answers 409.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Collection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Permanently delete a collection and its posts (collections:delete)
      description: |
        Requires `collections:delete`; `collections:write` alone answers 403.
        The Default collection (`is_default`) cannot be deleted (409).
      parameters:
        - { name: confirm, in: query, required: true, description: Must equal the collection name, schema: { type: string } }
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/collections/{id}/posts:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listCollectionPosts
      tags: [posts]
      summary: List posts of one collection (posts:read)
      description: The same filters as GET /v1/posts. The `{id}` may also be the collection's exact name.
      parameters:
        - { $ref: "#/components/parameters/postStatus" }
        - { $ref: "#/components/parameters/channelId" }
        - { $ref: "#/components/parameters/publishAfter" }
        - { $ref: "#/components/parameters/publishBefore" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/tag" }
        - { $ref: "#/components/parameters/postSort" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List posts across collections (posts:read)
      description: |
        Ordered by publish time by default (`publish_asc`: scheduled posts first, soonest first; posts
        without a time last by creation). `q` matches words of the content; `tag` is one tag.
      parameters:
        - { name: collection_id, in: query, description: A collection id or exact name, schema: { type: string } }
        - { $ref: "#/components/parameters/postStatus" }
        - { $ref: "#/components/parameters/channelId" }
        - { $ref: "#/components/parameters/publishAfter" }
        - { $ref: "#/components/parameters/publishBefore" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/tag" }
        - { $ref: "#/components/parameters/postSort" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post (posts:write; scheduling or publishing it right away also needs posts:publish)
      description: |
        A draft unless `status` is `scheduled` (needs `publish_at` in the future and at least one target)
        or `publish_now` is true (needs a target). `collection` is an id or an exact name. Media ids come
        from POST /v1/media. Each target is a channel the post goes to, with optional text of its own and
        provider settings; a target that breaks its provider's limits is a 422 keyed
        `targets.<channel_id>.content` or `targets.<channel_id>.settings.<key>`.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/PostInput" }, { required: [collection] }] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/delete:
    post:
      operationId: deletePosts
      tags: [posts]
      summary: Delete several posts (posts:delete)
      description: "Unknown ids, and ids of another workspace, are listed in `missing`. What already went out stays on the platforms."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
      responses:
        "200":
          description: What was deleted and which ids were not found
          content:
            application/json:
              schema:
                type: object
                required: [deleted, missing]
                properties:
                  deleted: { type: array, items: { type: string } }
                  missing: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post with its targets (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Edit a draft, scheduled or failed post (posts:write)
      description: |
        Fields left out stay as they are; `targets` replaces the whole list; `publish_at: null` clears
        the time (a scheduled post becomes a draft). A published or publishing post is not editable
        (409 `not_editable`). `expected_version` makes the edit conditional (409 `post_changed`).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PostPatch" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post; its events stay as history (posts:delete)
      description: Requires `posts:delete`; `posts:write` alone answers 403. A publishing post cannot be deleted (409).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/schedule:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: schedulePost
      tags: [posts]
      summary: Set the publish time and make the post scheduled (posts:publish)
      description: "From draft, scheduled or failed; the post needs at least one target and a time in the future (at most a year ahead). A post carrying a file in Deleted is refused (422 on `media`): restore the file first."
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [publish_at], properties: { publish_at: { type: string, format: date-time } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: publishPost
      tags: [posts]
      summary: Publish now (posts:publish)
      description: |
        From draft, scheduled or failed. The post becomes `publishing` and a job publishes each target;
        the post ends `published` when every target is, `failed` when one is not (retry a target with
        POST /v1/posts/{id}/targets/{channel}/retry). Targets on your own automation (provider `custom`)
        emit `post.publish_requested` and wait for POST .../result. A post carrying a file in Deleted is refused
        (422 on `media`), as scheduling it is: restore the file first.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Publishing, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: cancelPost
      tags: [posts]
      summary: Take a scheduled post off the schedule; it becomes a draft (posts:publish)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/duplicate:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: duplicatePost
      tags: [posts]
      summary: Copy content, media, tags, metadata and targets into a new draft (posts:write)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/metrics:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getPostMetrics
      tags: [posts]
      summary: The post's numbers per channel, read from each platform that reports them (posts:read)
      description: |
        Published targets on platforms that report numbers (X) are read again when the cached numbers are older
        than ten minutes, or now with `refresh=true`. A failed read keeps the last numbers and sets `error`.
        Targets on your own automation show what it reported (PUT .../metrics). `available: false` means the
        platform gives no numbers.
      parameters:
        - { name: refresh, in: query, description: "Read every published target's numbers now", schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/TargetMetrics" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/targets/{channel}/metrics:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: channel, in: path, required: true, description: The channel id of the target, schema: { type: string } }
    put:
      operationId: reportTargetMetrics
      tags: [posts]
      summary: Your own automation sends the numbers of a post it published (posts:publish)
      description: Only targets on a channel of provider `custom` (422 otherwise). Replaces the stored numbers.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TargetMetrics" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/previews:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listPreviewLinks
      tags: [posts]
      summary: The post's preview links, newest first; tokens are never shown again (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PreviewLink" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createPreviewLink
      tags: [posts]
      summary: A link to a read-only preview page of the post where anyone with it can comment (posts:write)
      description: |
        The answer carries `url` and `token` once. The token is in the URL fragment, so it does not reach
        server logs or other sites. `expires_in_days` 0 (or no body) never expires; revoke with DELETE.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { expires_in_days: { type: integer, minimum: 0, maximum: 365, description: "0 never expires" } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PreviewLink" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/previews/{preview}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: preview, in: path, required: true, description: The preview link's id, schema: { type: string } }
    delete:
      operationId: revokePreviewLink
      tags: [posts]
      summary: Stop a preview link from working (posts:write)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/comments:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listPostComments
      tags: [posts]
      summary: "The post's feedback threads: reviewers' comments from its preview pages (with their email) and the team's replies, oldest first, 500 a page by default (at most 1000) (posts:read)"
      parameters:
        - { name: limit, in: query, description: "Comments per page (default 500, at most 1000)", schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PostComment" } }, next_cursor: { type: string, description: "Later comments: pass it as cursor; absent on the last page" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: addPostComment
      tags: [posts]
      summary: Comment on the post's feedback as the team (a reply with parent_id, or a new thread) (posts:write)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
                parent_id: { type: string, description: Reply to this thread }
                quote: { type: string, maxLength: 500, description: "A new thread's passage; it must be in the text named by channel_id and part" }
                channel_id: { type: string }
                part: { type: integer, minimum: 0 }
                anchor_start: { type: integer }
                anchor_end: { type: integer }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PostComment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/comments/{comment}/resolve:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: comment, in: path, required: true, description: "The thread's first comment", schema: { type: string } }
    post:
      operationId: resolvePostComment
      tags: [posts]
      summary: Resolve a feedback thread (posts:write)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostComment" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/comments/{comment}/reopen:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: comment, in: path, required: true, description: "The thread's first comment", schema: { type: string } }
    post:
      operationId: reopenPostComment
      tags: [posts]
      summary: Reopen a resolved feedback thread (posts:write)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostComment" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/comments/{comment}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: comment, in: path, required: true, description: The comment's id, schema: { type: string } }
    delete:
      operationId: deletePostComment
      tags: [posts]
      summary: "Remove a comment (posts:write); removing a thread's first comment removes its replies"
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/previews/{token}:
    parameters:
      - { name: token, in: path, required: true, description: The preview link's token, schema: { type: string } }
    get:
      operationId: openPreview
      tags: [posts]
      security: []
      summary: The preview page's content, as each channel will show the post (no credentials; the token is the key)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicPreview" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/previews/{token}/comments:
    parameters:
      - { name: token, in: path, required: true, description: The preview link's token, schema: { type: string } }
    post:
      operationId: addPreviewComment
      tags: [posts]
      security: []
      summary: Leave a comment on a previewed post (no credentials; 20 per 10 minutes per address, 30 an hour per link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string, maxLength: 80, description: Who is commenting }
                email: { type: string, description: "Optional; shown to the team only" }
                body: { type: string, maxLength: 2000 }
                quote: { type: string, maxLength: 500, description: "The words of the post the comment is about; they must be in the text named by channel_id and part" }
                channel_id: { type: string, description: The channel's version the comment is about }
                part: { type: integer, minimum: 0, description: "0: the post's text (default); n: the n-th comment of its thread" }
                anchor_start: { type: integer, description: "Where the quote starts (UTF-16 code units); when it doesn't match, the quote's first occurrence is used" }
                anchor_end: { type: integer, description: Where it ends (exclusive) }
                parent_id: { type: string, description: "Reply to this thread (a reply takes no quote)" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PostComment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/previews/{token}/comments/{comment}/resolve:
    parameters:
      - { name: token, in: path, required: true, description: The preview link's token, schema: { type: string } }
      - { name: comment, in: path, required: true, description: "The thread's first comment", schema: { type: string } }
    post:
      operationId: resolvePreviewComment
      tags: [posts]
      security: []
      summary: Resolve a feedback thread from the preview page (no credentials; counted with the comments per address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80, description: Who resolves it }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostComment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/previews/{token}/comments/{comment}/reopen:
    parameters:
      - { name: token, in: path, required: true, description: The preview link's token, schema: { type: string } }
      - { name: comment, in: path, required: true, description: "The thread's first comment", schema: { type: string } }
    post:
      operationId: reopenPreviewComment
      tags: [posts]
      security: []
      summary: Reopen a resolved feedback thread from the preview page (no credentials)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80, description: "Who reopens it (optional; the same body as resolve)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostComment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/previews/{token}/media/{media}:
    parameters:
      - { name: token, in: path, required: true, description: The preview link's token, schema: { type: string } }
      - { name: media, in: path, required: true, description: A media id of the previewed post, schema: { type: string } }
    get:
      operationId: getPreviewMedia
      tags: [posts]
      security: []
      summary: A picture or video of the previewed post (its own or its comments' media only)
      responses:
        "200": { description: The file, content: { "*/*": { schema: { type: string, format: binary } } } }
        "206": { description: Part of the file (Range) }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: Range not satisfiable }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/events:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listPostEvents
      tags: [posts]
      summary: The post's history, newest first (events:read)
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/eventCursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: previewPost
      tags: [posts]
      summary: The text each target will carry and what its provider objects to (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostPreview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/targets/{channel}/result:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: channel, in: path, required: true, description: The channel id of the target, schema: { type: string } }
    post:
      operationId: reportTargetResult
      tags: [posts]
      summary: Close a target on your own automation that waits for a result (posts:publish)
      description: |
        Only targets on a channel of provider `custom` take reported results, and only while they are
        `publishing` (409 otherwise). `published` needs no more; `failed` takes an `error`. The post
        settles when its last target does.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [published, failed] }, url: { type: string, description: "Where the post lives now" }, external_id: { type: string, description: "The platform's id of the post" }, error: { type: string, description: "Why it failed" } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/targets/{channel}/retry:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: channel, in: path, required: true, description: The channel id of the target, schema: { type: string } }
    post:
      operationId: retryTarget
      tags: [posts]
      summary: Try a failed target once more, now (posts:publish)
      description: A post carrying a file in Deleted is refused (422 on `media`); restore the file first.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Publishing, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/purge:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: purgePost
      tags: [posts]
      summary: Delete a post and its history, including every event about it (admin)
      description: |
        Unlike DELETE /v1/posts/{id} (which keeps the post's events as history), purge also deletes
        the post's events and their webhook deliveries (including pending ones), its media when no
        other post uses them, and cached idempotent responses containing it. One content-free
        `post.purged` event is recorded. Finished workspace exports are expired.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PurgeResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/tags:
    get:
      operationId: listTags
      tags: [posts]
      summary: List the workspace's post tags, most used first, the 500 most used at most (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Tag" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/work:
    get:
      operationId: listRequestedWork
      tags: [posts]
      summary: What the workspace asks your automation for (posts:read)
      description: |
        Targets on your own automation (provider `custom`) that are publishing and wait for a result
        (`kind: target`, with the post and the channel), and schedules of `source: agent` whose last run
        found nothing to publish (`kind: posts`, with the schedule). Each entry says when it was requested.
        Targets come oldest first, at most `limit` of them (100 by default, at most 500): it is a queue that
        drains as results come in, so ask again for the rest.
      parameters:
        - { name: limit, in: query, description: "Waiting targets at most (default 100, at most 500)", schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/WorkItem" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/providers:
    get:
      operationId: listProviders
      tags: [channels]
      summary: The platform catalog (channels:read)
      description: |
        Every platform staqly knows, with `status` available (can be connected) or soon, how it
        authenticates (`oauth2`, `token` or `none`), its posting limits, the fields a connection
        needs (token platforms) and the per-target settings its posts take. `app_configured` says
        whether an OAuth platform has a developer app (the workspace's own or the server's
        PROVIDER_<ID>_CLIENT_ID / _CLIENT_SECRET).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Provider" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/providers/{id}/app:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      operationId: setProviderApp
      tags: [channels]
      summary: Register the workspace's own developer app for an OAuth platform (channels:manage)
      description: The client secret is stored sealed and never returned. Needed when the server has no app for the platform (the Community Edition).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/DeveloperAppInput" }, { required: [client_id, client_secret] }] } } } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteProviderApp
      tags: [channels]
      summary: Remove the workspace's developer app for a platform (channels:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List connected channels (channels:read)
      description: Each channel comes with its `group_id` and `activity` (read from its targets). `group` keeps one channel group.
      parameters:
        - { name: group, in: query, schema: { type: string }, description: Only channels in this channel group (grp_...) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Channel" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: connectChannel
      tags: [channels]
      summary: Connect a channel on a token platform, or your own automation (channels:manage)
      description: |
        `fields` carries the provider's `credential_fields` (a bot token, an instance URL...); the
        platform is asked for the account's profile before the channel is saved, and the credentials
        are stored sealed. Provider `custom` (your own automation) takes no fields. OAuth platforms
        connect through GET /v1/channels/oauth/{provider}/start instead (422 here).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/ChannelInput" }, { required: [provider] }] } } } }
      responses:
        "201": { description: Connected, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/oauth/{provider}/start:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: startChannelOAuth
      tags: [channels]
      summary: Begin connecting an OAuth platform (channels:manage)
      description: |
        Answers the platform's authorization URL to send the browser to. The state is signed and
        bound to this browser with a short-lived cookie. Other query parameters are passed to the
        provider (`instance` for a Mastodon-style platform, say). The platform sends the browser back
        to the dashboard's `/channels/callback/{provider}` page, which hands the answer to the callback below.
      parameters:
        - { name: instance, in: query, description: "Platforms with many servers (Mastodon): the server's URL or host", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/oauth/{provider}/callback:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: finishChannelOAuth
      tags: [channels]
      summary: Finish connecting an OAuth platform (channels:manage)
      description: |
        Receives the platform's `code` and `state` (or `error`), creates the channel (or reconnects the
        existing one for the same account) and redirects the browser to the dashboard's
        `/channels/callback/{provider}` page with `?channel=<id>`, or `?error=<message>`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302":
          description: "Redirect to the dashboard's callback page (?channel=<id> or ?error=<message>)"
          headers: { Location: { schema: { type: string } } }
          content: { text/html: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channel-links:
    get:
      operationId: listChannelLinks
      tags: [channels]
      summary: The workspace's connect links, newest first (last 100); tokens are never shown again (channels:manage)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ChannelLink" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createChannelLink
      tags: [channels]
      summary: A link someone without access to Staqly opens to connect a channel to this workspace (channels:manage)
      description: |
        The answer carries `url` and `token` once; the token is in the URL fragment. The page shows the
        workspace's name, `note` and the platforms in `providers` (empty: every platform this server can
        connect; your own automation is never offered). Connected channels join `group_id` (empty: Default).
        A link works for `expires_in_hours` (default 168, at most 720) and `max_uses` channels (default 1, at
        most 50); revoke it with DELETE. The plan's channel limit applies when someone connects.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300, description: Shown to the person who opens the link }
                providers: { type: array, items: { type: string }, description: Platform ids to offer; empty offers every available one }
                group_id: { type: string, description: The channel group connected channels join (empty is Default) }
                expires_in_hours: { type: integer, minimum: 0, maximum: 720, description: "0 is 7 days" }
                max_uses: { type: integer, minimum: 0, maximum: 50, description: "How many channels may be connected; 0 is 1" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelLink" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channel-links/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      operationId: revokeChannelLink
      tags: [channels]
      summary: Stop a connect link from working; channels already connected stay (channels:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
    get:
      operationId: openConnectLink
      tags: [channels]
      security: []
      summary: What a connect link's page shows (no credentials; the token is the key; 60 per 10 minutes per address)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelLinkPublic" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: "The link was revoked, expired or used up (link_revoked, link_expired, link_used)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}/channels:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
    post:
      operationId: connectChannelViaLink
      tags: [channels]
      security: []
      summary: Connect a platform that signs in with a token, through a connect link (no credentials, no session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string }
                fields: { type: object, additionalProperties: { type: string }, description: The platform's credential fields }
      responses:
        "201":
          description: Connected
          content: { application/json: { schema: { type: object, required: [name, handle, provider], properties: { name: { type: string }, handle: { type: string }, provider: { type: string } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: "The link was revoked, expired or used up", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}/oauth/{provider}/start:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
      - { name: provider, in: path, required: true, schema: { type: string } }
    get:
      operationId: startChannelOAuthViaLink
      tags: [channels]
      security: []
      summary: Begin connecting an OAuth platform through a connect link (no credentials)
      description: |
        Like startChannelOAuth, but the signed state names the link instead of a session, so the callback
        connects the account in the link's workspace without anyone signed in. The state and the link are
        pinned to this browser with short-lived cookies.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: "The link was revoked, expired or used up", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/oauth/{provider}/callback:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: finishChannelOAuthViaLink
      tags: [channels]
      security: []
      summary: Finish connecting an OAuth platform started from a connect link (no credentials)
      description: |
        The dashboard's `/channels/callback/{provider}` page forwards the platform's answer here when the
        state belongs to a link. Redirects to the dashboard's `/add-channel` page with
        `?connected=<handle>&workspace=<name>` or `?error=<message>`, the link's token in the fragment.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302":
          description: "Redirect to the dashboard's /add-channel page"
          headers: { Location: { schema: { type: string } } }
          content: { text/html: { schema: { type: string } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get a channel (channels:read); credentials are never returned
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Rename, change defaults, turn off or on, or reconnect with fresh fields (channels:manage)
      description: |
        `status` is `connected` or `disabled` (a disabled channel's targets fail without trying).
        `fields` reconnects a token platform with new credentials, checked against the platform first;
        OAuth platforms reconnect through the OAuth flow.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelPatch" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Remove a channel; targets on it go with it (channels:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channel-groups:
    get:
      operationId: listChannelGroups
      tags: [channels]
