        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/purge:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: purgePost
      tags: [posts]
      summary: Delete a post and its history, including every event about it (admin)
      description: |
        Unlike DELETE /v1/posts/{id} (which keeps the post's events as history), purge also deletes
        the post's events and their webhook deliveries (including pending ones), its media when no
        other post uses them, and cached idempotent responses containing it. One content-free
        `post.purged` event is recorded. Finished workspace exports are expired.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PurgeResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/tags:
    get:
      operationId: listTags
      tags: [posts]
      summary: List the workspace's post tags, most used first, the 500 most used at most (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Tag" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/work:
    get:
      operationId: listRequestedWork
      tags: [posts]
      summary: What the workspace asks your automation for (posts:read)
      description: |
        Targets on your own automation (provider `custom`) that are publishing and wait for a result
        (`kind: target`, with the post and the channel), and schedules of `source: agent` whose last run
        found nothing to publish (`kind: posts`, with the schedule). Each entry says when it was requested.
        Targets come oldest first, at most `limit` of them (100 by default, at most 500): it is a queue that
        drains as results come in, so ask again for the rest.
      parameters:
        - { name: limit, in: query, description: "Waiting targets at most (default 100, at most 500)", schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/WorkItem" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/providers:
    get:
      operationId: listProviders
      tags: [channels]
      summary: The platform catalog (channels:read)
      description: |
        Every platform staqly knows, with `status` available (can be connected) or soon, how it
        authenticates (`oauth2`, `token` or `none`), its posting limits, the fields a connection
        needs (token platforms) and the per-target settings its posts take. `app_configured` says
        whether an OAuth platform has a developer app (the workspace's own or the server's
        PROVIDER_<ID>_CLIENT_ID / _CLIENT_SECRET).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Provider" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/providers/{id}/app:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      operationId: setProviderApp
      tags: [channels]
      summary: Register the workspace's own developer app for an OAuth platform (channels:manage)
      description: The client secret is stored sealed and never returned. Needed when the server has no app for the platform (the Community Edition).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/DeveloperAppInput" }, { required: [client_id, client_secret] }] } } } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteProviderApp
      tags: [channels]
      summary: Remove the workspace's developer app for a platform (channels:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/providers/{id}/check:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: checkProvider
      tags: [channels]
      summary: Check this server's setup for an OAuth platform (channels:manage)
      description: |
        Independent of any connected account: the app keys (and, where the platform can tell without an account, whether it
        accepts them: X and LinkedIn), the return address to register with the platform, and for platforms that download media
        themselves (Instagram) whether media links point at an address the internet can reach. Nothing is stored.
      responses:
        "200": { description: The checks, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderCheck" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List connected channels (channels:read)
      description: Each channel comes with its `group_id` and `activity` (read from its targets). `group` keeps one channel group.
      parameters:
        - { name: group, in: query, schema: { type: string }, description: Only channels in this channel group (grp_...) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Channel" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: connectChannel
      tags: [channels]
      summary: Connect a channel on a token platform, or your own automation (channels:manage)
      description: |
        `fields` carries the provider's `credential_fields` (a bot token, an instance URL...); the
        platform is asked for the account's profile before the channel is saved, and the credentials
        are stored sealed. Provider `custom` (your own automation) takes no fields. OAuth platforms
        connect through GET /v1/channels/oauth/{provider}/start instead (422 here). In cloud with billing, a
        workspace in its free trial that connects (or reconnects) an account another workspace used in a free
        trial that ended unpaid (one personal account, or two people behind shared spaces such as Slack
        workspaces) gets 402 `trial_already_used`: its trial is paused for review, nothing is charged, and
        channels connect again once it starts the paid plan.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/ChannelInput" }, { required: [provider] }] } } } }
      responses:
        "201": { description: Connected, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/oauth/{provider}/start:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: startChannelOAuth
      tags: [channels]
      summary: Begin connecting an OAuth platform (channels:manage)
      description: |
        Answers the platform's authorization URL to send the browser to. The state is signed and
        bound to this browser with a short-lived cookie. Other query parameters are passed to the
        provider (`instance` for an OAuth platform with many servers, say). The platform sends the browser back
        to the dashboard's `/channels/callback/{provider}` page, which hands the answer to the callback below.
      parameters:
        - { name: instance, in: query, description: "OAuth platforms with many servers: the server's URL or host", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/oauth/{provider}/callback:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: finishChannelOAuth
      tags: [channels]
      summary: Finish connecting an OAuth platform (channels:manage)
      description: |
        Receives the platform's `code` and `state` (or `error`), creates the channel (or reconnects the
        existing one for the same account) and redirects the browser to the dashboard's
        `/channels/callback/{provider}` page with `?channel=<id>`, `?pending=<id>` when the sign-in may
        publish as several accounts (see getPendingConnection), or `?error=<message>` (plus `&code=trial_already_used`
        when the account was used in an earlier free trial that ended unpaid; see PaymentRequired). Without a
        session (signed out meanwhile) or when the person cancelled on the platform's page it redirects with
        `?error=` too, never a 401.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302":
          description: "Redirect to the dashboard's callback page (?channel=<id>, ?pending=<id> or ?error=<message>)"
          headers: { Location: { schema: { type: string } } }
          content: { text/html: { schema: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/pending-connections/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getPendingConnection
      tags: [channels]
      summary: The accounts a sign-in may publish as, to pick from (channels:manage)
      description: |
        A platform whose sign-in may publish as several accounts (Facebook Pages, LinkedIn Pages, YouTube
        channels, Google Business locations...) does not connect one by itself: the callback lands on the
        dashboard's `/channels/callback/{provider}` page with `?pending=<id>`, and the sign-in waits here,
        sealed, for ten minutes. A sign-in with only one account connects it directly.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PendingConnection" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: finishPendingConnection
      tags: [channels]
      summary: Connect the picked accounts, each as its own channel (channels:manage)
      description: |
        Every picked account becomes a channel; one already connected (the same account) is reconnected
        instead. The sign-in is used once: to pick again, connect again. The plan's channel limit applies to
        each new channel.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids]
              properties:
                account_ids: { type: array, minItems: 1, items: { type: string }, description: Ids from the pending connection's accounts }
      responses:
        "201": { description: Connected, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Channel" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channel-links:
    get:
      operationId: listChannelLinks
      tags: [channels]
      summary: The workspace's connect links, newest first (last 100); tokens are never shown again (channels:manage)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ChannelLink" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createChannelLink
      tags: [channels]
      summary: A link someone without access to Staqly opens to connect a channel to this workspace (channels:manage)
      description: |
        The answer carries `url` and `token` once; the token is in the URL fragment. The page shows the
        workspace's name, `note` and the platforms in `providers` (empty: every platform this server can
        connect; your own automation is never offered). Connected channels join `group_id` (empty: Default).
        A link works for `expires_in_hours` (default 168, at most 720) and `max_uses` channels (default 1, at
        most 50); revoke it with DELETE. The plan's channel limit applies when someone connects.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300, description: Shown to the person who opens the link }
                providers: { type: array, items: { type: string }, description: Platform ids to offer; empty offers every available one }
                group_id: { type: string, description: The channel group connected channels join (empty is Default) }
                expires_in_hours: { type: integer, minimum: 0, maximum: 720, description: "0 is 7 days" }
                max_uses: { type: integer, minimum: 0, maximum: 50, description: "How many channels may be connected; 0 is 1" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelLink" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channel-links/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      operationId: revokeChannelLink
      tags: [channels]
      summary: Stop a connect link from working; channels already connected stay (channels:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
    get:
      operationId: openConnectLink
      tags: [channels]
      security: []
      summary: What a connect link's page shows (no credentials; the token is the key; 60 per 10 minutes per address)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelLinkPublic" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: "The link was revoked, expired or used up (link_revoked, link_expired, link_used)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}/channels:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
    post:
      operationId: connectChannelViaLink
      tags: [channels]
      security: []
      summary: Connect a platform that signs in with a token, through a connect link (no credentials, no session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string }
                fields: { type: object, additionalProperties: { type: string }, description: The platform's credential fields }
      responses:
        "201":
          description: Connected
          content: { application/json: { schema: { type: object, required: [name, handle, provider], properties: { name: { type: string }, handle: { type: string }, provider: { type: string } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: "The link was revoked, expired or used up", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}/oauth/{provider}/start:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
      - { name: provider, in: path, required: true, schema: { type: string } }
    get:
      operationId: startChannelOAuthViaLink
      tags: [channels]
      security: []
      summary: Begin connecting an OAuth platform through a connect link (no credentials)
      description: |
        Like startChannelOAuth, but the signed state names the link instead of a session, so the callback
        connects the account in the link's workspace without anyone signed in. The state and the link are
        pinned to this browser with short-lived cookies.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: "The link was revoked, expired or used up", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/{token}/pending/{id}:
    parameters:
      - { name: token, in: path, required: true, description: The connect link's token, schema: { type: string } }
      - { $ref: "#/components/parameters/id" }
    get:
      operationId: getPendingConnectionViaLink
      tags: [channels]
      security: []
      summary: The accounts a sign-in started from a connect link may publish as (no credentials)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PendingConnection" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: "The link was revoked, expired or used up", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: finishPendingConnectionViaLink
      tags: [channels]
      security: []
      summary: Connect the accounts a customer picked; each takes one use of the link (no credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids]
              properties:
                account_ids: { type: array, minItems: 1, items: { type: string } }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object, required: [name, handle, provider], properties: { name: { type: string }, handle: { type: string }, provider: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: "The link was revoked, expired or used up", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/connect-links/oauth/{provider}/callback:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: finishChannelOAuthViaLink
      tags: [channels]
      security: []
      summary: Finish connecting an OAuth platform started from a connect link (no credentials)
      description: |
        The dashboard's `/channels/callback/{provider}` page forwards the platform's answer here when the
        state belongs to a link. Redirects to the dashboard's `/add-channel` page with
        `?connected=<handle>&workspace=<name>`, `?pending=<id>&workspace=<name>` when the sign-in may publish
        as several accounts (see getPendingConnectionViaLink), or `?error=<message>`, the link's token in the
        fragment.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302":
          description: "Redirect to the dashboard's /add-channel page"
          headers: { Location: { schema: { type: string } } }
          content: { text/html: { schema: { type: string } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/oauth/{provider}/client-metadata.json:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getOAuthClientMetadata
      tags: [channels]
      security: []
      summary: The server's OAuth client metadata for a platform it is its own client on (Bluesky)
      description: |
        AT Protocol OAuth has no app to register: the client id is this document's address, which the
        platform fetches. It names the dashboard's callback and the server's public signing key. 404 for other
        platforms, and while the dashboard has no https address.
      responses:
        "200":
          description: Client metadata
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/channels/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get a channel (channels:read); credentials are never returned
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
