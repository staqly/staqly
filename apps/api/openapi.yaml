        from POST /v1/media. Each target is a channel the post goes to, with optional text of its own and
        provider settings; a target that breaks its provider's limits is a 422 keyed
        `targets.<channel_id>.content` or `targets.<channel_id>.settings.<key>`.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/PostInput" }, { required: [collection] }] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/delete:
    post:
      operationId: deletePosts
      tags: [posts]
      summary: Delete several posts (posts:delete)
      description: "Unknown ids, and ids of another workspace, are listed in `missing`. Posts that went out (published, publishing, or published on any of their channels) are history: they are listed in `kept` and not deleted."
      requestBody:
        required: true
