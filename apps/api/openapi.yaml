  /v1/collections/{id}/items:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listCollectionItems
      tags: [items]
      summary: List / search items in one collection (items:read)
      description: |
        A query runs for at most 5 seconds. A full-text search (`q`) that
        exceeds it returns 422 `search_too_broad` (add words or filters); a
        plain listing returns 503 `timeout`. Search text is limited to 16
        distinct words / 256 bytes; one-letter words match exactly.
      parameters:
        - { $ref: "#/components/parameters/itemStatus" }
        - { $ref: "#/components/parameters/itemDecision" }
        - { $ref: "#/components/parameters/itemRun" }
        - { $ref: "#/components/parameters/itemTag" }
        - { name: archived, in: query, description: "false leaves archived items out, true lists only them (default: both)", schema: { type: string, enum: ["true", "false"] } }
        - { name: run_action, in: query, description: Items whose current run was started by this action (e.g. publish); none for runs no action started, schema: { type: string } }
        - { $ref: "#/components/parameters/itemType" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/source" }
        - { $ref: "#/components/parameters/externalRef" }
        - { $ref: "#/components/parameters/createdAfter" }
        - { $ref: "#/components/parameters/createdBefore" }
        - { $ref: "#/components/parameters/decidedAfter" }
        - { $ref: "#/components/parameters/decidedBefore" }
        - { $ref: "#/components/parameters/itemSort" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createItem
      tags: [items]
      summary: Create an item (items:write)
      description: |
        JSON body, or `multipart/form-data` with one `file` part (uploaded as media;
        more than one is 400, and the upload is deleted again if the item can't
        be created) and an optional `item` part containing the JSON fields. The
        `{id}` may also be the collection's exact name.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/CreateItemInput" } }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                item: { type: string, description: JSON-encoded CreateItemInput }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/flow:
    get:
      operationId: getFlow
      tags: [items]
      summary: Items per state and events per type in the last 24 hours (the counts behind the inbox steps)
      parameters:
        - { name: collection_id, in: query, description: One collection (default every collection), schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sources, states, events, since]
                properties:
                  sources:
                    type: array
                    description: Who adds items (the item's source), most recent first
                    items:
                      type: object
                      required: [source, items, last_created_at]
                      properties:
                        source: { type: string, description: 'e.g. n8n, claude-code, watcher:<name>; "" when not set' }
                        items: { type: integer }
                        last_created_at: { type: string, format: date-time }
                  states:
                    type: array
                    items:
                      type: object
                      required: [decision, run, run_action, archived, items]
                      properties:
                        decision: { type: string, description: 'pending, approved, rejected, expired, or "" for drafts' }
                        run: { type: string, enum: [none, processing, completed, failed] }
                        run_action: { type: string, description: The action that started the run ("" when none) }
                        archived: { type: boolean }
                        items: { type: integer }
                  events:
                    type: object
                    additionalProperties: { type: integer }
                    description: Event type to count since `since`
                  since: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
