              schema:
                type: object
                required: [deleted, missing, kept]
                properties:
                  deleted: { type: array, items: { type: string } }
                  missing: { type: array, items: { type: string } }
                  kept: { type: array, items: { type: string }, description: "Posts that went out: history, never deleted" }
