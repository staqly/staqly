        "200": { description: "The new key, shown once", content: { application/json: { schema: { type: object, required: [recovery_key], properties: { recovery_key: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/access-token:
    get:
      operationId: getAccessToken
      tags: [auth]
      summary: The Community Edition's access token (dashboard sessions and the token itself)
      description: "What agents, SDKs and the CLI send as `Authorization: Bearer <token>`. 404 in cloud mode (it uses API keys)."
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, description: "stk_local_..." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
