  /v1/previews/{token}/comments:
    parameters:
      - { name: token, in: path, required: true, description: The preview link's token, schema: { type: string } }
    post:
      operationId: addPreviewComment
      tags: [posts]
      security: []
      summary: Leave a comment on a previewed post (no credentials; 20 per 10 minutes per address, 30 an hour per link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string, maxLength: 80, description: Who is commenting }
                email: { type: string, description: "Optional; shown to the team only" }
                body: { type: string, maxLength: 2000 }
                quote: { type: string, maxLength: 500, description: "The words of the post the comment is about; they must be in the text named by channel_id and part" }
                channel_id: { type: string, description: The channel's version the comment is about }
                part: { type: integer, minimum: 0, description: "0: the post's text (default); n: the n-th comment of its thread" }
                anchor_start: { type: integer, description: "Where the quote starts (UTF-16 code units); when it doesn't match, the quote's first occurrence is used" }
                anchor_end: { type: integer, description: Where it ends (exclusive) }
                parent_id: { type: string, description: "Reply to this thread (a reply takes no quote)" }
      responses:
