        Fields left out stay as they are; `targets` replaces the whole list; `publish_at: null` clears
        the time (a scheduled post becomes a draft). A published or publishing post is not editable
        (409 `conflict`). `expected_version` makes the edit conditional (409 `post_changed`).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PostPatch" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a draft, scheduled or failed post; its events stay as history (posts:delete)
      description: |
        Requires `posts:delete`; `posts:write` alone answers 403. A post that went out (published, publishing, or
