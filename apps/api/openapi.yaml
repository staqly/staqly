  /v1/analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: The workspace's publishing analytics for a range of days (posts:read)
      description: |
        Aggregated from the workspace's own posts and targets; platform numbers (views, likes...) are the ones already
        cached on published targets (GET /v1/posts/{id}/metrics reads them, your automation reports its own), so this
        never calls a platform. `from` and `to` are days in the workspace's time zone, both included (default: the last
        30 days up to today; at most 366 days). `previous` holds the same totals for the period of the same length right
        before, for comparisons. `queue` is what waits now. `sources` ignores the `source` filter so sources can be
        compared; `feedback` ignores `channel`. A target's outcome time is when it was published, or for a failed one
        when it failed.
      parameters:
        - { name: from, in: query, description: "First day, YYYY-MM-DD in the workspace's time zone", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last day (included), YYYY-MM-DD; default today", schema: { type: string, format: date } }
        - { name: days, in: query, description: "Instead of from: the last n days up to to (7, 30, 90...)", schema: { type: integer, minimum: 1, maximum: 366 } }
        - { name: channel, in: query, description: "Only these channels' targets; repeat it for several (channel=a&channel=b)", schema: { type: array, maxItems: 100, items: { type: string } } }
        - { name: collection, in: query, description: "Only posts of this collection", schema: { type: string } }
        - { name: source, in: query, description: "Only posts from these sources, as `sources[].source` names them (dashboard, an agent's name, schedule:<name>, repeat); repeat it for several. An empty one is the posts with none recorded", schema: { type: array, maxItems: 100, items: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/metrics:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getPostMetrics
      tags: [posts]
      summary: The post's numbers per channel, read from each platform that reports them (posts:read)
      description: |
        Published targets on platforms that report numbers (X, YouTube, Slack) are read again when the cached numbers are older
        than ten minutes, or now with `refresh=true`. A failed read keeps the last numbers and sets `error`.
        Targets on your own automation show what it reported (PUT .../metrics). `available: false` means the
        platform gives no numbers.
      parameters:
        - { name: refresh, in: query, description: "Read every published target's numbers now", schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/TargetMetrics" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/posts/{id}/targets/{channel}/metrics:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: channel, in: path, required: true, description: The channel id of the target, schema: { type: string } }
    put:
      operationId: reportTargetMetrics
      tags: [posts]
      summary: Your own automation sends the numbers of a post it published (posts:publish)
      description: Only targets on a channel of provider `custom` (409 `conflict` otherwise, as for a reported result). Negative numbers are 422. Replaces the stored numbers.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
