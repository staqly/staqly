  /v1/access-token/rotate:
    post:
      operationId: rotateAccessToken
      tags: [auth]
      summary: Make a new access token (Community Edition)
      description: |
        The old token stops working at once; every browser session except the
        caller's is signed out. Recorded as an `access_token.rotated` event. 409
        when STAQLY_LOCAL_TOKEN fixes the token; 404 in cloud mode.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: The new token
          content:
            application/json:
              schema:
                type: object
                required: [token, sessions_revoked]
                properties:
                  token: { type: string }
                  sessions_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/api-keys:
    get:
      operationId: listAPIKeys
      tags: [auth]
      summary: List API keys (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, available_scopes]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
