        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PostPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post (posts:write; scheduling or publishing it right away also needs posts:publish)
      description: |
        A draft unless `status` is `scheduled` (needs `publish_at` in the future and at least one target)
