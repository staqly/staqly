        without a time last by creation). `q` matches words of the content; `tag` is one tag.
      parameters:
        - { name: collection_id, in: query, description: A collection id or exact name, schema: { type: string } }
        - { $ref: "#/components/parameters/postStatus" }
        - { $ref: "#/components/parameters/channelId" }
        - { $ref: "#/components/parameters/publishAfter" }
        - { $ref: "#/components/parameters/publishBefore" }
        - { $ref: "#/components/parameters/hidePast" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/tag" }
