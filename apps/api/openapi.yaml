                name: { type: string, description: "What the person calls it, such as MacBook (default Passkey)" }
                response: { type: object, description: "The PublicKeyCredential as JSON (credential.toJSON())" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/SignInMethodList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "410": { description: "The passkey prompt expired or was already answered", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/passkey/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: renamePasskey
      tags: [accounts]
      summary: Rename a passkey
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignInMethodList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/sign-in-methods/google:
    post:
      operationId: startGoogleLink
      tags: [accounts]
      summary: Start adding a Google account as a sign-in method
      description: Sets the sealed sign-in cookie and returns the Google URL to send the browser to; Google comes back to /settings/account?linked=google or ?error=<code> (`identity_taken`).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
