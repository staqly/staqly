        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/agents:
    get:
      operationId: listAgents
      tags: [auth]
      summary: Agents seen talking to the workspace, most recently active first
      description: >-
        Recorded automatically: MCP clients by their clientInfo (Claude Code, Codex, Cursor...), REST clients by
        their User-Agent (an SDK's appended user agent names the agent), per credential. Browsers are not agents.
        Needs admin: it names the API keys agents use. At most 200 agents are kept per workspace.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/agents/{id}:
    delete:
      operationId: forgetAgent
      tags: [auth]
      summary: Remove an agent from the list (it comes back when it talks to the workspace again)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media:
    get:
      operationId: listMedia
      tags: [media]
      summary: The media library (media:read), newest first by default
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Part of the file name (case-insensitive) }
        - { name: kind, in: query, schema: { type: string, enum: [image, video, audio] } }
        - { name: used, in: query, schema: { type: string, enum: [used, unused] }, description: "used (posts carry it) or unused" }
        - { name: folder, in: query, schema: { type: string }, description: "A folder id (files directly in it) or root (the top level); omit for every folder" }
        - { name: tag, in: query, schema: { type: string }, description: "Files carrying this tag (normalised like on save: lowercase, no #)" }
        - { name: deleted, in: query, schema: { type: boolean, default: false }, description: "true lists the files in Deleted (each with deleted_at and purge_at) instead of the library" }
        - { name: duplicates, in: query, schema: { type: boolean, default: false }, description: "true lists only files with an identical twin (same sha256), grouped by content, oldest first" }
        - { name: sort, in: query, schema: { type: string, enum: [created_desc, created_asc, size_desc, name_asc], default: created_desc } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a file (media:write). Type is detected from content; SVG/HTML are rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/delete:
    post:
      operationId: deleteMediaMany
      tags: [media]
      summary: Move several files to Deleted, or delete them for good with permanent (posts:delete)
      description: "Moving to Deleted is refused (409) when a scheduled post uses one of the files; nothing moves then. With `permanent`, posts referencing the files lose them."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                permanent: { type: boolean, default: false, description: "Delete for good now instead of moving to Deleted" }
      responses:
        "200":
          description: What was deleted and which ids were not found
          content:
            application/json:
              schema:
                type: object
                required: [deleted, missing]
                properties:
                  deleted: { type: array, items: { type: string } }
                  missing: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/bulk:
    post:
      operationId: bulkUpdateMedia
      tags: [media]
      summary: Move several files to a folder and/or add and remove tags (media:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                folder_id: { type: string, description: "A folder id, or empty for the top level; omit to leave folders alone" }
                add_tags: { type: array, items: { type: string } }
                remove_tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: Which files changed and which ids were not found
          content:
            application/json:
              schema:
                type: object
                required: [updated, missing]
                properties:
                  updated: { type: array, items: { type: string } }
                  missing: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media-folders:
    get:
      operationId: listMediaFolders
      tags: [media]
      summary: The library's folders, file counts and tags (media:read)
      responses:
        "200": { description: The tree, content: { application/json: { schema: { $ref: "#/components/schemas/MediaFolders" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createMediaFolder
      tags: [media]
      summary: Create a folder, at the top level or inside another (media:write)
      description: Names are unique among a folder's subfolders, ignoring case (409). Folders nest at most 10 deep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                parent_id: { type: string, description: A folder id; empty or omitted for the top level }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MediaFolder" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media-folders/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      operationId: updateMediaFolder
      tags: [media]
      summary: Rename a folder or move it under another one (media:write)
      description: A folder can't move inside itself or one of its own folders (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                parent_id: { type: string, description: "A folder id, or empty for the top level" }
      responses:
        "200": { description: The folder, content: { application/json: { schema: { $ref: "#/components/schemas/MediaFolder" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteMediaFolder
      tags: [media]
      summary: Delete a folder (media:write); its files and subfolders move up to its parent, no file is deleted
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}/info:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getMediaInfo
      tags: [media]
      summary: A file's details (media:read); the file itself is GET /v1/media/{id}
      responses:
        "200": { description: The file, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: restoreMedia
      tags: [media]
      summary: Take a file out of Deleted, back where it was (posts:delete)
      responses:
        "200": { description: The file, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}/keep:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: keepMedia
      tags: [media]
      summary: Keep this file of a set of identical ones (posts:delete and posts:write)
      description: Posts that use a copy (in their files or a comment) use this file instead, in one transaction, and the copies move to Deleted.
      responses:
        "200":
          description: The copies moved to Deleted
          content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: array, items: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}/replace:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: replaceMedia
      tags: [media]
      summary: Replace a file with its edit (media:write, posts:write, posts:delete)
      description: >
        The media editor's "Replace the original". A media id never changes content, so the edit is a new file that
        takes the original's name, alt text, folder and tags; drafts that used the original use it instead, and the
        original moves to Deleted (restorable for 30 days). A file that a scheduled, publishing, published or
        failed post uses answers 409: those posts keep what they had, save the edit as a new file instead.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: The edited file, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media-projects:
    get:
      operationId: listMediaProjects
      tags: [media]
      summary: The media editor's projects, newest first (media:read)
      parameters:
        - { name: media, in: query, schema: { type: string }, description: "Only projects made from this file or saved as it" }
      responses:
        "200":
          description: Projects
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MediaProject" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createMediaProject
      tags: [media]
      summary: Save an editable project of the media editor (media:write)
      description: The file is the editor's .gpex project (layers, text, masks). Projects count toward the workspace's storage.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/MediaProjectUpload" }
      responses:
        "201": { description: The project, content: { application/json: { schema: { $ref: "#/components/schemas/MediaProject" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media-projects/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getMediaProject
      tags: [media]
      summary: A project's facts (media:read)
      responses:
        "200": { description: The project, content: { application/json: { schema: { $ref: "#/components/schemas/MediaProject" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      operationId: updateMediaProject
      tags: [media]
      summary: Save a new version of a project (media:write)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/MediaProjectUpload" }
      responses:
        "200": { description: The project, content: { application/json: { schema: { $ref: "#/components/schemas/MediaProject" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteMediaProject
      tags: [media]
      summary: Delete a project and its file; the files it was made from stay (posts:delete)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media-projects/{id}/file:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getMediaProjectFile
      tags: [media]
      summary: Download a project's .gpex file (media:read)
      responses:
        "200": { description: The project file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/ai:
    get:
      operationId: getAI
      tags: [media]
      summary: Whether the media editor's AI tools work, with which model (media:read)
      description: >
        The AI tools run on the workspace's own OpenAI key; staqly never pays for these calls. The key is never
        returned, only its last four characters.
      responses:
        "200": { description: AI status, content: { application/json: { schema: { $ref: "#/components/schemas/AIStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      operationId: setAI
      tags: [media]
      summary: Set the workspace's OpenAI key and image model (admin)
      description: The key is checked with OpenAI (listing the model, which costs nothing), then stored encrypted. Without api_key, only the model changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [openai] }
                model: { type: string, enum: [gpt-image-1, gpt-image-1-mini, dall-e-3, dall-e-2], description: Defaults to gpt-image-1 }
                api_key: { type: string, description: "An OpenAI API key (sk-...)" }
      responses:
        "200": { description: AI status, content: { application/json: { schema: { $ref: "#/components/schemas/AIStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
    delete:
      operationId: deleteAI
      tags: [media]
      summary: Forget the workspace's AI key (admin)
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/ai/images/{op}:
    parameters:
      - { name: op, in: path, required: true, schema: { type: string, enum: [generate, edit] } }
    post:
      operationId: aiImage
      tags: [media]
      summary: Make a picture with the workspace's AI key (media:write)
      description: >
        generate makes a picture from a prompt; edit changes the image by the prompt, only inside the mask's
        transparent pixels when a mask is sent. Answers the picture; nothing is stored. At most 30 pictures per 10
        minutes per workspace; the provider's own limits and refusals come back as 429 or 422.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, maxLength: 4000 }
                size: { type: string, description: "The model's sizes, e.g. 1024x1024, 1536x1024, 1024x1536 (gpt-image-1)" }
                image: { type: string, format: binary, description: Required for edit }
                mask: { type: string, format: binary, description: "PNG; transparent pixels mark what may change" }
      responses:
        "200": { description: The picture, content: { image/png: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/media/{id}/usage:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getMediaUsage
      tags: [media]
      summary: Posts that use a file (media:read; empty without posts:read), newest first, at most 50
      responses:
        "200":
          description: The posts
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MediaUse" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getMedia
      tags: [media]
      summary: Download/preview a file (media:read). Supports Range requests.
      description: >
        With `w`, returns a thumbnail at most `w` pixels wide instead of the
        original (PNG, JPEG, GIF first frame, WebP). Thumbnails are generated
        on first request and cached on disk; JPEG for opaque images, PNG when
        there is transparency; EXIF orientation is applied. Images are never
        upscaled: when the original is not wider than `w`, it is returned
        as is, as it is for AVIF and for images over 50 megapixels (not
        decoded server-side). Thumbnail responses carry an `ETag` and
        `Cache-Control: private, max-age=31536000, immutable` (a media id
        never changes content). Other file types answer 422 when `w` is set.
      parameters:
        - { name: download, in: query, schema: { type: string }, description: Force attachment disposition }
        - { name: w, in: query, schema: { type: integer, enum: [160, 320, 640, 1280] }, description: "Thumbnail width in pixels (images only)" }
      responses:
        "200": { description: "File bytes (or the thumbnail), with the stored MIME type", content: { "*/*": { schema: { type: string, format: binary } } } }
        "206": { description: Partial content (Range request), content: { "*/*": { schema: { type: string, format: binary } } } }
        "304": { description: Not modified (If-None-Match / If-Modified-Since) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: Range not satisfiable }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateMedia
      tags: [media]
      summary: Rename a file, set its alt text, move it to a folder, set its tags, or report a video's size and length (media:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                alt_text: { type: string, maxLength: 1500 }
                width: { type: integer, minimum: 0, maximum: 100000 }
                height: { type: integer, minimum: 0, maximum: 100000 }
                duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
                folder_id: { type: string, description: "Moves the file: a folder id, or empty for the top level" }
                tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 }, description: "Replaces the file's tags; lowercased, without #, spaces become dashes" }
      responses:
        "200": { description: The file, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Move a file to Deleted (restorable for 30 days), or delete it for good with permanent=true (posts:delete)
      description: >
        Requires `posts:delete`; `media:write` alone answers 403. A file in Deleted is still served and still
        counts toward storage; the retention sweep deletes it for good 30 days later (`purge_at`). Moving a
        file that a scheduled or publishing post uses answers 409. With `permanent=true` the file is deleted
        now and posts referencing it lose it.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
        - { name: permanent, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Moved to Deleted (or deleted for good) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Workspace activity log, newest first (events:read)
      description: >
        Credential and session audit events (api_key.*, session.*,
        recovery_key.*, device.*, device_link.*, sign_in_method.*) are only listed for admin
        principals (dashboard sessions, the Community Edition's access token, keys with the admin scope).
      parameters:
        - { name: post_id, in: query, schema: { type: string } }
        - { name: collection_id, in: query, schema: { type: string } }
        - { name: channel_id, in: query, schema: { type: string } }
        - { name: schedule_id, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: actor_type, in: query, schema: { type: string, enum: [local, session, api_key, system] } }
        - { name: actor_id, in: query, description: "One actor, e.g. an API key id (key_...) or a session id", schema: { type: string } }
        - { name: agent, in: query, description: "Agent name as listed by /v1/agents (e.g. claude-code, n8n); repeat for any of several", schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: type_prefix, in: query, description: "Literal type prefix, e.g. `post.` or `webhook.`", schema: { type: string } }
        - { name: from, in: query, description: "created_at >= (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
        - { name: to, in: query, description: "created_at < (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
        - { name: since, in: query, description: Alias of from, schema: { type: string } }
        - { name: until, in: query, description: Alias of to, schema: { type: string } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/eventCursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhooks (webhooks:manage)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Webhook" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook. A signing secret is generated.
      description: The response is the only one that shows the signing secret in full (besides rotate_secret); store it now.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/WebhookInput" }, { required: [url] }] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/webhooks/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Update a webhook (set rotate_secret to issue a new secret)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/webhooks/{id}/test:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: testWebhook
      tags: [webhooks]
      summary: Queue a webhook.test delivery
      description: Rate-limited per principal (burst 5, then 10 per minute).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Delivery history, newest first (50 a page by default, at most 200; next_cursor for older ones)
      parameters:
        - { name: webhook_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, succeeded, failed] } }
        - { name: post_id, in: query, description: Only deliveries of events about this post, schema: { type: string } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Delivery" } }, next_cursor: { type: string, description: "Older deliveries: pass it as cursor; absent on the last page" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/webhook-deliveries/{id}/retry:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: retryWebhookDelivery
      tags: [webhooks]
      summary: Re-queue a finished delivery
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/events/export:
    get:
      operationId: exportEvents
      tags: [events]
      summary: Export the activity log as NDJSON or CSV, oldest first (events:read)
      description: |
        Streams every matching event (chunked; no page size). CSV columns:
        `created_at,id,type,actor_type,actor_id,actor_name,collection_id,post_id,data`
        where `data` is the event's JSON. CSV cells starting with `=`, `+`, `-`,
        `@`, tab or CR are prefixed with `'` (spreadsheet formula injection).
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [ndjson, csv], default: ndjson } }
        - { name: from, in: query, description: "created_at >= (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
        - { name: to, in: query, description: "created_at < (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
        - { name: type, in: query, description: Exact event type, schema: { type: string } }
        - { name: type_prefix, in: query, description: "Literal prefix, e.g. `post.`", schema: { type: string } }
        - { name: actor_type, in: query, schema: { type: string, enum: [session, api_key, local, system] } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: collection_id, in: query, schema: { type: string } }
        - { name: post_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Event stream (attachment)
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/Event" }
            text/csv:
              schema: { type: string }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/export:
    post:
      operationId: createWorkspaceExport
      tags: [auth]
      summary: Start a workspace export (admin; GDPR data portability)
      description: |
        Queues a background job that builds a ZIP (workspace.json,
        collections.ndjson, posts.ndjson with their targets, events.ndjson,
        media.ndjson, media/ files under their original names, webhooks.json
        with secrets redacted, channels.json without credentials, schedules.json, README.txt).
        Every plan can export. On a plan without data export (Starter) the
        export is data only (`includes_media: false`): the same files without
        media/, media.ndjson lists each file by id, original_name and
        mime_type. Plus and above, the trial and the Community Edition get the files too.
        Only one export per workspace may be pending or running (409 with
        `details.export_id`). Finished archives are deleted after 24 hours.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceExport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/exports:
    get:
      operationId: listWorkspaceExports
      tags: [auth]
      summary: The workspace's latest exports (backups), newest first, at most 20 (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WorkspaceExport" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/exports/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getWorkspaceExport
      tags: [auth]
      summary: Export job status (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceExport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/exports/{id}/download:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: downloadWorkspaceExport
      tags: [auth]
      summary: Download a finished export (admin)
      responses:
        "200": { description: ZIP archive (attachment), content: { application/zip: { schema: { type: string, contentMediaType: application/zip } } } }
        "206": { description: Partial content (Range request), content: { application/zip: { schema: { type: string, contentMediaType: application/zip } } } }
        "304": { description: Not modified (If-Modified-Since) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "416": { description: Range not satisfiable }
        "429": { $ref: "#/components/responses/RateLimited" }

  /livez:
    get:
      operationId: livez
      tags: [system]
      summary: Liveness probe
      description: 200 while the process can serve HTTP. Does not touch the database.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      operationId: readyz
      tags: [system]
      summary: Readiness probe
      description: |
        Checks the database (ping), that every embedded migration is applied,
        and that the background workers are running (heartbeat newer than 30s).
        `workers` is `not_started` (not a failure) when the process runs no
        background workers.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /metrics:
    get:
      operationId: metrics
      tags: [system]
      summary: Prometheus metrics (text exposition format 0.0.4)
      description: |
        Allowed for direct requests from this machine (loopback peer, local
        Host, no proxy/Origin headers) or with `Authorization: Bearer
        <METRICS_TOKEN>`. Everything else gets 404.
      security:
        - {}
        - metricsToken: []
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: Not allowed (endpoint hidden)

  /v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alert channels (alerts:manage)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Alert" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert channel (alerts:manage)
      description: |
        Telegram, Slack, Discord, ntfy or email. Secrets are stored encrypted and returned masked.
        Default events: `post.published`, `post.failed`, `channel.needs_reconnect`. Messages carry a
        dashboard link to the post and, for `post.target_published`, the public URL.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/AlertInput" }, { required: [name, type, config] }] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/alerts/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getAlert
      tags: [alerts]
      summary: Get an alert channel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateAlert
      tags: [alerts]
      summary: Update an alert channel
      description: |
        `config` keys are merged into the stored config; `null` removes a key. Sending a masked
        secret back keeps the stored one. Changing where messages go (a Telegram chat_id, say)
        requires the secret again (422). Re-enabling resets the failure count.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AlertInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert channel
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/alerts/{id}/test:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: testAlert
      tags: [alerts]
      summary: Send a test message now
      description: Rate-limited per principal (burst 5, then 10 per minute).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: Result of the attempt (delivery errors are reported, not raised)
          content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, error: { type: string } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/alerts/{id}/deliveries:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: listAlertDeliveries
      tags: [alerts]
      summary: Recent outbox rows of an alert channel
      parameters:
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AlertDelivery" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /mcp:
    post:
      operationId: mcp
      tags: [setup]
      summary: MCP Streamable HTTP endpoint (stateless; bearer access token in the Community Edition, bearer API key in cloud mode)
      responses:
        "200": { description: JSON-RPC response }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "API key (stk_...), or in the Community Edition the access token (stk_local_...)" }
    session: { type: apiKey, in: cookie, name: staqly_session }

    metricsToken:
      type: http
      scheme: bearer
      description: The METRICS_TOKEN environment value (not an API key).

  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    limit: { name: limit, in: query, description: "Page size (default 50, at most 200)", schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    cursor: { name: cursor, in: query, description: Opaque keyset cursor (the previous page's next_cursor), schema: { type: string } }
    eventCursor: { name: cursor, in: query, description: "The previous page's next_cursor (an event seq)", schema: { type: string, pattern: "^[0-9]+$" } }
    postStatus: { name: status, in: query, schema: { $ref: "#/components/schemas/PostStatus" } }
    channelId: { name: channel_id, in: query, description: Posts with a target on this channel, schema: { type: string } }
    tag: { name: tag, in: query, description: Posts carrying this tag, schema: { type: string, example: "launch" } }
    q: { name: q, in: query, description: "Words of the content (case-insensitive substring match)", schema: { type: string } }
    publishAfter: { name: publish_after, in: query, description: "publish_at >= (RFC3339 or YYYY-MM-DD); posts without a time never match", schema: { type: string } }
    publishBefore: { name: publish_before, in: query, description: "publish_at < (RFC3339 or YYYY-MM-DD)", schema: { type: string } }
    postSort: { name: sort, in: query, description: "Default publish_asc (soonest first, posts without a time last). created_* and updated_desc order by those times.", schema: { type: string, enum: [publish_asc, publish_desc, created_desc, created_asc, updated_desc] } }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Replays the stored response when the same key is repeated with the same method, path,
        query string and body within 24 hours (422 `idempotency_mismatch` with a different
        request, 409 `idempotency_in_progress` while the first one runs). Not applied to
        multipart uploads or to responses that carry a secret.
      schema: { type: string, maxLength: 200 }

  responses:
    BadRequest:
      description: The body is not valid JSON or has unknown fields (`bad_request`)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked credentials (`unauthorized`). In cloud mode every
        /v1 request except the public ones needs an API key or a session; a malformed or
        unknown `Authorization` header is refused on every /v1 endpoint.
      headers:
        WWW-Authenticate: { schema: { type: string }, description: "Bearer realm=\"staqly\"" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    PaymentRequired:
      description: |
        `plan_limit_exceeded` (a plan limit; `details` has limit, max, used, plan),
        `plan_expired` (the workspace is suspended and read-only), `payment_required`, `payment_failed` (a plan
        change that charges at once, such as leaving the trial, wasn't paid: nothing changed), or `x_posts_exhausted` (this
        period's posts to X, included and bought, can't cover the post; `details` has needed, left, period_end).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: |
        `forbidden` (the API key lacks a scope, or the action needs a dashboard session) or
        `csrf_failed` (session request without a valid `X-CSRF-Token`).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Not found in this workspace (`not_found`)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: |
        `conflict` (state or version conflict, including re-applying the current state,
        e.g. "collection is already archived"), or `idempotency_in_progress` when a request
        with the same `Idempotency-Key` is still running.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Gone:
      description: Used, expired or deleted (`gone`, `link_used`, `link_expired`)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    PayloadTooLarge:
      description: Body over the size limit (`too_large`; JSON bodies 2 MiB, uploads MAX_UPLOAD_BYTES)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UnsupportedMediaType:
      description: |
        A file type that may not be uploaded (`unsupported_media_type`). A request body that
        is neither JSON nor multipart/form-data also gets 415 with the same error code.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ValidationFailed:
      description: |
        `validation_failed` (`fields` maps each invalid field to a message), or
        `idempotency_mismatch` when an `Idempotency-Key` is reused with a different request.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: |
        Too many requests (`error.code` = `rate_limited`). Unauthenticated
        sensitive endpoints (POST /v1/sessions/recover, POST
        /v1/sessions/api-key, POST /v1/device-links/redeem, POST /v1/workspaces) are
        limited per client IP; other /v1 and /mcp requests in cloud mode are
        limited per API key / session.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BadGateway:
      description: The payment provider (Stripe) refused or failed the request (`payment_provider_error`)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    Agent:
      type: object
      required: [id, kind, name, version, principal_id, principal_name, first_seen_at, last_seen_at, requests, posts_created]
      properties:
        id: { type: string }
        kind: { type: string, enum: [mcp, api] }
        name: { type: string, description: "e.g. claude-code, my-agent, n8n" }
        version: { type: string }
        principal_id: { type: string, description: "The API key it uses, or local for the local access token" }
        principal_name: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        requests: { type: integer, description: "Requests recorded (written at most once a minute)" }
        posts_created: { type: integer }
    Usage:
      description: Plan, monthly usage and trial/suspension state (also returned inline by GET /v1/workspace/usage)
      type: object
      required: [plan, period, usage, plan_expires_at, trial_ends_at, suspended, posts_by_status, webhook_deliveries]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        period: { type: string, examples: ["2026-10"] }
        usage:
          type: object
          required: [posts_per_month, channels, seats, alerts, webhooks, api_keys, storage_bytes, x_posts_per_period]
          properties:
            posts_per_month: { type: integer, description: Posts created this month }
            channels: { type: integer, description: Connected channels }
            seats: { type: integer, description: "Seats billed: the workspace members (each billed per user)" }
            alerts: { type: integer }
            webhooks: { type: integer }
            api_keys: { type: integer }
            storage_bytes: { type: integer }
            x_posts_per_period: { type: integer, description: "Posts to X this month (a post with a live link counts 14)" }
        plan_expires_at:
          type: [string, "null"]
          format: date-time
          description: |
            End of the free trial or paid period; null = no end. A Stripe-billed plan adds a 3-day payment grace
            after its paid or trial period, so count a trial down to `trial_ends_at` instead.
        trial_ends_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the 7-day free trial ends: Stripe's `trial_end` for a Stripe trial, the end of the server-side
            trial on a server without billing; null when the workspace is in no trial.
        suspended:
          type: boolean
          description: |
            The trial or paid period ended unpaid. The workspace is read-only:
            reads and exports work, other changes answer 402 `plan_expired` until it is
            a plan is paid for (`POST /v1/billing/checkout`).
        posts_by_status:
          type: object
          description: Posts created this period, counted by their current status (statuses with no posts are left out).
          additionalProperties: { type: integer }
          examples: [{ draft: 2, scheduled: 2, published: 1 }]
        webhook_deliveries:
          type: object
          description: Webhook deliveries right now. `failed` gave up after every retry and can be redelivered.
          required: [queued, retrying, failed]
          properties:
            queued: { type: integer, description: Waiting for their first attempt }
            retrying: { type: integer, description: "Failed at least once; another attempt is scheduled" }
            failed: { type: integer, description: Gave up after every retry }
    Billing:
      type: object
      required: [enabled, plan, subscription_status, plan_expires_at, trial_ends_at, suspended, has_customer, seats, trial]
      properties:
        enabled: { type: boolean, description: Billing is configured on this instance }
        plan: { type: string, description: "starter, plus, pro or business (cloud; an operator may also set a plan of their own), unlocked (Community Edition)", examples: [plus] }
        subscription_status:
          type: [string, "null"]
          description: Stripe's status (active, trialing, past_due, canceled, unpaid, incomplete); null when never subscribed
          examples: [active]
        plan_expires_at: { type: [string, "null"], description: "End of the trial or paid period, plus a 3-day payment grace when Stripe bills it (null = no end)" }
        trial_ends_at: { type: [string, "null"], format: date-time, description: "When the free trial ends (Stripe's trial_end, or the server-side trial's end without billing); null when not in a trial" }
        suspended: { type: boolean, description: The period ended unpaid; the workspace is read-only }
        has_customer: { type: boolean, description: A Stripe customer exists (the portal is available) }
        seats: { type: integer, description: "People billed: every workspace member, whatever the role (plans are priced per user). Open invitations are billed once accepted; the subscription's quantity follows the members", examples: [3] }
        trial:
          type: string
          enum: [available, used, other_workspace, none]
          description: "Whether choosing Starter now starts its 7-day trial (card required): available; used (this workspace had a subscription before); other_workspace (another workspace of the account is in its trial, so this one is charged today); none (billing off, or the workspace already pays). Each workspace gets the trial once, one workspace of an account at a time"
    XPosts:
      type: object
      required: [period, period_end, unlimited, included, used, included_left, credits_left, credits_expire_at, left, bundles, currency, link_post_weight]
      properties:
        period: { type: string, description: The month the included posts count in, examples: ["2026-10"] }
        period_end: { type: string, description: When the included posts reset }
        unlimited: { type: boolean, description: No allowance applies (the Community Edition) }
        included: { type: integer, description: "Posts to X the plan includes per month (-1 = unlimited)", examples: [450] }
        used: { type: integer, description: "Posts counted this month (included, bought and any overage)" }
        included_left: { type: integer }
        credits_left: { type: integer, description: Bought posts not used yet }
        credits_expire_at: { type: [string, "null"], description: When the soonest bought posts expire }
        left: { type: integer, description: included_left + credits_left }
        bundles:
          type: array
          items:
            type: object
            required: [posts, price]
            properties:
              posts: { type: integer, examples: [1000] }
              price: { type: integer, description: In whole units of currency, examples: [40] }
        currency: { type: string, description: "ISO 4217 code of the bundle prices, lower case", examples: [eur] }
        link_post_weight: { type: integer, description: How many posts a post with a live link counts as, examples: [14] }
    BillingDetails:
      type: object
      required: [enabled, subscription, payment_methods, invoices, has_more_invoices, managed_payments]
      properties:
        enabled: { type: boolean, description: Billing is configured on this instance }
        subscription:
          oneOf:
            - { $ref: "#/components/schemas/BillingSubscription" }
            - { type: "null" }
        payment_methods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }
        invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
        has_more_invoices: { type: boolean, description: Older invoices exist; pass the last id as starting_after }
        managed_payments: { type: boolean, description: "Checkouts on this server use Stripe Managed Payments: Stripe, through Link, is the merchant of record and sends the receipts and invoices" }
    BillingSubscription:
      type: object
      required: [status, current_period_start, current_period_end, cancel_at_period_end, cancel_at, canceled_at, trial_end, amount, currency, interval, quantity, discount]
      properties:
        status: { type: string, description: "Stripe's status: active, trialing, past_due, canceled, unpaid, incomplete, ...", examples: [active] }
        current_period_start: { type: [string, "null"], description: Start of the billing period }
        current_period_end: { type: [string, "null"], description: End of the billing period (the next renewal) }
        cancel_at_period_end: { type: boolean, description: The subscription ends at the end of this period }
        cancel_at: { type: [string, "null"] }
        canceled_at: { type: [string, "null"] }
        trial_end: { type: [string, "null"] }
        amount: { type: integer, description: Price per seat (user) per interval in the smallest currency unit (cents), examples: [2900] }
        currency: { type: string, examples: [usd] }
        interval: { type: string, examples: [month] }
        quantity: { type: integer, description: "Seats billed: the workspace's members (the server keeps Stripe's quantity in step)", examples: [3] }
        discount:
          description: The subscription's discount while it lasts; no other promotion code is taken meanwhile
          oneOf:
            - type: "null"
            - type: object
              required: [code, end]
              properties:
                code: { type: string, description: The promotion code behind it (empty when it was set on a coupon in Stripe), examples: [SPRING20] }
                end: { type: [string, "null"], description: When it ends (null = never) }
    PaymentMethod:
      type: object
      required: [brand, last4, exp_month, exp_year, default]
      properties:
        brand: { type: string, examples: [visa] }
        last4: { type: string, examples: ["4242"] }
        exp_month: { type: integer, examples: [12] }
        exp_year: { type: integer, examples: [2030] }
        default: { type: boolean, description: The card the subscription is charged to }
    Invoice:
      type: object
      required: [id, number, created, period_start, period_end, total, amount_paid, amount_due, currency, status, hosted_invoice_url, invoice_pdf]
      properties:
        id: { type: string, examples: [in_1Q2w3E4r5T6y7U8i] }
        number: { type: string, examples: [A1B2C3D4-0001] }
        created: { type: string }
        period_start: { type: [string, "null"] }
        period_end: { type: [string, "null"] }
        total: { type: integer, description: Smallest currency unit (cents) }
        amount_paid: { type: integer }
        amount_due: { type: integer }
        currency: { type: string, examples: [usd] }
        status: { type: string, description: "paid, open, void or uncollectible", examples: [paid] }
        hosted_invoice_url: { type: string, description: Stripe's page for the invoice (pay or download) }
        invoice_pdf: { type: string, description: The invoice as a PDF }
    BillingURL:
      type: object
      required: [url]
      properties:
        url: { type: string, examples: ["https://checkout.stripe.com/c/pay/cs_test_a1b2c3"] }
    PromotionCode:
      type: object
      required: [code, plans]
      properties:
        code: { type: string, examples: ["SPRING20"] }
        percent_off: { type: number, description: "Percent taken off; absent for an amount off." }
        amount_off: { type: integer, description: "Amount taken off per invoice, in cents of `currency`; absent for a percent off." }
        currency: { type: string, examples: ["eur"] }
        duration: { type: string, enum: [once, repeating, forever], description: "How long the discount lasts." }
        duration_in_months: { type: integer, description: "Months the discount lasts when `duration` is `repeating`." }
        plans:
          type: array
          items: { type: string }
          description: Ids of the plans the code applies to.
          examples: [["plus", "pro"]]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { type: string, description: Same as the X-Request-Id response header }
        trace_id: { type: string, description: "W3C trace id from the request's traceparent header, when one was sent (for correlating with logs)" }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code; new codes may be added.
          examples: [bad_request, unauthorized, invalid_link, forbidden, csrf_failed, not_found, conflict, not_available, idempotency_in_progress, post_changed, already_free, sign_in_with_account, gone, link_used, link_expired, plan_limit_exceeded, plan_expired, payment_required, x_posts_exhausted, too_large, unsupported_media_type, validation_failed, not_editable, idempotency_mismatch, rate_limited, payment_provider_error, ai_provider_error, ai_key_rejected, timeout, busy, internal, default_group]
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        details: { type: object, additionalProperties: true, description: "plan_limit_exceeded: limit, max, used, plan" }

    Scope:
      type: string
      description: |
        Writing and publishing are separate: `posts:write` creates and edits, `posts:publish`
        schedules, publishes, cancels, retries a target or reports a custom target's result.
        Deleting needs its own scope: `posts:delete` deletes posts and media, `collections:delete`
        deletes collections; the `:write` scopes never imply them. `channels:manage` and
        `alerts:manage` hold credentials. Purging stays `admin`. Dashboard sessions and the Community Edition's access token hold every scope.
      enum: ["collections:read", "collections:write", "collections:delete", "posts:read", "posts:write", "posts:delete", "posts:publish", "channels:read", "channels:manage", "schedules:manage", "media:read", "media:write", "webhooks:manage", "alerts:manage", "events:read", admin]

    Plan:
      type: object
      required: [id, name, price_month, price_year, currency, highlight, limits, features]
      properties:
        id: { type: string, description: "starter, plus, pro or business; unlocked (Community Edition)", examples: [plus] }
        name: { type: string }
        price_month: { type: integer, description: "Price per user (each workspace member is a seat) per month billed monthly, in whole units of currency (euros)", examples: [29] }
        price_year: { type: integer, description: "Price per user per year billed yearly: twelve whole months at 20 % off or a little more (rounded down)", examples: [276] }
        currency: { type: string, description: "ISO 4217 code, lower case", examples: [eur] }
        highlight: { type: boolean, description: The plan the picker suggests }
        limits: { $ref: "#/components/schemas/PlanLimits" }
        features: { type: array, items: { type: string } }
        entitlements:
          type: array
          items: { type: string }
          description: "A workspace's plan only: the Stripe features its subscription grants (lookup keys), e.g. channels_extra_10, ai_pack"
        base_limits: { $ref: "#/components/schemas/PlanLimits", description: "The plan's own limits, when entitlements changed limits" }
        limit_bonuses:
          type: array
          description: What each entitlement added to a limit
          items:
            type: object
            required: [limit, add, unlimited, from]
            properties:
              limit: { type: string, examples: [channels] }
              add: { type: integer, description: "Added to the limit (bytes for storage_bytes and max_upload_bytes)", examples: [10] }
              unlimited: { type: boolean, description: "The entitlement lifts the limit (or switches data_export on)" }
              from: { type: string, description: "The feature's name", examples: [Channels pack] }

    PlanLimits:
      type: object
      required: [posts_per_month, channels, alerts, webhooks, api_keys, storage_bytes, max_upload_bytes, data_export, x_posts_per_period]
      properties:
        posts_per_month: { type: integer, description: "Posts created per calendar month (people, agents and schedules); -1 = unlimited" }
        channels: { type: integer, description: "Connected channels; -1 = unlimited" }
        alerts: { type: integer }
        webhooks: { type: integer }
        api_keys: { type: integer }
        storage_bytes: { type: integer }
        max_upload_bytes: { type: integer }
        data_export: { type: boolean, description: "Full workspace exports with media files (backups) and event exports; false on Starter, where the workspace export is data only" }
        x_posts_per_period: { type: integer, description: "Posts to X included per month (each post and thread reply; a post with a live link counts 14). Bought credits come on top. -1 = unlimited", examples: [450] }

    Addon:
      type: object
      required: [id, name, description, features, price_month, price_year, currency, active]
      properties:
        id: { type: string, examples: [channels_pack] }
        name: { type: string, examples: [Channels pack] }
        description: { type: string }
        features: { type: array, items: { type: string } }
        price_month: { type: integer, description: "Per workspace per month, whole units of currency; 0 = not sold monthly", examples: [9] }
        price_year: { type: integer, description: "Per workspace per year; 0 = not sold yearly" }
        currency: { type: string, examples: [eur] }
        active: { type: boolean, description: On the workspace's subscription now }

    Role:
      type: string
      enum: [owner, admin, editor, viewer]
      description: "viewer: read; editor: write, schedule and publish; admin: everything in the workspace; owner: admin who may also manage owners"
    User:
      type: object
      required: [id, name, email, avatar_url]
      properties:
        id: { type: string }
        name: { type: string, description: "The person's name (from Google or set by them); in the Community Edition the computer's user name" }
        email: { type: string }
        avatar_url: { type: string }
    EmailCodeSent:
      type: object
      required: [resend_in, expires_in]
      properties:
        resend_in: { type: integer, description: Seconds until another code may be asked for }
        expires_in: { type: integer, description: Seconds the code works }
    SignInMethod:
      type: object
      required: [provider, subject, email, name, created_at, last_login_at]
      properties:
        provider: { type: string, enum: [google, email, passkey] }
        subject: { type: string, description: "Google's account id, the email address, or the passkey's id" }
        email: { type: string, description: "The address (empty for a passkey)" }
        name: { type: string, description: "A passkey's name (empty for the others)" }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time, description: "Last sign-in (a passkey: last used)" }
    PasskeyChallenge:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id: { type: string, description: Send it back with the browser's answer }
        options: { type: object, description: "WebAuthn options (PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON)" }
    SignInMethodList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SignInMethod" } }
    MyWorkspace:
      type: object
      required: [id, name, role, current]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        current: { type: boolean }
    Member:
      type: object
      required: [user_id, name, email, avatar_url, role, you, created_at]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string }
        avatar_url: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        you: { type: boolean }
        created_at: { type: string }
    Invitation:
      type: object
      required: [id, email, role, invited_by, created_at, expires_at, expired]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
        expired: { type: boolean }
        link: { type: string, description: Only in the response that created or re-sent it }
        emailed: { type: boolean, description: Whether the server emailed the link }
    InvitationPreview:
      type: object
      required: [workspace, email, role, invited_by, status, expires_at]
      properties:
        workspace: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { type: string }
        status: { type: string, enum: [open, expired, accepted, revoked] }
        expires_at: { type: string }

    Workspace:
      type: object
      required: [id, name, plan, recovery_rotated_at, created_at, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string, description: "starter, plus, pro or business (cloud; an operator may also set a plan of their own), unlocked (Community Edition)", examples: [plus] }
        recovery_rotated_at: { type: string }
        created_at: { type: string }
        timezone:
          type: string
          description: "IANA time zone name (default UTC; the Community Edition starts in the machine's zone). Post repeats keep their local time of day in it across DST, and a schedule rule sent without `tz` runs in it."
          examples: [Europe/Warsaw]

    APIKey:
      type: object
      required: [id, name, prefix, scopes, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created_at: { type: string }
        last_used_at: { type: [string, "null"] }
        expires_at: { type: [string, "null"] }
        revoked_at: { type: [string, "null"] }
        key: { type: string, description: Raw secret; only in create/rotate responses }

    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string }
        user_agent: { type: string }
        created_at: { type: string }
        last_seen_at: { type: string }
        expires_at: { type: string }
        current: { type: boolean }

    Collection:
      type: object
      required: [id, name, description, icon, color, processing_timeout_seconds, is_default, archived, archived_at, created_at, updated_at, post_count, status_counts]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        processing_timeout_seconds:
          type: [integer, "null"]
          description: "How long a target on your own automation may wait for a result before it fails, in seconds (60 to 86400); null = the server's PROCESSING_TIMEOUT (see defaults.processing_timeout_seconds on GET /session)."
        is_default:
          type: boolean
          description: The workspace's Default collection. Every workspace has exactly one; it can be renamed but not archived or deleted (409).
        archived: { type: boolean }
        archived_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
        post_count: { type: integer }
        status_counts: { type: object, additionalProperties: { type: integer }, description: Posts by status }

    CollectionInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        processing_timeout_seconds: { type: [integer, "null"], minimum: 60, maximum: 86400, description: "How long targets on your own automation may wait for a result before they fail; null goes back to the server's PROCESSING_TIMEOUT." }
        archived: { type: boolean }

    Media:
      type: object
      description: An uploaded file
      required: [id, mime_type, size_bytes, original_name, url, sha256, created_at, alt_text, width, height, duration_ms, folder_id, tags]
      properties:
        id: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        original_name: { type: string }
        url: { type: string, description: Absolute URL (PUBLIC_API_URL); requires authentication }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
        alt_text: { type: string, description: "Describes a picture for people who can't see it; platforms that take alt text receive it" }
        width: { type: integer, description: "Pixels; measured on upload for pictures, reported by the uploading browser for videos; 0 when unknown" }
        height: { type: integer, description: Pixels; 0 when unknown }
        duration_ms: { type: integer, description: "A video's or audio file's length in milliseconds; 0 when unknown" }
        folder_id: { type: string, description: "The library folder the file sits in; empty for the top level" }
        tags: { type: array, items: { type: string } }
        deleted_at: { type: string, format: date-time, description: "Set while the file is in Deleted" }
        purge_at: { type: string, format: date-time, description: "When a file in Deleted is deleted for good" }
        duplicate_of: { type: string, description: "The oldest other file with the same content, if any" }

    MediaLibraryItem:
      type: object
      description: A file in the media library, with how many posts use it
      required: [id, mime_type, size_bytes, original_name, url, sha256, created_at, alt_text, width, height, duration_ms, folder_id, tags, uses]
      properties:
        id: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        original_name: { type: string }
        url: { type: string, description: Absolute URL (PUBLIC_API_URL); requires authentication }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
        alt_text: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer }
        folder_id: { type: string }
        tags: { type: array, items: { type: string } }
        deleted_at: { type: string, format: date-time, description: "Set while the file is in Deleted" }
        purge_at: { type: string, format: date-time, description: "When a file in Deleted is deleted for good" }
        duplicate_of: { type: string, description: "The oldest other file with the same content, if any" }
        uses: { type: integer, description: Posts that carry the file in their files or in a comment }

    MediaProject:
      type: object
      description: An editable picture of the media editor (its .gpex project file is at /v1/media-projects/{id}/file)
      required: [id, name, source_ids, output_id, size_bytes, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        source_ids: { type: array, items: { type: string }, description: The library files it was made from }
        output_id: { type: string, description: "The file it last saved; empty until saved" }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaProjectUpload:
      type: object
      required: [file]
      description: Send the fields before the file
      properties:
        name: { type: string, maxLength: 200 }
        source_ids: { type: string, description: Comma-separated media ids }
        output_id: { type: string }
        file: { type: string, format: binary, description: The .gpex project file }
    AIStatus:
      type: object
      required: [configured, provider, model, key_hint, capabilities, reason, models, can_manage]
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [openai] }
        model: { type: string }
        key_hint: { type: string, description: "The key's last four characters, e.g. ...a1b2" }
        capabilities:
          type: object
          required: [generate, edit, inpaint, expand]
          properties:
            generate: { type: boolean }
            edit: { type: boolean }
            inpaint: { type: boolean, description: Change only a marked area }
            expand: { type: boolean, description: Fill new space around a picture }
        reason: { type: string, description: "Why AI is off or limited, in plain words; empty when everything works" }
        models: { type: array, items: { type: string } }
        can_manage: { type: boolean, description: The caller may set or remove the key (admin) }
        updated_at: { type: string, format: date-time }
    ImageRules:
      type: object
      description: "What a platform refuses in a picture (its API's documented limits); recommended shapes are not rules"
      properties:
        max_bytes: { type: integer }
        formats: { type: array, items: { type: string }, description: MIME types it takes; empty = any picture }
        min_ratio: { type: number, description: width / height }
        max_ratio: { type: number }
        min_width: { type: integer }
        max_pixels: { type: integer }
        note: { type: string }
    MediaFolder:
      type: object
      description: A virtual folder of the media library
      required: [id, parent_id, name, files, created_at]
      properties:
        id: { type: string }
        parent_id: { type: string, description: The folder it sits in; empty at the top level }
        name: { type: string }
        files: { type: integer, description: Files directly in this folder (not in its subfolders) }
        created_at: { type: string, format: date-time }

    MediaFolders:
      type: object
      required: [data, root_files, total_files, tags, deleted_files, duplicate_files]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/MediaFolder" } }
        root_files: { type: integer, description: Files at the top level }
        total_files: { type: integer, description: Files in the library (not in Deleted) }
        deleted_files: { type: integer, description: Files in Deleted }
        duplicate_files: { type: integer, description: Files with at least one identical twin }
        tags:
          type: array
          description: Every tag on files, most used first
          items:
            type: object
            required: [tag, files]
            properties:
              tag: { type: string }
              files: { type: integer }

    MediaPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/MediaLibraryItem" } }
        next_offset: { type: integer, description: Where the next page starts; absent on the last page }

    MediaUse:
      type: object
      required: [post_id, collection_id, title, status]
      properties:
        post_id: { type: string }
        collection_id: { type: string }
        title: { type: string, description: "The post's first line, shortened" }
        status: { $ref: "#/components/schemas/PostStatus" }
        publish_at: { type: string, format: date-time }

    PostStatus:
      type: string
      description: "draft (being written), scheduled (goes out at publish_at), publishing (a job is at work), published (every target is), failed (a target is; retry it or edit and publish again)"
      enum: [draft, scheduled, publishing, published, failed]

    TargetStatus:
      type: string
      enum: [pending, publishing, published, failed]

    PostTarget:
      type: object
      description: One channel a post goes to, with the result of publishing there
      required: [channel_id, channel_name, provider, avatar_url, content, settings, status, external_id, external_url, error, attempts, published_at, replies]
      properties:
        channel_id: { type: string }
        channel_name: { type: string }
        provider: { type: string, description: The channel's provider id }
        avatar_url: { type: string }
        content: { type: [string, "null"], description: "Text for this channel instead of the post's content; null uses the post's" }
        settings: { type: object, additionalProperties: { type: string }, description: "The provider's settings_fields by key (title, subreddit, visibility...)" }
        status: { $ref: "#/components/schemas/TargetStatus" }
        external_id: { type: string, description: "The platform's id of the published post" }
        external_url: { type: string, description: "Where the post lives on the platform" }
        error: { type: string }
        attempts: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        replies: { type: array, items: { $ref: "#/components/schemas/Reply" }, description: "How each thread part went on this channel, one per part" }

    Reply:
      type: object
      description: One thread part on one channel
      required: [index, status, external_id, external_url, error, published_at]
      properties:
        index: { type: integer, description: The thread part (0 is the first reply) }
        status:
          type: string
          enum: [pending, publishing, published, failed, skipped]
          description: "skipped: the platform takes no replies (your own automation gets the thread with the request instead), or an earlier part failed"
        external_id: { type: string }
        external_url: { type: string }
        error: { type: string }
        published_at: { type: [string, "null"], format: date-time }

    ThreadPart:
      type: object
      description: >-
        A follow-up part ("comment") published as a reply under the post, delay_seconds after the part before it
        (the first after the post). Needs content or media.
      properties:
        content: { type: string, maxLength: 50000 }
        media: { type: array, maxItems: 20, items: { type: string }, description: Media ids }
        delay_seconds: { type: integer, minimum: 0, maximum: 86400 }

    ThreadPartOut:
      type: object
      description: A thread part as the API returns it, with its media resolved
      required: [content, media, delay_seconds, media_items]
      properties:
        content: { type: string }
        media: { type: array, items: { type: string } }
        delay_seconds: { type: integer }
        media_items: { type: array, items: { $ref: "#/components/schemas/Media" } }

    PostTargetInput:
      type: object
      required: [channel_id]
      properties:
        channel_id: { type: string }
        content: { type: [string, "null"], description: "Text for this channel instead of the post's content" }
        settings: { type: object, additionalProperties: { type: string } }

    Post:
      type: object
      required: [id, collection_id, collection_name, content, media, media_items, status, publish_at, published_at, tags, metadata, source, external_ref, repeat_every, thread, version, targets, created_at, updated_at, created_by, open_comments]
      properties:
        id: { type: string }
        collection_id: { type: string }
        collection_name: { type: string }
        content: { type: string }
        media: { type: array, items: { type: string }, description: "Media ids, in order" }
        media_items: { type: array, items: { $ref: "#/components/schemas/Media" }, description: "The same media, resolved" }
        status: { $ref: "#/components/schemas/PostStatus" }
        publish_at: { type: [string, "null"], format: date-time, description: "When it goes out (scheduled), or the time it kept as a note (draft after cancel)" }
        published_at: { type: [string, "null"], format: date-time }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true, description: Free JSON for your own use }
        source: { type: string, description: "Who created it: a client name, an agent, a schedule" }
        external_ref: { type: string, description: Your own reference }
        repeat_every: { $ref: "#/components/schemas/RepeatEvery" }
        thread: { type: array, items: { $ref: "#/components/schemas/ThreadPartOut" }, description: "Replies published under the post after it, in order" }
        version: { type: integer, description: Grows with every edit; see PostPatch.expected_version }
        targets: { type: array, items: { $ref: "#/components/schemas/PostTarget" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, description: "Who created the post: a person, or the API key (agent, automation) that did; empty when unknown" }
        open_comments: { type: integer, description: "Reviewers' comment threads not resolved yet" }

    RepeatEvery:
      type: string
      enum: ["", 1d, 2d, 3d, 4d, 5d, 6d, 1w, 2w, 1mo]
      description: >-
        Repeat the post: once it is published, staqly schedules a copy this long after its publish time
        (every 1 to 6 days, every 1 or 2 weeks, every month); the copy repeats too. Empty: no repeat. To stop,
        clear repeat_every on the next scheduled copy, or delete it.
    PostInput:
      type: object
      properties:
        collection: { type: string, description: Collection id or exact name }
        content: { type: string, maxLength: 50000 }
        media: { type: array, maxItems: 20, items: { type: string }, description: Media ids from POST /v1/media }
        targets: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/PostTargetInput" } }
        publish_at: { type: [string, "null"], format: date-time, description: "In the future, at most a year ahead" }
        status: { type: string, enum: [draft, scheduled], description: "Default draft; scheduled needs publish_at and a target" }
        publish_now: { type: boolean, description: Publish right away (needs a target) }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        metadata: { type: object, additionalProperties: true }
        source: { type: string, maxLength: 100 }
        external_ref: { type: string, maxLength: 200 }
        repeat_every: { $ref: "#/components/schemas/RepeatEvery" }
        thread: { type: array, maxItems: 25, items: { $ref: "#/components/schemas/ThreadPart" }, description: "Follow-up parts published as replies (platforms that take replies; your own automation gets them with the request)" }

    PostPatch:
      type: object
      description: Fields left out stay as they are
      properties:
        collection: { type: string, description: Move the post to another collection (id or exact name) }
        content: { type: string, maxLength: 50000 }
        media: { type: array, maxItems: 20, items: { type: string } }
        targets: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/PostTargetInput" }, description: Replaces the whole list }
        publish_at: { type: [string, "null"], format: date-time, description: "A time in the future, or null to clear it (a scheduled post becomes a draft)" }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        metadata: { type: object, additionalProperties: true }
        external_ref: { type: string, maxLength: 200 }
        repeat_every:
          description: A repeat choice, or "" / null to stop repeating
          oneOf: [{ $ref: "#/components/schemas/RepeatEvery" }, { type: "null" }]
        thread: { type: array, maxItems: 25, items: { $ref: "#/components/schemas/ThreadPart" }, description: "Replaces the thread; [] clears it" }
        expected_version: { type: integer, description: "The version the edit is based on; 409 post_changed when the post moved on" }

    PostPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Post" } }
        next_cursor: { type: string }

    Metrics:
      type: object
      description: A post's numbers on one platform; a missing field is a number the platform does not give
      properties:
        impressions: { type: integer, minimum: 0 }
        likes: { type: integer, minimum: 0 }
        reposts: { type: integer, minimum: 0 }
        replies: { type: integer, minimum: 0 }
        quotes: { type: integer, minimum: 0 }
        bookmarks: { type: integer, minimum: 0 }
        link_clicks: { type: integer, minimum: 0 }
    TargetMetrics:
      type: object
      required: [channel_id, channel_name, provider, status, external_url, available, metrics, updated_at]
      properties:
        channel_id: { type: string }
        channel_name: { type: string }
        provider: { type: string }
        status: { type: string }
        external_url: { type: string }
        available: { type: boolean, description: The platform reports numbers (or your automation sends them) }
        metrics: { oneOf: [{ $ref: "#/components/schemas/Metrics" }, { type: "null" }] }
        updated_at: { type: [string, "null"], format: date-time }
        error: { type: string, description: Why the last read failed }
    PreviewLink:
      type: object
      required: [id, post_id, created_at, expires_at, revoked_at, active]
      properties:
        id: { type: string }
        post_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        active: { type: boolean }
        url: { type: string, description: Only when created }
        token: { type: string, description: Only when created }
    ChannelLink:
      type: object
      required: [id, note, providers, group_id, max_uses, uses, status, created_by, created_at, expires_at]
      properties:
        id: { type: string }
        note: { type: string }
        providers: { type: array, items: { type: string }, description: Empty offers every available platform }
        group_id: { type: string, description: The channel group connected channels join (empty is Default) }
        max_uses: { type: integer }
        uses: { type: integer }
        status: { type: string, enum: [open, used, expired, revoked] }
        created_by: { type: string, description: Who made the link }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        url: { type: string, description: Only when created }
        token: { type: string, description: Only when created }
    ChannelLinkPublic:
      type: object
      required: [workspace, note, providers, expires_at, uses_left]
      properties:
        workspace: { type: string, description: The workspace's name }
        note: { type: string }
        providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        expires_at: { type: string, format: date-time }
        uses_left: { type: integer }
    PostComment:
      type: object
      description: >-
        One comment of a feedback thread. A thread starts with a comment whose parent_id is empty; it may mark a
        passage of the post (quote, in part `part` of channel `channel_id`'s version). Replies carry the thread's
        first comment as parent_id.
      required: [id, post_id, parent_id, author_name, author_kind, body, quote, channel_id, part, anchor_start, anchor_end, text_changed, resolved_at, resolved_by, created_at]
      properties:
        id: { type: string }
        post_id: { type: string }
        parent_id: { type: string, description: "The thread's first comment; empty for that first comment" }
        author_name: { type: string }
        author_email: { type: string, description: Only for the team }
        author_kind: { type: string, enum: [reviewer, team], description: "reviewer: left on a preview page; team: a person of the workspace, an API key or an agent" }
        body: { type: string }
        quote: { type: string, description: The marked words (empty for a general comment and for replies) }
        channel_id: { type: string, description: "The channel's version the passage is in; empty: the shared text" }
        part: { type: integer, description: "0: the post's text; n: the n-th comment of its thread" }
        anchor_start: { type: integer, description: "Where the passage starts in that text now, in UTF-16 code units (as browsers count); -1 when there is none" }
        anchor_end: { type: integer, description: "Where it ends (exclusive); -1 when there is none" }
        text_changed: { type: boolean, description: The marked words are no longer in the text; quote keeps them }
        resolved_at: { type: [string, "null"], format: date-time, description: When the thread was resolved (first comments only) }
        resolved_by: { type: string, description: Who resolved it }
        created_at: { type: string, format: date-time }
    PreviewMedia:
      type: object
      required: [id, mime_type]
      properties:
        id: { type: string }
        mime_type: { type: string }
    PublicPreview:
      type: object
      required: [workspace, content, status, publish_at, published_at, media, thread, targets, comments, expires_at]
      properties:
        workspace: { type: string }
        content: { type: string }
        status: { type: string }
        publish_at: { type: [string, "null"], format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        media: { type: array, items: { $ref: "#/components/schemas/PreviewMedia" } }
        thread:
          type: array
          items:
            type: object
            required: [content, media, delay_seconds]
            properties:
              content: { type: string }
              media: { type: array, items: { $ref: "#/components/schemas/PreviewMedia" } }
              delay_seconds: { type: integer }
        targets:
          type: array
          items:
            type: object
            required: [channel_id, channel_name, handle, avatar_url, provider, provider_name, content, status, external_url, published_at]
            properties:
              channel_id: { type: string }
              channel_name: { type: string }
              handle: { type: string }
              avatar_url: { type: string }
              provider: { type: string }
              provider_name: { type: string }
              content: { type: string, description: The text this channel gets }
              status: { type: string }
              external_url: { type: string }
              published_at: { type: [string, "null"], format: date-time }
        comments: { type: array, items: { $ref: "#/components/schemas/PostComment" } }
        expires_at: { type: [string, "null"], format: date-time }
    PostPreview:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items:
            type: object
            required: [channel_id, text, links, links_found, warnings, ok]
            properties:
              channel_id: { type: string }
              text: { type: string, description: "The text this target will carry: its own version if it has one, with the channel's links mode applied" }
              links: { $ref: "#/components/schemas/LinksMode" }
              links_found: { type: array, items: { type: string }, description: "The links the channel's links mode removes or defangs, as written (empty with keep)" }
              warnings: { type: array, items: { type: string }, description: "What the provider objects to (too long, media missing...) and, when links_found is not empty, what happens to them (\"Links will be removed from: Brand on X (https://example.com)\")" }
              ok: { type: boolean }

    Tag:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer, description: How many posts carry it }

    WorkItem:
      type: object
      description: Something the workspace asks your automation for
      required: [kind, collection, requested_at]
      properties:
        kind: { type: string, enum: [target, posts], description: "target: publish this post on your own automation and report the result; posts: a schedule found nothing to publish" }
        post: { $ref: "#/components/schemas/Post" }
        channel: { $ref: "#/components/schemas/Channel" }
        schedule: { $ref: "#/components/schemas/Schedule" }
        collection: { $ref: "#/components/schemas/Collection" }
        requested_at: { type: string, format: date-time }

    ChannelStatus:
      type: string
      description: "connected (works), needs_reconnect (the platform refused the credentials), disabled (turned off; targets on it fail without trying)"
      enum: [connected, needs_reconnect, disabled]

    Channel:
      type: object
      description: A connected account. Credentials are stored sealed and never returned.
      required: [id, provider, name, handle, avatar_url, profile_url, status, settings, links, group_id, last_error, comments, created_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string, description: Provider id (see GET /v1/providers) }
        name: { type: string }
        handle: { type: string, description: "The account's handle on the platform (@name, a channel id)" }
        avatar_url: { type: string }
        profile_url: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }
        settings: { type: object, additionalProperties: true, description: "Provider-level defaults for new targets, and `links` (one of the provider's limits.link_modes) to choose what the channel does with links" }
        links: { $ref: "#/components/schemas/LinksMode", description: "What this channel does with the links in a post's text: settings.links, else the provider's limits.links" }
        group_id: { type: string, description: "The channel group it belongs to (every channel is in exactly one; the Default group unless moved)" }
        last_error: { type: string }
        comments: { type: boolean, description: "A post's comments go out under it on this channel: its platform takes comments and this connection may post them (a LinkedIn connection needs the Community Management API). False: they are not sent here." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        activity: { $ref: "#/components/schemas/ChannelActivity" }

    ChannelActivity:
      type: object
      description: Read from the channel's targets. Only GET /v1/channels and GET /v1/channels/{id} include it (not webhook payloads).
      required: [last_published_at, last_post_id, next_publish_at, published_30d]
      properties:
        last_published_at: { type: [string, "null"], format: date-time, description: When a post last went out on this channel }
        last_post_id: { type: [string, "null"], description: That post }
        next_publish_at: { type: [string, "null"], format: date-time, description: When the next scheduled post goes out on this channel }
        published_30d: { type: integer, description: Posts published on this channel in the last 30 days }

    ChannelInput:
      type: object
      properties:
        provider: { type: string, description: "Provider id from GET /v1/providers (custom, telegram, bluesky, ...)" }
        name: { type: string, maxLength: 100, description: "What to call the channel; defaults to the account's name" }
        fields: { type: object, additionalProperties: { type: string }, description: "The provider's credential_fields by key (token platforms)", writeOnly: true }
        settings: { type: object, additionalProperties: true }
        group_id: { type: string, description: "Channel group to put it in (grp_...); default: the Default group" }

    ChannelPatch:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        settings: { type: object, additionalProperties: true, description: "Replaces the settings; `links` (keep, remove, defang; one of the provider's limits.link_modes) sets what the channel does with links" }
        status: { type: string, enum: [connected, disabled] }
        fields: { type: object, additionalProperties: { type: string }, description: "Token platforms: fresh credential fields to reconnect with", writeOnly: true }
        group_id: { type: string, description: "Moves the channel to this channel group (grp_...); empty moves it to Default" }

    ChannelGroup:
      type: object
      description: The one bucket a channel sits in (a group per client, say). The Default group always exists and can't be deleted.
      required: [id, name, color, position, default, channels, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, description: "#rrggbb, or empty" }
        position: { type: integer, description: Sort order (Default always leads) }
        default: { type: boolean }
        channels: { type: integer, description: Channels in the group (list only; 0 elsewhere) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChannelGroupInput:
      type: object
      properties:
        name: { type: string, maxLength: 60, description: Unique in the workspace (case-insensitive); required on create }
        color: { type: string, description: "#rrggbb, or empty" }
        position: { type: integer }

    DeveloperAppInput:
      type: object
      description: An OAuth client the workspace registered with a platform
      properties:
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true }

    ProviderField:
      type: object
      description: A form field a provider needs (a credential to connect, or a setting per target)
      required: [key, label, kind, required]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        kind:
          type: string
          enum: [text, secret, url, select, textarea, boolean, number, list, channels]
          description: "list: comma-separated free values (tags, usernames). channels: comma-separated ids of other connected channels of the same platform (for example the accounts that repost a post). Booleans are \"true\" / \"false\"."
        max_length: { type: integer, description: "At most this many characters (text, textarea, url)" }
        max_items: { type: integer, description: "At most this many values (list, channels)" }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        required: { type: boolean }
        default: { type: string }
        placeholder: { type: string }
        when:
          type: object
          description: "Show the field, and apply required, only while the field `key` holds `value` (the dashboard counts defaults; the API only what was sent)"
          required: [key, value]
          properties:
            key: { type: string }
            value: { type: string }

    ProviderLimits:
      type: object
      description: What the composer and the publish validation apply
      required: [max_chars, max_media, needs_title, needs_media, needs_link, links, link_modes]
      properties:
        max_chars: { type: integer, description: 0 = no limit }
        max_media: { type: integer, description: 0 = no media }
        media_kinds: { type: array, items: { type: string, enum: [image, video, gif, file] } }
        needs_title: { type: boolean, description: A title setting is required }
        needs_media: { type: boolean, description: Text alone is not a post }
        needs_link: { type: boolean, description: A link setting is required }
        links: { $ref: "#/components/schemas/LinksMode", description: "What a channel does with links unless its settings.links says otherwise" }
        link_modes: { type: array, items: { $ref: "#/components/schemas/LinksMode" }, description: "The links modes a channel on this platform may choose (X: remove, defang)" }
        image: { $ref: "#/components/schemas/ImageRules" }

    LinksMode:
      type: string
      enum: [keep, remove, defang]
      description: "What a channel does with the links in a post's text, at publish time (the post keeps its text): keep them, remove them, or defang them into readable, non-clickable text (https://example.com/a becomes example[.]com/a)"

    Provider:
      type: object
      description: A platform staqly can publish to
      required: [id, name, auth, status, limits, credential_fields, settings_fields, app_configured, docs_url]
      properties:
        id: { type: string, examples: [custom, telegram, bluesky, mastodon] }
        name: { type: string }
        auth: { type: string, enum: [oauth2, token, none] }
        status: { type: string, enum: [available, soon] }
        limits: { $ref: "#/components/schemas/ProviderLimits" }
        credential_fields: { type: array, items: { $ref: "#/components/schemas/ProviderField" }, description: What POST /v1/channels needs in `fields` (token platforms) }
        settings_fields: { type: array, items: { $ref: "#/components/schemas/ProviderField" }, description: Per-target settings a post may set }
        app_configured: { type: boolean, description: "OAuth platforms: a developer app is set (the workspace's or the server's)" }
        docs_url: { type: string, format: uri }

    ScheduleRule:
      type: object
      description: "When a recurring schedule runs: times (HH:MM) on weekdays in tz, or every N minutes"
      properties:
        times: { type: array, maxItems: 24, items: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }, examples: [["09:00", "17:30"]] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 = Sunday ... 6 = Saturday; empty = every day" }
        tz: { type: string, description: "IANA name; empty = the workspace's time zone", examples: [Europe/Warsaw] }
        every_minutes: { type: integer, minimum: 5, maximum: 10080 }

    Schedule:
      type: object
      required: [id, collection_id, collection_name, name, channels, channel_names, kind, run_at, rule, pick, post_ids, source, endpoint_url, enabled, next_run_at, last_run_at, last_result, created_at, updated_at]
      properties:
        id: { type: string }
        collection_id: { type: string }
        collection_name: { type: string }
        name: { type: string }
        channels: { type: array, items: { type: string }, description: Channel ids the chosen posts go to (a post's own targets win) }
        channel_names: { type: array, items: { type: string } }
        kind: { type: string, enum: [once, recurring] }
        run_at: { type: [string, "null"], format: date-time, description: once only }
        rule: { $ref: "#/components/schemas/ScheduleRule" }
        pick: { type: string, enum: [next, selected, all], description: "next: the oldest waiting draft; selected: post_ids; all: every waiting draft" }
        post_ids: { type: array, items: { type: string } }
        source: { type: string, enum: [none, agent, endpoint], description: "When nothing waits: do nothing, ask an agent (schedule.posts_requested, GET /v1/work) or fetch posts from endpoint_url" }
        endpoint_url: { type: string }
        endpoint_secret: { type: string, description: "source endpoint only: the HMAC key of X-Staqly-Signature (sha256=hex(HMAC_SHA256(secret, timestamp + '.' + body)), like a webhook). Shown in full only when staqly generated it, in that create or update response (send an empty endpoint_secret to generate one); a secret you chose is never echoed back; elsewhere masked as ****<last 4>." }
        enabled: { type: boolean }
        next_run_at: { type: [string, "null"], format: date-time }
        last_run_at: { type: [string, "null"], format: date-time }
        last_result: { type: string, description: "What the last run did, or why it failed" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScheduleInput:
      type: object
      properties:
        collection: { type: string, description: Collection id or exact name (create only) }
        name: { type: string, maxLength: 100 }
        channels: { type: array, maxItems: 50, items: { type: string } }
        kind: { type: string, enum: [once, recurring] }
        run_at: { type: string, format: date-time, description: "once: in the future" }
        rule: { $ref: "#/components/schemas/ScheduleRule" }
        pick: { type: string, enum: [next, selected, all] }
        post_ids: { type: array, maxItems: 200, items: { type: string } }
        source: { type: string, enum: [none, agent, endpoint] }
        endpoint_url: { type: string, format: uri }
        endpoint_secret: { type: string, description: "Signs the request like a webhook (X-Staqly-Signature); generated when empty, and returned in full once in this response" }
        enabled: { type: boolean }

    NotificationChoice:
      type: object
      required: [event, email, in_app]
      properties:
        event: { type: string, enum: [post.published, post.failed, post.feedback_added, channel.needs_reconnect, schedule.posts_requested, invitation.accepted] }
        email: { type: boolean }
        in_app: { type: boolean, description: Shown in the bell }
    NotificationPrefs:
      type: object
      required: [scope, events, email, mail_ready]
      properties:
        scope: { type: string, enum: [mine, all] }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationChoice" } }
        email: { type: string, description: Where the emails go (the address the person signs in with) }
        mail_ready: { type: boolean, description: The server can send email }
    Job:
      type: object
      description: One unit of background work
      required: [id, kind, key, status, run_at, attempts, max_attempts, lease_until, leased_by, last_error, payload, created_at, updated_at, done_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [publish_post, publish_target, target_timeout, run_schedule, refresh_channel, repeat_post, publish_reply, repost, notify_people, notify_person] }
        key: { type: string, description: "Unique per subject (publish_post:<post id>); queueing the same key again replaces a queued job, and runs a running one again when it ends" }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        run_at: { type: string, format: date-time }
        attempts: { type: integer }
        max_attempts: { type: integer }
        lease_until: { type: [string, "null"], format: date-time, deprecated: true, description: Always null (the queue no longer uses leases) }
        leased_by: { type: string, description: The worker that ran the last attempt }
        last_error: { type: string }
        payload:
          type: object
          properties:
            post_id: { type: string }
            channel_id: { type: string }
            schedule_id: { type: string }
            index: { type: integer, description: "publish_reply: the thread part" }
            parent_id: { type: string, description: "publish_reply: the platform id the reply goes under" }
            repost_by: { type: string, description: "repost: the channel that reposts" }
            event_id: { type: string, description: "notify_people, notify_person: the event to tell people about" }
            user_id: { type: string, description: "notify_person: who gets the email" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        done_at: { type: [string, "null"], format: date-time }

    JobPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: string }

    JobStats:
      type: object
      required: [queued, running, failed, done_24h, by_kind]
      properties:
        queued: { type: integer }
        running: { type: integer }
        failed: { type: integer }
        done_24h: { type: integer, description: Finished in the last 24 hours }
        by_kind:
          type: object
          additionalProperties:
            type: object
            required: [queued, running, failed]
            properties:
              queued: { type: integer }
              running: { type: integer }
              failed: { type: integer }

    Event:
      type: object
      required: [id, seq, type, collection_id, post_id, actor, data, created_at]
      properties:
        id: { type: string }
        seq: { type: integer }
        type: { type: string, examples: [post.created, post.scheduled, post.publish_requested, post.published, post.failed, channel.needs_reconnect, schedule.ran] }
        collection_id: { type: [string, "null"] }
        post_id: { type: [string, "null"] }
        channel_id: { type: [string, "null"], description: Channel events }
        schedule_id: { type: [string, "null"], description: Schedule events }
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [local, session, api_key, system] }
            id: { type: string }
            name: { type: string }
            agent: { type: string, description: "The MCP or REST client that acted (as listed by /v1/agents), when known" }
        data: { type: object, additionalProperties: true }
        created_at: { type: string }

    EventPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Event" } }
        next_cursor: { type: string }

    Webhook:
      type: object
      required: [id, url, description, secret, events, collection_ids, active, timeout_ms, max_attempts, created_at, updated_at]
      properties:
        id: { type: string }
        url: { type: string }
        description: { type: string }
        secret: { type: string, description: "HMAC key; X-Staqly-Signature = sha256=hex(HMAC_SHA256(secret, timestamp + '.' + body)). Shown in full only in the create response and after rotate_secret; elsewhere masked as whsec_****<last 4>." }
        events: { type: array, items: { type: string }, description: 'Exact names or globs: "*", "post.*"' }
        collection_ids: { type: array, items: { type: string }, description: Empty means all collections }
        active: { type: boolean }
        timeout_ms: { type: integer }
        max_attempts: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    WebhookInput:
      type: object
      properties:
        url: { type: string }
        description: { type: string }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, maxLength: 100 }
          description: '"*", a glob inside a known event family ("post.*", "channel.*", "schedule.*") or a known event type (post.created, post.scheduled, post.publish_requested, post.target_published, post.published, post.failed, channel.needs_reconnect, schedule.ran...). Unknown patterns are a 422.'
        collection_ids: { type: array, items: { type: string } }
        active: { type: boolean }
        timeout_ms: { type: integer, minimum: 1000, maximum: 60000 }
        max_attempts: { type: integer, minimum: 1, maximum: 20 }
        rotate_secret: { type: boolean }

    Delivery:
      type: object
      required: [id, webhook_id, event_id, event_type, status, attempts, next_attempt_at, last_status_code, last_error, last_response, last_attempt_at, delivered_at, created_at]
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempts: { type: integer }
        next_attempt_at: { type: [string, "null"] }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: string }
        last_response: { type: string, description: "First 2 KB of the receiver's response body (Community Edition only; always empty in cloud mode)" }
        last_attempt_at: { type: [string, "null"] }
        delivered_at: { type: [string, "null"] }
        created_at: { type: string }

    WorkspaceExport:
      type: object
      required: [id, status, size_bytes, created_at, started_at, finished_at, expires_at, includes_media]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, running, ready, failed, expired] }
        includes_media: { type: boolean, description: "false for a data-only export (Starter): no media/ files in the ZIP" }
        size_bytes: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        download_url: { type: string, description: "Relative URL, present when status is ready" }

    PurgeResult:
      type: object
      required: [post_id, events_deleted, media_deleted]
      properties:
        post_id: { type: string }
        events_deleted: { type: integer }
        media_deleted: { type: integer, description: Media files deleted because no other post used them }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, unavailable] }
            migrations: { type: string, description: "ok, unknown, or pending (applied < embedded)" }
            workers: { type: string, enum: [ok, not_started, stale, stopped] }

    AlertConfig:
      type: object
      additionalProperties: false
      description: >
        Type-specific delivery settings. Secret fields are write-only (returned masked, e.g. "••••abcd").
        telegram: bot_token*, chat_id*.
        slack: webhook_url* or bot_token*+channel*.
        discord: webhook_url* or bot_token*+channel*.
        ntfy: topic*, server_url (default https://ntfy.sh), access_token, priority.
        email: host*, port, username, password, from*, to*, tls (starttls|tls|none).
        On update, keys are merged into the stored config and `null` removes a key.
      properties:
        bot_token: { type: [string, "null"], writeOnly: true, description: Secret (Telegram/Slack/Discord bot token) }
        chat_id: { type: [string, "null"] }
        webhook_url: { type: [string, "null"], format: uri, description: Secret (Slack/Discord webhook URL) }
        channel: { type: [string, "null"], description: Slack channel ID or Discord channel ID (bot mode) }
        server_url: { type: [string, "null"], format: uri }
        topic: { type: [string, "null"] }
        access_token: { type: [string, "null"], description: Secret (ntfy token) }
        priority: { type: [integer, "null"], minimum: 1, maximum: 5 }
        host: { type: [string, "null"] }
        port: { type: [integer, "null"] }
        username: { type: [string, "null"] }
        password: { type: [string, "null"], description: Secret (SMTP password) }
        from: { type: [string, "null"] }
        to: { type: [array, "null"], items: { type: string, format: email } }
        tls: { type: [string, "null"], enum: [starttls, tls, none, null] }
    AlertInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        type: { type: string, enum: [telegram, slack, discord, ntfy, email], description: Required on create; immutable }
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/AlertConfig" }
        events:
          type: array
          items: { type: string }
          description: 'Event patterns (glob, "*"). Default ["post.published", "post.failed", "channel.needs_reconnect"].'
        collection_ids: { type: array, items: { type: string } }
        digest_window_seconds: { type: integer, minimum: 0, maximum: 86400, description: Batch events within this window into one message (0 = immediately) }
    Alert:
      type: object
      required: [id, name, type, enabled, config, events, collection_ids, digest_window_seconds, fail_count, last_error, disabled_reason, last_sent_at, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [telegram, slack, discord, ntfy, email] }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: Settings with secrets masked }
        events: { type: array, items: { type: string } }
        collection_ids: { type: array, items: { type: string } }
        digest_window_seconds: { type: integer }
        fail_count: { type: integer, description: Consecutive failed sends; the channel is disabled at NOTIFY_MAX_FAILS }
        last_error: { type: string }
        disabled_reason: { type: string }
        last_sent_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertDelivery:
      type: object
      required: [id, channel_id, event_id, event_type, post_id, status, attempts, next_attempt_at, last_error, sent_at, created_at]
      properties:
        id: { type: string }
        channel_id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        post_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, sent, failed, skipped] }
        attempts: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        sent_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

  headers:
    X-Request-Id:
      description: Request id (the caller's X-Request-Id if sent, else generated). Present on every response.
      schema: { type: string }
    Retry-After:
      description: Seconds until a retry may succeed (sent with 429, and with 503 `busy`).
      schema: { type: integer, minimum: 1 }
