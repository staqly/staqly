openapi: 3.2.1
info:
  title: staqly API
  version: 1.0.0
  license: { name: AGPL-3.0-only, identifier: AGPL-3.0-only }
  description: |
    Local-first workspace where people and AI agents write posts, schedule them and
    publish them to connected channels.

    **Staqly Community Edition** (local mode, the default, `STAQLY_MODE=local`; one workspace, no plans):
    every request needs the install's access token, `Authorization: Bearer
    stk_local_...`. It is made on first start, kept in `DATA_DIR/access_token`
    and printed at every start; `staqly serve token` (or `docker exec staqly
    server token`) prints it again, `--rotate` replaces it. A browser trades it
    for a session cookie with `POST /v1/sessions/api-key`.

    **Cloud mode** (`STAQLY_MODE=cloud`, hosted, many workspaces): anyone can
    create a workspace (unless SETUP_TOKEN restricts signup); it starts with a
    free 7-day Starter trial (Plus, Pro and Business are paid from the first day). Plans: Starter, Plus, Pro and Business,
    billed monthly or yearly (20 % off or more). When the trial or a paid period ends
    unpaid, the workspace is suspended: read-only, other changes return **402**
    `plan_expired` until a plan is paid for (`POST /v1/billing/checkout`).
    Every API key and session belongs to one workspace. Authenticate
    automations with `Authorization: Bearer {API_KEY}`. The dashboard uses an
    HttpOnly session cookie and must send `X-CSRF-Token` on unsafe requests.
    Plan limits are enforced per workspace; exceeding one returns **402**
    `plan_limit_exceeded` with `details`.

    Other devices (phones) join a workspace through one-time "connect a
    device" links (`/v1/device-links`), in both modes.

    Unsafe requests accept an `Idempotency-Key` header; repeating the same key
    with the same method, path, query string and body replays the original
    response for 24 hours. Responses that carry a secret (new API keys,
    recovery keys, device links, webhook signing secrets) and responses over
    1 MiB are never stored: repeating such a request runs it again.

    Any request may answer **503** `busy` with `Retry-After` when the
    database stays locked by another process for too long; retry it.

    A state that is already set cannot be set again: archiving an archived
    collection, enabling an enabled webhook or alert channel, revoking a
    revoked API key or session, reporting a result a target already has or
    choosing the plan the workspace is on answers **409** `conflict` (e.g.
    "collection is already archived") and changes nothing. A PATCH that
    changes other fields too is accepted; the unchanged state is ignored.
servers:
  # First: the docs' API playground sends requests from the browser, which only
  # cloud mode allows (CORS for docs.staqly.ai, Authorization: Bearer <API key>).
  - url: https://{host}
    description: Your staqly cloud instance (API key required)
    variables:
      host: { default: staqly.example.com, description: Host name of your cloud instance }
  - url: http://localhost:3333
    description: Local (staqly serve or Docker), the access token as bearer
security:
  - bearer: []    # cloud mode: API key; local mode: the access token
  - session: []   # dashboard session cookie (+ X-CSRF-Token on unsafe requests)
tags:
  - name: setup
    description: Instance status, signup and plans
  - name: auth
    description: Sessions, devices, API keys, the workspace, its plan and exports
  - name: accounts
    description: "Cloud accounts: sign-in with Google, workspaces, members, roles and invitations (docs: Accounts, workspaces and roles)"
  - name: collections
    description: Collections that group posts
  - name: posts
    description: Posts, their targets, scheduling and publishing
  - name: channels
    description: Connected accounts (channels) and the platform catalog
  - name: schedules
    description: Publishing schedules
  - name: jobs
    description: The background queue
  - name: media
    description: Uploaded files and thumbnails
  - name: events
    description: The workspace activity log
  - name: webhooks
    description: >
      Outgoing webhooks and their deliveries. Delivery is at-least-once and not ordered
      (deliveries run in parallel and retry): receivers deduplicate on the event `id`
      (`X-Staqly-Event-Id`) and order by its `created_at`; the body has no `seq`. See
      https://docs.staqly.ai/automation/webhooks#delivery-guarantees
  - name: alerts
    description: Alert channels (Telegram, Slack, Discord, ntfy, email)
  - name: billing
    description: Plan subscriptions through Stripe (cloud mode)
  - name: system
    description: Health, readiness and metrics

paths:
  /health:
    get:
      operationId: health
      tags: [setup]
      security: []
      summary: Liveness and database check
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [status, version], properties: { status: { type: string, const: ok }, version: { type: string } } } } } }
        "503": { description: The database is unreachable, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, const: unavailable } } } } } }

  /openapi.yaml:
    get:
      operationId: getOpenAPI
      tags: [setup]
      security: [{}]
      summary: This OpenAPI document
      responses:
        "200": { description: OpenAPI 3.2 YAML, content: { application/yaml: { schema: { type: string } } } }

  /v1/setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      summary: Whether the workspace has been created
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [initialized, mode, signup_open, setup_token_required, billing_enabled, public_api_url]
                properties:
                  initialized: { type: boolean, description: Community Edition only }
                  mode: { type: string, enum: [local, cloud] }
                  signup_open: { type: boolean, description: "Cloud: anyone may create a workspace" }
                  setup_token_required: { type: boolean }
                  billing_enabled: { type: boolean, description: "Cloud with Stripe configured: paid plans can be bought (Settings → Plan & usage)" }
                  google_sign_in: { type: boolean, description: "Cloud accounts: people sign in with Google (GET /v1/auth/google/start)" }
                  email_sign_in: { type: boolean, description: "Cloud accounts: people sign in with a code sent to their email address (POST /v1/auth/email/start)" }
                  legacy_sign_in: { type: boolean, description: "Cloud: the sign-in from before accounts (admin API key, recovery key, POST /v1/workspaces) works here" }
                  passkey_sign_in: { type: boolean, description: "Cloud accounts: people sign in with a passkey (POST /v1/auth/passkey/start); needs PUBLIC_DASHBOARD_URL" }
                  public_api_url: { type: string, description: "PUBLIC_API_URL: the API's base URL for agents and tools (shown in dashboard snippets)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspaces:
    get:
      operationId: listMyWorkspaces
      tags: [accounts]
      summary: Workspaces the caller can open, with their role
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/MyWorkspace" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createWorkspace
      tags: [setup]
      security: []
      summary: Create a cloud workspace (with billing it has no plan until a subscription starts; without billing the server-side trial)
      description: >-
        Without cloud accounts (AUTH_DEV_SIGNIN) only; with Google sign-in new people start at GET /v1/auth/google/start (409 here) and signed-in people add workspaces with POST /v1/account/workspaces. Cloud mode only; each call" creates a new isolated workspace. Rate-limited to 5 per hour per client IP (429). Requires `setup_token` when the server sets SETUP_TOKEN. Creates the workspace, an admin API key (scope `admin`, the credential that signs in to the dashboard; see POST /v1/sessions/api-key), a single-use recovery key and a browser session cookie. Secrets are returned only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, description: Workspace name (defaults to "My Workspace") }
                setup_token: { type: string, description: Required when the server sets SETUP_TOKEN }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [workspace, api_key, recovery_key, csrf_token]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  recovery_key: { type: string }
                  csrf_token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/plans:
    get:
      operationId: listPlans
      tags: [setup]
      security: [{}]
      summary: Cloud plans and their limits (-1 = unlimited)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/workspace/usage:
    get:
      operationId: getWorkspaceUsage
      tags: [auth]
      summary: Current plan and usage (the Community Edition reports the unlocked plan, named Community Edition)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [plan, period, usage, plan_expires_at, trial_ends_at, suspended, posts_by_status, webhook_deliveries]
                properties:
                  plan: { $ref: "#/components/schemas/Plan" }
                  period: { type: string, examples: ["2026-10"] }
                  usage:
                    type: object
                    required: [posts_per_month, channels, seats, alerts, webhooks, api_keys, storage_bytes, x_posts_per_period]
                    properties:
                      posts_per_month: { type: integer, description: Posts created this month }
                      channels: { type: integer, description: Connected channels }
                      seats: { type: integer, description: "Seats billed: the workspace members (each billed per user)" }
                      alerts: { type: integer }
                      webhooks: { type: integer }
                      api_keys: { type: integer }
                      storage_bytes: { type: integer }
                      x_posts_per_period: { type: integer, description: "Posts to X this month (a post with a live link counts 14)" }
                  plan_expires_at:
                    type: [string, "null"]
                    format: date-time
                    description: |
                      End of the free trial or paid period; null = no end. A Stripe-billed plan adds a 3-day payment grace
                      after its paid or trial period, so count a trial down to `trial_ends_at` instead.
                  trial_ends_at:
                    type: [string, "null"]
                    format: date-time
                    description: |
                      When the 7-day free trial ends: Stripe's `trial_end` for a Stripe trial, the end of the server-side
                      trial on a server without billing; null when the workspace is in no trial.
                  suspended:
                    type: boolean
                    description: |
                      The trial or paid period ended unpaid. The workspace is read-only:
                      reads and exports work, other changes answer 402 `plan_expired` until it is
                      a plan is paid for (`POST /v1/billing/checkout`).
                  posts_by_status:
                    type: object
                    description: Posts created this period, counted by their current status (statuses with no posts are left out).
                    additionalProperties: { type: integer }
                    examples: [{ draft: 2, scheduled: 2, published: 1 }]
                  webhook_deliveries:
                    type: object
                    description: Webhook deliveries right now. `failed` gave up after every retry and can be redelivered.
                    required: [queued, retrying, failed]
                    properties:
                      queued: { type: integer, description: Waiting for their first attempt }
                      retrying: { type: integer, description: "Failed at least once; another attempt is scheduled" }
                      failed: { type: integer, description: Gave up after every retry }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/billing:
    get:
      operationId: getBilling
      tags: [billing]
      summary: Subscription status (admin)
      description: |
        Whether billing is enabled on this instance (cloud mode with Stripe configured), the
        plan, Stripe's subscription status and the end of the trial or paid period.
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/billing/details:
    get:
      operationId: getBillingDetails
      tags: [billing]
      summary: Subscription period, cards on file and invoices (admin)
      description: |
        Read from Stripe on every request and never stored: the current subscription (status, billing period,
        cancellation, trial end, price), the cards on file (brand, last four digits, expiry) and the newest
        invoices, 24 per page. Without billing or before the first checkout the lists are empty.
      parameters:
        - name: starting_after
          in: query
          required: false
          description: The id of the last invoice of the previous page; the answer then lists only invoices
          schema: { type: string, examples: [in_1Q2w3E4r5T6y7U8i] }
      responses:
        "200":
          description: Billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Pay for a plan, or switch the subscription to another plan (a workspace owner)
      description: |
        Without a live subscription: returns a Stripe Checkout URL for the plan billed monthly or yearly;
        open it in a browser to pay. Prices are per seat (the members) and exclude VAT (Stripe Tax adds it from
        the billing address). Starter starts Stripe's 7-day trial with a card required (nothing is charged until
        it ends; cancelled if no card is on file then), once per workspace; Plus, Pro and Business are charged at
        once. Stripe redirects back to `<PUBLIC_DASHBOARD_URL>/settings/plan?checkout=success` (or the welcome
        steps with `return_to: welcome`), and the plan changes when Stripe's webhook arrives. With billing on, a
        new workspace has no plan (read-only, 402 `plan_expired` on writes) until a subscription starts.

        With a live subscription: switches it to the plan and interval (Stripe prorates the difference) and
        returns the dashboard's plan page URL (`/settings/plan`) with `?checkout=switched`; the plan changes when Stripe's
        `customer.subscription.updated` event arrives. 409 for the plan and interval it already has.

        Allowed while suspended. 409 `not_available` when billing is off or that price is not set up.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, enum: [starter, plus, pro, business], default: pro }
                interval: { type: string, enum: [month, year], default: month, description: "year: billed yearly, twelve whole months at 20 % off or more" }
                return_to: { type: string, enum: [welcome], description: "welcome: Stripe sends the person back to the dashboard's welcome steps instead of the plan page" }
                promotion_code: { type: string, maxLength: 100, description: "A promotion code made in Stripe, checked for the chosen plan (422 under promotion_code when unknown, used up or for another plan). Without a live subscription it goes on the Checkout session (whose own code box is then off); with one it goes on the subscription, also when the plan stays the same." }
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/x-posts:
    get:
      operationId: getXPosts
      tags: [billing]
      summary: Posts to X this period (posts:read)
      description: >-
        Posts to X are metered: each plan includes a number per month and bought bundles add more (used after the
        included ones, oldest first, expiring at the end of the billing period). A post or thread reply counts once
        when it is published (a post with a live link counts 14: X bills it at $0.20 against $0.015).
      responses:
        "200":
          description: This period's posts to X
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XPosts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/billing/credits/checkout:
    post:
      operationId: createCreditsCheckout
      tags: [billing]
      summary: Buy extra posts to X (a workspace owner)
      description: Returns a Stripe Checkout URL (one-time payment) for a bundle; the posts are added when Stripe reports the payment.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posts]
              properties:
                provider: { type: string, enum: [x], description: "Default x" }
                posts: { type: integer, enum: [200, 1000, 4000] }
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /v1/billing/addons:
    get:
      operationId: listAddons
      tags: [billing]
      summary: Add-ons on sale and which the workspace has (admin)
      description: Products sold on top of a plan (Stripe products with staqly_kind=addon). Their features raise limits or switch capabilities on; the workspace's plan shows the result. Empty without billing.
      responses:
        "200":
          description: Add-ons
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Addon" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/billing/addons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, examples: { pack: { value: channels_pack } } }
    post:
      operationId: addAddon
      tags: [billing]
      summary: Add an add-on to the subscription (a workspace owner)
      description: Adds it to the live subscription in the subscription's interval, charged at once for the rest of the period with the card on file. Its features apply when Stripe reports them (seconds).
      responses:
        "204": { description: Added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: removeAddon
      tags: [billing]
      summary: Remove an add-on (a workspace owner)
      description: Removes it from the subscription now; the unused rest of the period is credited on the next invoice.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/billing/portal:
    post:
      operationId: createPortalSession
      tags: [billing]
      summary: Open the Stripe customer portal (admin)
      description: Returns a portal URL to change the payment method, see invoices or cancel. 409 before the first checkout.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/promotion-code:
    post:
      operationId: checkPromotionCode
      tags: [billing]
      summary: Check a promotion code (admin)
      description: |
        Checks a promotion code made in Stripe (active, its coupon valid) and returns what it takes off and the
        plans it applies to, so a plan picker can show the discounted prices. 422 under `promotion_code` when
        the code is unknown, used up or fits no plan. Checkout checks the code again for the plan chosen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promotion_code]
              properties:
                promotion_code: { type: string, maxLength: 100, examples: ["SPRING20"] }
      responses:
        "200":
          description: The code's discount and plans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/sync:
    post:
      operationId: syncBilling
      tags: [billing]
      summary: Read the subscription from Stripe now (admin)
      description: |
        Asks Stripe for the workspace's subscription and applies it, as its webhook would, then
        answers like `GET /v1/billing`. The dashboard calls it when it comes back from Checkout, so a
        paid workspace opens even when the webhook is late or lost; a background job does the same
        every 10 minutes for workspaces whose plan may be out of date.
      responses:
        "200":
          description: Billing status after the sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook endpoint
      description: |
        Called by Stripe, not by clients. Verified with the `Stripe-Signature` header and
        `STRIPE_WEBHOOK_SECRET`; each event is applied once. Handles
        `checkout.session.completed` and `customer.subscription.*`.
      security: []
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/device-links:
    post:
      operationId: createDeviceLink
      tags: [auth]
      summary: Create a one-time "connect a device" link (QR code)
      description: Dashboard only (session or local principal). The token is in the URL fragment, valid for 5 minutes, single use.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, reachable]
                properties:
                  url: { type: string, examples: ["https://staqly.example.com/connect#abc..."] }
                  expires_at: { type: string, format: date-time }
                  reachable: { type: boolean, description: false when the URL points at localhost }
                  hint: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/device-links/redeem:
    post:
      operationId: redeemDeviceLink
      tags: [auth]
      security: [{}]
      summary: Exchange a device-link token for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "201": { description: Session cookie set, content: { application/json: { schema: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/recover:
    post:
      operationId: recoverSession
      tags: [auth]
      security: []
      summary: Recover access with the recovery key (lost API key)
      description: |
        The recovery key is single-use. In one transaction this sets a session
        cookie, creates a new admin API key (not counted against the plan's key
        limit), replaces the recovery key with a new one (the old one stops
        working) and signs out every other session of the workspace. On a plan
        with a key limit (Starter, Plus) the new admin key replaces the old admin keys,
        which are revoked; otherwise existing API keys keep working. The new API key and recovery key are returned only
        in this response. Rate-limited per client IP (429). Cloud only: the Community Edition (local mode) has no
        recovery key and no API keys (409); it signs in with its access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [recovery_key], properties: { recovery_key: { type: string } } }
      responses:
        "201":
          description: Session cookie set; the new admin key and the next recovery key, shown once
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token, api_key, recovery_key]
                properties:
                  csrf_token: { type: string }
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  recovery_key: { type: string, description: Replaces the recovery key that was just used }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`sign_in_with_account`: the workspace belongs to an account; people sign in with their sign-in methods", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/api-key:
    post:
      operationId: signInWithAPIKey
      tags: [auth]
      security: []
      summary: Sign in to the dashboard with an admin API key (or, in the Community Edition, the access token)
      description: |
        Community Edition: exchanges the access token (`stk_local_...`) for a browser
        session cookie; a wrong token gets 401. Cloud mode: exchanges an API key with the
        `admin` scope (the key sign-up or recovery returns) for a browser session
        cookie. Keys without `admin` (agent keys) get 403; unknown, revoked or
        expired keys get 401. The key goes in the body, not in Authorization.
        Other sessions stay signed in. Recorded as a `session.signed_in` event.
        Rate-limited per client IP (429).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [api_key], properties: { api_key: { type: string, description: "An admin key, stk_..." } } }
      responses:
        "201": { description: Session cookie set, content: { application/json: { schema: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      tags: [accounts]
      security: []
      summary: Start the sign-in with Google (browser redirect)
      description: Sets a short-lived sealed cookie (state, nonce, PKCE verifier) and redirects to Google. Errors redirect to /login?error=<code>.
      parameters:
        - { name: next, in: query, schema: { type: string }, description: A path on this dashboard to land on }
        - { name: invite, in: query, schema: { type: string }, description: An invitation token to accept after signing in }
        - { name: setup_token, in: query, schema: { type: string }, description: Lets a new person create an account when SETUP_TOKEN is set }
      responses:
        "302": { description: "Redirect to Google, or to /login?error=<code>" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/google/callback:
    get:
      operationId: googleSignInCallback
      tags: [accounts]
      security: []
      summary: Finish the sign-in with Google (browser redirect)
      description: Verifies state, nonce and the ID token, signs the person in (accepting an invitation, or creating their account and first workspace) with a new session cookie, and redirects to a dashboard path. Errors redirect to /login?error=<code>.
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect to the dashboard or to /login?error=<code>" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/email/start:
    post:
      operationId: startEmailSignIn
      tags: [accounts]
      security: []
      summary: Send a sign-in code to an email address
      description: |
        Mails a 6-digit code (valid 10 minutes, single use, 5 tries). The answer is the same whether or not
        the address has an account. A new code replaces the previous one. Limits: one code per address every
        30 seconds (429 `code_cooldown`, `details.resend_in`), 5 per address per hour, and a limit per client IP.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202": { description: Code sent, content: { application/json: { schema: { $ref: "#/components/schemas/EmailCodeSent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "The email could not be sent", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailSignIn
      tags: [accounts]
      security: []
      summary: Sign in with the emailed code
      description: |
        Signs the person in as the identity (email, address) with a new session cookie: a returning person
        lands in their workspace, an invitation (`invite`) is accepted, a new person gets an account and a first
        workspace (when sign-ups are open or with `setup_token`). Never merged with a Google identity of the same
        address. A wrong code answers 401 `code_invalid` with `details.attempts_left`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, description: "6 digits" }
                next: { type: string, description: A path on this dashboard to land on }
                invite: { type: string, description: An invitation token to accept }
                setup_token: { type: string, description: Lets a new person create an account when SETUP_TOKEN is set }
      responses:
        "201": { description: Session cookie set, content: { application/json: { schema: { type: object, required: [csrf_token, next], properties: { csrf_token: { type: string }, next: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "410": { description: "The code expired, was used, was replaced by a newer one or had too many wrong tries", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/auth/email/dev-code:
    get:
      operationId: getDevEmailCode
      tags: [accounts]
      security: []
      summary: The last code sent to an address (AUTH_DEV_SIGNIN only, for tests)
      description: 404 on every server without AUTH_DEV_SIGNIN=true.
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/passkey/start:
    post:
      operationId: startPasskeySignIn
      tags: [accounts]
      security: []
      summary: Start signing in with a passkey
      description: |
        Returns the options for `navigator.credentials.get` (WebAuthn JSON, binary fields base64url) with no
        address: the passkey names the person. The challenge works once, for 5 minutes.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyChallenge" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/passkey/finish:
    post:
      operationId: finishPasskeySignIn
      tags: [accounts]
      security: []
      summary: Sign in with the browser's passkey answer
      description: |
        Checks the assertion against the person's passkey and signs them in with a new session cookie. 401
        `passkey_invalid` when it does not check out, `passkey_cloned` when the sign counter went backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, response]
              properties:
                challenge_id: { type: string }
                response: { type: object, description: "The PublicKeyCredential as JSON (credential.toJSON())" }
                next: { type: string, description: A path on this dashboard to land on }
      responses:
        "201": { description: Session cookie set, content: { application/json: { schema: { type: object, required: [csrf_token, next], properties: { csrf_token: { type: string }, next: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "410": { description: "The passkey prompt expired or was already answered", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods:
    get:
      operationId: listSignInMethods
      tags: [accounts]
      summary: How the signed-in person signs in (Google, email addresses)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignInMethodList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/sign-in-methods/email/start:
    post:
      operationId: startEmailLink
      tags: [accounts]
      summary: Send a code to an address the signed-in person wants to sign in with too
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202": { description: Code sent, content: { application/json: { schema: { $ref: "#/components/schemas/EmailCodeSent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "The email could not be sent", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/email/verify:
    post:
      operationId: verifyEmailLink
      tags: [accounts]
      summary: Add the address as a sign-in method with its code
      description: 409 `identity_taken` when the address already signs in another person.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignInMethodList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "410": { description: "The code expired, was used, was replaced by a newer one or had too many wrong tries", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/email/change/current/start:
    post:
      operationId: startEmailChange
      tags: [accounts]
      summary: Changing the email sign-in address, step 1 - send a code to the current address
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, description: The address the person signs in with now } } } } }
      responses:
        "202": { description: Code sent, content: { application/json: { schema: { $ref: "#/components/schemas/EmailCodeSent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "The email could not be sent", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/email/change/current/verify:
    post:
      operationId: verifyEmailChangeCurrent
      tags: [accounts]
      summary: Changing the email sign-in address, step 1 - confirm the current address with its code
      description: The confirmation works for 10 minutes, while the person asks for and enters the code to the new address.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string } } } } }
      responses:
        "204": { description: Current address confirmed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "410": { description: "The code expired, was used, was replaced by a newer one or had too many wrong tries", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/email/change/new/start:
    post:
      operationId: startEmailChangeNew
      tags: [accounts]
      summary: Changing the email sign-in address, step 2 - send a code to the new address
      description: 409 `change_not_verified` until the current address is confirmed (step 1).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, new_email], properties: { email: { type: string }, new_email: { type: string } } } } }
      responses:
        "202": { description: Code sent, content: { application/json: { schema: { $ref: "#/components/schemas/EmailCodeSent" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "The email could not be sent", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/email/change/new/verify:
    post:
      operationId: verifyEmailChangeNew
      tags: [accounts]
      summary: Changing the email sign-in address, step 2 - change it with the new address's code
      description: |
        The person signs in with the new address from now on (the same person, sessions and other methods);
        the old address gets a notice. 409 `identity_taken` when the new address already signs in another
        person, `change_not_verified` when the step 1 confirmation expired.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, new_email, code], properties: { email: { type: string }, new_email: { type: string }, code: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignInMethodList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "410": { description: "The code expired, was used, was replaced by a newer one or had too many wrong tries", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/account/sign-in-methods/passkey/start:
    post:
      operationId: startPasskeyRegistration
      tags: [accounts]
      summary: Start adding a passkey
      description: Returns the options for `navigator.credentials.create` (a discoverable credential); passkeys the person has are excluded.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyChallenge" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account/sign-in-methods/passkey/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [accounts]
      summary: Add the passkey from the browser's answer
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
