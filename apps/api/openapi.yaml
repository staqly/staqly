      security: []
      summary: The preview page's content, as each channel will show the post (no credentials; the token is the key)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicPreview" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
