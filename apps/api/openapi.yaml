        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/{id}/test:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: testChannel
      tags: [channels]
      summary: Check the stored credentials against the platform (channels:manage)
      description: Rate-limited per principal (burst 5, then 10 per minute). A failing check marks the channel `needs_reconnect`; a passing one clears it.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: Result of the check (platform errors are reported, not raised)
          content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, error: { type: string }, profile: { type: object, additionalProperties: true, description: "What the platform knows the account as (handle, name, avatar_url, profile_url)" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/channels/telegram/connect:
    post:
      operationId: startTelegramConnect
      tags: [channels]
      summary: A code to connect a Telegram chat through the server's bot (channels:manage)
      description: |
        Add the server's bot (`bot` in GET /v1/providers) to the channel or group, as an administrator allowed to
        post in a channel, then send the `command` (`/connect CODE`) there. The server's bot finds it, checks the
        chat and connects it as a channel of this workspace (in `group_id`, else Default); GET the code to see it.
        A code lasts 10 minutes. 409 `not_available` when the server has no bot of its own (connect with
        `credential_fields` then).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { group_id: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TelegramConnect" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/channels/telegram/connect/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTelegramConnect
      tags: [channels]
      summary: Whether the chat for a Telegram connect code is connected yet (channels:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TelegramConnect" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/channels/{id}/options/{key}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: key, in: path, required: true, description: "A settings field of kind remote", schema: { type: string } }
    get:
      operationId: listChannelOptions
      tags: [channels]
      summary: The choices of a channel's remote setting, from its platform (channels:read)
      description: For Slack, `channel` lists the workspace's channels a post can go to (every public one and the private ones the app was invited to).
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string }, icon: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List publishing schedules (posts:read)
      parameters:
        - { name: collection_id, in: query, description: A collection id or exact name, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Schedule" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a publishing schedule (schedules:manage)
      description: |
        `kind` once (`run_at` in the future) or recurring (`rule`: `times` with optional `weekdays` in
        `tz`, or `every_minutes`). At each run the schedule picks posts of its collection (`pick`:
        `next`, the oldest waiting draft; `selected`, the `post_ids`; `all`) and publishes them to its
        `channels` (a post's own targets win). When nothing waits, `source` decides: `none`, `agent`
        (emit `schedule.posts_requested` and list it on GET /v1/work) or `endpoint` (POST to
        `endpoint_url`, signed like a webhook with `endpoint_secret`, which answers `{posts: [...]}`).
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/ScheduleInput" }, { required: [collection, kind] }] } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/schedules/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Get a schedule (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Change a schedule (schedules:manage); the next run is recomputed
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule (schedules:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/schedules/{id}/run:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: runSchedule
      tags: [schedules]
      summary: Run a schedule now; its regular next run is unchanged (schedules:manage)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: The background queue, newest first (posts:read)
      description: Publish runs (one job per post and one per target), target timeouts, schedule runs, replies, reposts and token refreshes. Done, failed and cancelled jobs are kept for 7 days.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, done, failed, cancelled] } }
        - { name: kind, in: query, schema: { type: string, enum: [publish_post, publish_target, target_timeout, run_schedule, refresh_channel, repeat_post, publish_reply, repost, notify_people, notify_person] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JobPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/jobs/stats:
    get:
      operationId: jobStats
      tags: [jobs]
      summary: Queue counts (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JobStats" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job (posts:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/jobs/{id}/retry:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Queue a failed job again, now (posts:publish)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a queued job (posts:publish)
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/agents:
    get:
      operationId: listAgents
      tags: [auth]
      summary: Agents seen talking to the workspace, most recently active first
      description: >-
        Recorded automatically: MCP clients by their clientInfo (Claude Code, Codex, Cursor...), REST clients by
        their User-Agent (an SDK's appended user agent names the agent), per credential. Browsers are not agents.
        Needs admin: it names the API keys agents use. At most 200 agents are kept per workspace.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/agents/{id}:
    delete:
      operationId: forgetAgent
      tags: [auth]
      summary: Remove an agent from the list (it comes back when it talks to the workspace again)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media:
    get:
      operationId: listMedia
      tags: [media]
      summary: The media library (media:read), newest first by default
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Part of the file name (case-insensitive) }
        - { name: kind, in: query, schema: { type: string, enum: [image, video, audio] } }
        - { name: used, in: query, schema: { type: string, enum: [used, unused] }, description: "used (posts carry it) or unused" }
        - { name: folder, in: query, schema: { type: string }, description: "A folder id (files directly in it) or root (the top level); omit for every folder" }
        - { name: tag, in: query, schema: { type: string }, description: "Files carrying this tag (normalised like on save: lowercase, no #)" }
        - { name: deleted, in: query, schema: { type: boolean, default: false }, description: "true lists the files in Deleted (each with deleted_at and purge_at) instead of the library" }
        - { name: duplicates, in: query, schema: { type: boolean, default: false }, description: "true lists only files with an identical twin (same sha256), grouped by content, oldest first" }
        - { name: sort, in: query, schema: { type: string, enum: [created_desc, created_asc, size_desc, name_asc], default: created_desc } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/MediaPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a file (media:write). Type is detected from content; SVG/HTML are rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/delete:
    post:
      operationId: deleteMediaMany
      tags: [media]
      summary: Move several files to Deleted, or delete them for good with permanent (posts:delete)
      description: "Moving to Deleted is refused (409) when a scheduled post uses one of the files; nothing moves then. With `permanent`, posts referencing the files lose them."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                permanent: { type: boolean, default: false, description: "Delete for good now instead of moving to Deleted" }
      responses:
        "200":
          description: What was deleted and which ids were not found
          content:
            application/json:
              schema:
                type: object
                required: [deleted, missing]
                properties:
                  deleted: { type: array, items: { type: string } }
                  missing: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/bulk:
    post:
      operationId: bulkUpdateMedia
      tags: [media]
      summary: Move several files to a folder and/or add and remove tags (media:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                folder_id: { type: string, description: "A folder id, or empty for the top level; omit to leave folders alone" }
                add_tags: { type: array, items: { type: string } }
                remove_tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: Which files changed and which ids were not found
          content:
            application/json:
              schema:
                type: object
                required: [updated, missing]
