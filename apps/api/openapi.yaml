    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      operationId: testChannel
      tags: [channels]
      summary: Check the stored credentials against the platform (channels:manage)
      description: Rate-limited per principal (burst 5, then 10 per minute). A failing check marks the channel `needs_reconnect`; a passing one clears it.
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          description: Result of the check (platform errors are reported, not raised)
          content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, error: { type: string }, profile: { type: object, additionalProperties: true, description: "What the platform knows the account as (handle, name, avatar_url, profile_url)" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
